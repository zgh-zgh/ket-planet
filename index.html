/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

/* ================= 单词搜索 ================= */
// 构建全库索引（word -> {w,cn,lv}）
const ALL_WORDS = [];
LEVELS.forEach(lv=>{
  (WORD_DB[lv]||[]).forEach(([w,cn])=>{ ALL_WORDS.push({w, cn, lv}); });
});
function onSearch(q){
  const box = $("#searchResult");
  if(!q || !q.trim()){ box.classList.remove("show"); return; }
  const kw = q.trim().toLowerCase();
  const hits = ALL_WORDS.filter(x=>x.w.toLowerCase().startsWith(kw)).slice(0,12);
  if(hits.length===0){ box.classList.remove("show"); return; }
  box.innerHTML = hits.map((h,i)=>`<div class="sr-item" onclick="jumpToWord(${i})" data-idx="${i}">` +
    `<span class="sr-word">${h.w}</span><span class="sr-cn">${h.cn.slice(0,20)}</span>` +
    `<span class="sr-cn" style="float:right">${h.lv}</span></div>`).join("");
  box.classList.add("show");
  box._hits = hits;
}
function jumpToWord(i){
  const hits = $("#searchResult")._hits || [];
  const hit = hits[i];
  if(!hit) return;
  // 切换到对应级别，并定位到该词
  const lvIdx = LEVELS.indexOf(hit.lv);
  if(lvIdx < 0) return;
  // 搜索的是内置词库：退出自定义词库，避免"显示搜索词、批次却是词库"
  if(getActiveDeckId() !== null || activeCustomWords){
    setActiveDeckId(null);
    activeCustomWords = null;
  }
  currentGroup = lvIdx;
  // 从该级别完整词库中定位目标词（不是当前15词批次），并重建批次：目标词放首位
  const pool = GROUPS[lvIdx].words;
  const target = pool.find(x=>x.word.toLowerCase()===hit.w.toLowerCase());
  if(!target) return;
  const rest = pool.filter(x=>x !== target);
  currentBatch = [target].concat(shuffle(rest).slice(0, BATCH_SIZE-1));
  learnIndex = 0;
  currentStep = 0;
  appMode = 'learn';
  lastStudyStep = 0;
  resetBatchState();
  $("#searchInput").value = "";
  $("#searchResult").classList.remove("show");
  renderAll();
  pushRoute();
  toast(`已定位到 ${hit.w}`);
}

/* ================= 音频 ================= */
let currentAudio = null;
let playing = false;
// 播放代次：每次停止/切换自增，旧的异步播放链检测到代次变化即退出，避免“旧朗读串到新单词”
let playToken = 0;
let learnAudioTimer = null;   // 学习页自动发音的延时器，切页时必须清掉
function stopAudio(){
  playToken++;
  if(learnAudioTimer){ clearTimeout(learnAudioTimer); learnAudioTimer = null; }
  if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; }
  if(window.speechSynthesis){ try{speechSynthesis.cancel();}catch(e){} }
  playing = false;
}

/* ---- 朗读语速档位（标准 / 快速）：师生可自主切换，选择记忆在本机 ---- */
// rate/gap 用于音节拆分朗读；sentRate 用于例句 / 短文整句朗读（整句默认自然语速，更利于听力训练）
const SPEED_LEVELS = {
  standard: { label:"标准", rate:"+10%", gap:170, sentRate:"+0%" },   // 音节比原来默认语速略快，解决拖沓
  fast:     { label:"快速", rate:"+30%", gap:100, sentRate:"+20%" },   // 更利落，适合复习/连读训练
};
const LS_SPEED = "lx_speak_speed";
function getSpeedKey(){
  try{ const v = localStorage.getItem(LS_SPEED); if(v && SPEED_LEVELS[v]) return v; }catch(e){}
  return "standard";
}
function speedCfg(){ return SPEED_LEVELS[getSpeedKey()] || SPEED_LEVELS.standard; }
function setSpeakSpeed(key){
  if(!SPEED_LEVELS[key]) return;
  try{ localStorage.setItem(LS_SPEED, key); }catch(e){}
  // 同一页面可能有多处语速开关（单词区 / 例句区 / 短文区），统一同步
  document.querySelectorAll(".speed-switch .ss-btn").forEach(b=>{
    b.classList.toggle("on", b.dataset.speed === key);
  });
}
// 语速开关控件（复用于单词区、例句区、短文区）
function speedSwitchHtml(cls){
  const cur = getSpeedKey();
  return `<div class="speed-switch ${cls||''}" title="朗读语速档位">
      <span class="ss-label">语速</span>
      <button class="ss-btn ${cur==='standard'?'on':''}" data-speed="standard" onclick="setSpeakSpeed('standard')">标准</button>
      <button class="ss-btn ${cur==='fast'?'on':''}" data-speed="fast" onclick="setSpeakSpeed('fast')">快速</button>
    </div>`;
}

/* ---- TTS 音频预取缓存：先并行下载再按序播放，消除逐段等接口的空档 ---- */
const TTS_MAX_CACHE = 200;             // 单次会话最多缓存 200 段音频，避免内存膨胀
const ttsCache = new Map();            // key -> Promise<objectURL>
function ttsUrl(text, rate){
  return "/api/tts?text=" + encodeURIComponent(text) + "&lang=en-US&rate=" + encodeURIComponent(rate || "+0%");
}
function prefetchTTS(text, rate){
  const key = (rate || "+0%") + "|" + text;
  const hit = ttsCache.get(key);
  if(hit) return hit;
  const p = (async ()=>{
    const resp = await fetch(ttsUrl(text, rate));
    if(!resp.ok) throw new Error("tts " + resp.status);
    const blob = await resp.blob();
    if(!blob.size) throw new Error("tts empty");
    return URL.createObjectURL(blob);
  })();
  ttsCache.set(key, p);
  p.catch(()=>{ ttsCache.delete(key); });
  if(ttsCache.size > TTS_MAX_CACHE){
    const oldestKey = ttsCache.keys().next().value;
    const oldest = ttsCache.get(oldestKey);
    ttsCache.delete(oldestKey);
    if(oldest) oldest.then(u=>URL.revokeObjectURL(u)).catch(()=>{});
  }
  return p;
}
// 播放一个音频地址：正常放完 resolve(true)；被 pause/出错 resolve(false)
function playMediaUrl(url){
  return new Promise(resolve=>{
    const a = new Audio(url);
    currentAudio = a;
    let done = false;
    const finish = ok=>{ if(done) return; done = true; resolve(ok); };
    a.onended = ()=>finish(true);
    a.onerror = ()=>finish(false);
    a.onpause = ()=>{ if(!a.ended) finish(false); };
    a.play().catch(()=>finish(false));
  });
}
const sleep = ms => new Promise(r=>setTimeout(r, ms));
// 最后一道兜底：TTS 接口整体不可用时，用浏览器内置语音朗读，至少不静音
const rateToRatio = r => { const n = parseInt(String(r).replace("%",""),10); return isNaN(n) ? 1 : Math.min(2, Math.max(0.5, 1 + n/100)); };
function speakFallback(text, rateStr){
  return new Promise(resolve=>{
    if(!window.speechSynthesis) return resolve(false);
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "en-US"; u.rate = rateToRatio(rateStr);
      const vs = speechSynthesis.getVoices();
      const en = vs.find(v=>/^en(-|_)/i.test(v.lang)) || vs.find(v=>/en/i.test(v.lang));
      if(en) u.voice = en;
      let done = false;
      const fin = ok=>{ if(done) return; done = true; resolve(ok); };
      u.onend = ()=>fin(true);
      u.onerror = ()=>fin(false);
      speechSynthesis.speak(u);
      setTimeout(()=>fin(false), 4000);
    }catch(e){ resolve(false); }
  });
}
function playWordAudio(word, onEnd){
  stopAudio();
  const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
  currentAudio = a;
  a.play().then(()=>{}).catch(()=>{
    playTTS(word, onEnd);
  });
  if(onEnd) a.onended = onEnd;
}
function speakTTS(text, onEnd){
  try{
    if(!window.speechSynthesis){ toast("当前浏览器不支持发音"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .85;
    const voices = speechSynthesis.getVoices();
    const en = voices.find(v=>/^en(-|_)/i.test(v.lang)) || voices.find(v=>/en/i.test(v.lang));
    if(en) u.voice = en;
    if(onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  }catch(e){ toast("发音失败"); }
}
// 通用：用 edge-tts 播放文本（整句/音节/单词兜底统一走 /api/tts，微软神经网络音色）
// rateVal 省略时用默认自然语速，不跟随“音节拆分朗读”的加速档位
function playTTS(text, onEnd, rateVal){
  const a = new Audio(ttsUrl(text, rateVal || "+0%"));
  currentAudio = a;
  if(onEnd) a.onended = onEnd;
  a.onerror = ()=>{ if(onEnd) onEnd(); };
  a.play().catch(()=>{ if(onEnd) onEnd(); });
}
// 例句整句朗读（edge-tts 自然整句，不再是逐词读）；语速跟随「标准 / 快速」档位
function speakSentence(sentence){
  stopAudio();
  const plain = sentence.replace(/<[^>]+>/g,"");
  playTTS(plain, null, speedCfg().sentRate);
}
// 长文本（篇章短文）朗读：按句子切成 ≤450 字符的片段顺序播放，
// 否则整篇 200–350 词会超过 TTS 接口 600 字上限，直接没有声音
function speakLongText(text){
  stopAudio();
  const plain = String(text||'').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  if(!plain) return;
  const parts = [];
  let buf = '';
  const sentences = plain.match(/[^.!?]+[.!?]*\s*/g) || [plain];
  for(const seg of sentences){
    if(buf && (buf + seg).length > 450){ parts.push(buf.trim()); buf = ''; }
    buf += seg;
    while(buf.length > 450){ parts.push(buf.slice(0, 450).trim()); buf = buf.slice(450); }
  }
  if(buf.trim()) parts.push(buf.trim());
  const token = playToken;          // 切页/重新播放时代次变化，链路自动中断
  const rate = speedCfg().sentRate;
  let i = 0;
  const next = () => {
    if(token !== playToken || i >= parts.length) return;
    playTTS(parts[i++], next, rate);
  };
  next();
}
function speakWords(sentence){
  const wordsArr = sentence.replace(/[^\w\s']/g," ").split(/\s+/).filter(w=>w.length>0);
  let i=0;
  (function playNext(){
    if(i>=wordsArr.length) return;
    const w = wordsArr[i];
    const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(w)+"&type=2");
    currentAudio = a;
    a.onended = ()=>{ i++; playNext(); };
    a.onerror = ()=>{ i++; playNext(); };
    a.play().catch(()=>{ i++; playNext(); });
  })();
}
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }

/* ================= 音节拆分朗读 ================= */
// 播放音节分段：逐段读（当前段标红），全部读完后再整词朗读 2 遍
// 优化：① 先并行预取全部片段音频，播放时零等待，节奏不再一卡一顿
//      ② 段间停顿按档位收紧（标准 170ms / 快速 100ms）
//      ③ 换词或重播时旧播放链自动中断，不会串音
async function playSyllables(wordData){
  stopAudio();
  if(!wordData) return;
  revealSyllables();                              // 点「逐段朗读」才把单词拆开，并显示在整词下方
  const token = playToken;                       // 本次播放的“代次”
  const sp = speedCfg();
  const word = wordData.word;
  // 显示分段 vs 朗读分段：数量一致时用发音式切点替换朗读文本
  const readSegs = readSyllables(word);
  const syls = (readSegs && readSegs.length === (wordData.syllables || []).length)
    ? readSegs.map(text => ({ text }))
    : (wordData.syllables || []).filter(s=>s && s.text);
  const sylEls = Array.from(document.querySelectorAll("#sylSplit .syl"));
  playing = true;

  // 并行预取：第一段开始播时，后面的片段已在下载，抵消接口延迟
  syls.forEach(s=>prefetchTTS(s.text, sp.rate).catch(()=>{}));

  for(let i=0;i<syls.length;i++){
    if(token !== playToken) return;               // 已被打断
    sylEls.forEach((el,k)=>el.classList.toggle("active", k===i));
    let ok = false;
    try{
      const url = await prefetchTTS(syls[i].text, sp.rate);
      if(token !== playToken) return;
      ok = await playMediaUrl(url);
    }catch(e){
      // 预取失败（接口异常/离线）→ 退回直连音频流，保证仍有声
      if(token !== playToken) return;
      ok = await playMediaUrl(ttsUrl(syls[i].text, sp.rate));
    }
    if(token !== playToken) return;
    if(!ok){                                        // 两条音频链路都失败 → 浏览器语音兜底
      ok = await speakFallback(syls[i].text, sp.rate);
      if(token !== playToken) return;
    }
    if(i < syls.length-1) await sleep(sp.gap);    // 段间气口，按档位收紧
  }

  if(token !== playToken) return;
  // 音节读完后，完整单词朗读 2 遍
  const youdaoUrl = "https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2";
  for(let n=0;n<2;n++){
    if(token !== playToken) return;
    const ok = await playMediaUrl(youdaoUrl);
    if(token !== playToken) return;
    if(!ok){                                       // 有道音源缺失 → edge-tts 兜底
      let ok2 = false;
      try{
        const url = await prefetchTTS(word, sp.rate);
        if(token !== playToken) return;
        ok2 = await playMediaUrl(url);
      }catch(e){}
      if(token !== playToken) return;
      if(!ok2) await speakFallback(word, sp.rate); // 仍失败 → 浏览器语音兜底
      if(token !== playToken) return;
    }
    if(n === 0) await sleep(240);                  // 两遍之间留一点气口，听得清是两遍
  }
  if(token !== playToken) return;
  sylEls.forEach(el=>el.classList.remove("active"));
  playing = false;
}

/* ---- 单段试读：点哪个音节读哪个音节，读完自动取消高亮 ---- */
async function playSylAt(i){
  const w = words()[learnIndex];
  if(!w) return;
  revealSyllables();
  const read = readSyllables(w.word);
  const syls = (read && read.length === (w.syllables || []).length)
    ? read : (w.syllables || []).map(s => s.text);
  const text = String(syls[i] || '').trim();
  if(!text) return;
  stopAudio();
  const token = playToken;
  const els = Array.from(document.querySelectorAll("#sylSplit .syl"));
  els.forEach((el, k) => el.classList.toggle("active", k === i));
  const sp = speedCfg();
  let ok = false;
  try{
    const url = await prefetchTTS(text, sp.rate);
    if(token !== playToken) return;
    ok = await playMediaUrl(url);
  }catch(e){}
  if(token !== playToken) return;
  if(!ok) await speakFallback(text, sp.rate);
  if(token !== playToken) return;
  setTimeout(() => {
    if(token !== playToken) return;
    els.forEach(el => el.classList.remove("active"));
  }, 240);
}

/* ================= 学习页交互：按需拆音节 / 例句点词 / 译文开关 ================= */

/* 音节按需拆分：默认整词显示，点「逐段朗读」才展开到单词下方 */
function revealSyllables(){

/* 例句里的单词包成可点节点：只在 HTML 标签之外替换，保留 <b> 原词高亮 */
function wrapClickWords(html){
  return String(html).split(/(<[^>]*>)/).map(seg=>{
    if(!seg) return seg;
    if(seg.charAt(0) === "<") return seg;
    return seg.replace(/[A-Za-z][A-Za-z'’\-]*/g, m =>
      `<span class="w" data-w="${m}">${m}</span>`);

/* 例句译文开关：默认收起，点一下在英文下面展开 */
function toggleExTrans(btn){

/* ---- 例句点词卡：释义 + 发音 + 一键跳到该词的词汇认知页 ---- */
let wordPopEl = null;
function lookupWordLocal(word){
  const lw = String(word || "").toLowerCase();
  let cn = "";
  try{ cn = vocabCnMap()[lw] || ""; }catch(e){}
  const ec = (typeof ECDICT_DATA !== "undefined" && ECDICT_DATA[lw]) || null;
  const ph = ec && ec.ph ? "/" + normIpa(ec.ph) + "/" : "";
  return { cn: String(cn).replace(/\[网络\]/g, "").trim(), ph };
}
function findWordAnywhere(word){
  const lw = String(word || "").toLowerCase();
  const cur = words().find(x => String(x.word).toLowerCase() === lw);
  if(cur) return cur;
  const hit = ALL_WORDS.find(x => x.w.toLowerCase() === lw);
  return hit || null;
}
function closeWordPop(){
  if(wordPopEl){ wordPopEl.remove(); wordPopEl = null; }
  document.querySelectorAll(".example .w.on").forEach(e => e.classList.remove("on"));
}
function positionWordPop(pop, rect){
  const pad = 8;
  const w = pop.offsetWidth, h = pop.offsetHeight;
  let left = rect.left + rect.width / 2 - w / 2;
  left = Math.max(pad, Math.min(window.innerWidth - w - pad, left));
  let top = rect.bottom + 8;
  if(top + h > window.innerHeight - pad) top = Math.max(pad, rect.top - h - 8);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}
function openWordPop(el){
  const word = String((el && el.dataset && el.dataset.w) || (el && el.textContent) || "").trim();
  if(!word) return;
  // 再点同一个词 = 收起
  if(wordPopEl && wordPopEl.dataset.w === word && el.classList.contains("on")){ closeWordPop(); return; }
  closeWordPop();
  el.classList.add("on");
  const info = lookupWordLocal(word);
  const inLib = !!findWordAnywhere(word);
  const pop = document.createElement("div");
  pop.className = "word-pop";
  pop.dataset.w = word;
  pop.innerHTML = `
    <button class="wp-close" aria-label="关闭">✕</button>
    <div class="wp-head"><span class="wp-word">${escapeHtml(word)}</span>${info.ph ? `<span class="wp-ph">${escapeHtml(info.ph)}</span>` : ""}</div>
    <div class="wp-cn">${info.cn ? escapeHtml(info.cn) : '<span class="wp-wait">释义查询中…</span>'}</div>
    <div class="wp-acts">
      <button class="wp-btn wp-say">🔊 发音</button>
      <button class="wp-btn wp-go"${inLib ? "" : ' disabled title="当前词库里没有这个词"'}>${inLib ? "去学习 →" : "词库中暂无"}</button>
    </div>`;
  document.body.appendChild(pop);
  wordPopEl = pop;
  pop._anchor = el;
  pop._rect = el.getBoundingClientRect();
  positionWordPop(pop, pop._rect);
  pop.querySelector(".wp-close").onclick = closeWordPop;
  pop.querySelector(".wp-say").onclick = () => playWordAudio(word);
  const go = pop.querySelector(".wp-go");
  if(inLib) go.onclick = () => jumpToWordByName(word);
  if(!info.cn) fillPopMeaning(pop, word);
}
// 本地词库没有的词，走服务端查一个中文释义（有道词典中转）
async function fillPopMeaning(pop, word){
  const box = pop && pop.querySelector(".wp-cn");
  if(!box) return;
  try{
    const r = await fetch("/api/lookup?q=" + encodeURIComponent(word));
    if(!r.ok) throw new Error("http " + r.status);
    const d = await r.json();
    if(wordPopEl !== pop) return;               // 卡片已经被关掉/换词
    const cn = String(d.cn || "").trim();
    const ph = String(d.ph || "").trim();
    box.innerHTML = cn ? escapeHtml(cn) : '<span class="wp-wait">暂无释义</span>';
    if(ph && !pop.querySelector(".wp-ph")){
      const s = document.createElement("span");
      s.className = "wp-ph"; s.textContent = ph;
      pop.querySelector(".wp-head").appendChild(s);
    }
    if(pop._rect) positionWordPop(pop, pop._rect);
  }catch(e){
    if(wordPopEl === pop && box) box.innerHTML = '<span class="wp-wait">释义获取失败，可先听发音</span>';
  }
}
/* 一键跳到某个词的词汇认知页：当前批次有就直接切，没有就按学段定位并重建批次 */
function jumpToWordByName(word){
  const lw = String(word || "").toLowerCase();
  if(!lw) return;
  closeWordPop();
  const curIdx = words().findIndex(x => String(x.word).toLowerCase() === lw);
  if(curIdx >= 0){
    learnIndex = curIdx; currentStep = 0; appMode = "learn"; lastStudyStep = 0;
    renderAll(); pushRoute();
    return;
  }
  const hit = ALL_WORDS.find(x => x.w.toLowerCase() === lw);
  if(!hit){ toast(`「${word}」不在词库里`); return; }
  const lvIdx = LEVELS.indexOf(hit.lv);
  if(lvIdx < 0){ toast(`「${word}」不在词库里`); return; }
  // 跨级别不能混批：先记下原来是不是同一学段、是不是自定义词库
  const sameLevel = !activeCustomWords && lvIdx === currentGroup && currentBatch.length > 0;
  if(getActiveDeckId() !== null || activeCustomWords){
    setActiveDeckId(null);
    activeCustomWords = null;
  }
  const pool = GROUPS[lvIdx].words;
  const target = pool.find(x => x.word.toLowerCase() === lw);
  if(!target){ toast(`「${word}」不在词库里`); return; }
  // 同级别：把词插进当前批次，原批次保留，看完还能接着学
  // 跨级别：目标词放首位、按该学段重建批次
  if(sameLevel){
    if(!currentBatch.some(x => String(x.word).toLowerCase() === lw)) currentBatch.push(target);
    learnIndex = currentBatch.findIndex(x => String(x.word).toLowerCase() === lw);
  } else {
    currentGroup = lvIdx;
    currentBatch = [target].concat(shuffle(pool.filter(x => x !== target)).slice(0, BATCH_SIZE - 1));
    learnIndex = 0;
  }
  currentStep = 0;
  appMode = "learn";
  lastStudyStep = 0;
  resetBatchState();
  renderAll();
  pushRoute();
  toast(`已定位到 ${target.word}`);
}
// 点例句空白处 / 滚动 / Esc 都收起卡片
document.addEventListener("click", (e)=>{
  const hit = e.target && e.target.closest ? e.target.closest(".example .w") : null;
  if(hit){ openWordPop(hit); return; }

/* ================= 词汇发散：词根拆解 + 词族（可折叠）+ 近义词辨析 ================= */
let VOCAB_CN = null;
function vocabCnMap(){
  if(VOCAB_CN) return VOCAB_CN;
  VOCAB_CN = Object.create(null);
  for(const lv of Object.keys(WORD_DB)) for(const [w,cn] of WORD_DB[lv]) VOCAB_CN[w.toLowerCase()] = cn;
  return VOCAB_CN;
}
let FAM_IDX = null;
function famIndex(){
  if(FAM_IDX) return FAM_IDX;
  FAM_IDX = { byWord:new Map(), roots:{}, fams:{}, w2f:{}, pfx:{}, sfx:{} };
  if(typeof FAMILY_DATA === 'undefined') return FAM_IDX;
  const d = FAMILY_DATA;
  FAM_IDX.roots = d.roots || {};
  FAM_IDX.fams = d.fams || {};
  FAM_IDX.w2f = d.w2f || {};
  FAM_IDX.pfx = (d.meta && d.meta.pfx) || {};
  FAM_IDX.free = (d.meta && d.meta.free) || {};
  // 透明构词补充（re+fuel 这类词典派生数据缺失的词）
  FAM_IDX.morph = (typeof MORPH_DATA !== 'undefined' && MORPH_DATA) ? MORPH_DATA : {};
  for(const k in FAM_IDX.morph){
    const mm = FAM_IDX.morph[k];
    if(!mm || !mm.root) continue;
    if(!FAM_IDX.byWord.has(k)) FAM_IDX.byWord.set(k, { root: mm.root, m: mm.m || '', pre: mm.pre || '', suf: '' });
  }
  FAM_IDX.sfx = (d.meta && d.meta.sfx) || {};
  for(const root in FAM_IDX.roots){
    for(const it of FAM_IDX.roots[root].w){
      FAM_IDX.byWord.set(String(it[0]).toLowerCase(), { root, m: FAM_IDX.roots[root].m, pre: it[3] || '', suf: it[4] || '' });
    }
  }
  return FAM_IDX;
}
// 词族成员 → {w, ph, cn}：数据里词表内只存词形，音标/释义在此回填
function famMember(item){
  const w = item[0];
  const lw = w.toLowerCase();
  let ph = item[1] || '', cn = item[2] || '';
  if(!ph && typeof ECDICT_DATA !== 'undefined' && ECDICT_DATA[lw] && ECDICT_DATA[lw].ph){
    // ECDICT 用 ' 表重音、: 表长音，转成国际音标符号
    ph = '/' + String(ECDICT_DATA[lw].ph).replace(/'/g, 'ˈ').replace(/:/g, 'ː') + '/';
  }
  if(!cn) cn = vocabCnMap()[lw] || '';
  cn = cn.replace(/\[网络\]/g, '').trim();
  if(cn.length > 30) cn = cn.slice(0, 30) + '…';
  return { w, ph, cn };
}
// 选哪套词族：词根"透明"（词根本身是常用词，如 view/form/port）→ 用词根族；否则用有道同根词族
function pickFamily(w){
  const idx = famIndex();
  const key = w.word.toLowerCase();
  // 优先：人工核订的透明构词（refuel = re + fuel），数据来自词典逐词校验
  const cur = idx.morph && idx.morph[key];
  if(cur){
    const list = [];
    for(const it of (cur.fam || [])){
      const mm = famMember(it);
      if(mm.w.toLowerCase() === key) continue;
      list.push(mm);
    }
    const bare = String(cur.m || '').replace(/^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|aux)\.\s*/i, '');
    return { rinfo: { root: cur.root, m: bare, pre: cur.pre || '', suf: '' }, list, useRoot: true, rootMeaning: bare };
  }
  const rinfo = idx.byWord.get(key);
  const famKey = idx.w2f[key];
  const stem = famKey ? (idx.fams[famKey] || []) : [];
  const root = rinfo ? (idx.roots[rinfo.root] ? idx.roots[rinfo.root].w : []) : [];
  const rootIsWord = !!(rinfo && vocabCnMap()[rinfo.root]);
  const useRoot = !!(rinfo && root.length >= 2 && (rootIsWord || stem.length < 2));
  const raw = useRoot ? root : stem;
  const list = [], seen = new Set([key]);
  for(const it of raw){
    const m = famMember(it);
    const k = m.w.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k);
    list.push(m);
  }
  return { rinfo, list, useRoot, rootMeaning: rinfo ? rinfo.m : '' };
}
function renderVocabFamily(w){
  const idx = famIndex();
  const { rinfo, list } = pickFamily(w);
  const syn = (typeof SYNONYM_DATA !== 'undefined') ? SYNONYM_DATA[w.word.toLowerCase()] : null;
  if(!rinfo && !list.length && !syn) return '';

  let html = '<h3>🧬 词汇发散 · 词根与词族</h3><div class="vf-card">';

  // ① 词根拆解
  if(rinfo){
    const preM = rinfo.pre ? (idx.pfx[rinfo.pre] || '') : '';
    const isCompound = !!(rinfo.suf && idx.free[rinfo.suf] && !idx.sfx[rinfo.suf]);
    const sufM = rinfo.suf ? (isCompound ? idx.free[rinfo.suf] : (idx.sfx[rinfo.suf] || '')) : '';
    const sufLabel = isCompound ? '复合' : '后缀';
    const parts = [];
    if(rinfo.pre) parts.push(`<span class="vf-part"><code>${rinfo.pre}-</code><span class="vf-tag">前缀</span>${preM || '—'}</span>`);
    parts.push(`<span class="vf-part"><code>${rinfo.root}</code><span class="vf-tag">词根</span>${rinfo.m}</span>`);
    if(rinfo.suf) parts.push(`<span class="vf-part"><code>${isCompound ? '+' + rinfo.suf : '-' + rinfo.suf}</code><span class="vf-tag">${sufLabel}</span>${sufM || '—'}</span>`);
    const formula = [
      rinfo.pre ? `${rinfo.pre}（${preM || '前缀'}）` : '',
      `${rinfo.root}（${rinfo.m}）`,
      rinfo.suf ? `${rinfo.suf}（${sufM || sufLabel}）` : ''
    ].filter(Boolean).join(' + ');
    const coreCn = String(w.cn || '').split(/[，；,;]/)[0].replace(/^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|aux|modal|abbr)\.\s*/i, '');
    html += `<div class="vf-sec">
      <div class="vf-title">词根拆解</div>
      <div class="vf-parts">${parts.join('')}</div>
      <div class="vf-eq"><b>${w.word}</b> = ${formula}${coreCn ? `　→　引申为：<b>${coreCn}</b>` : ''}</div>
    </div>`;
  }

  // ② 词族（默认 5 个，可展开）
  if(list.length){
    const CORE = 5;
    const items = list.map((m, i) => `<div class="fam-item${i >= CORE ? ' fam-extra' : ''}">
        <span class="fam-w">${i + 1}. ${m.w}</span>
        <span class="fam-ph">${m.ph || ''}</span>
        <span class="fam-cn">${m.cn || '—'}</span>
      </div>`).join('');
    const more = list.length - CORE;
    html += `<div class="vf-sec">
      <div class="vf-title">同源词 / 派生词 <span class="vf-num">共 ${list.length} 个</span></div>
      <div class="fam-list collapsed" data-count="${list.length}">${items}</div>
      ${more > 0 ? `<button class="fam-toggle" onclick="toggleFamily(this)">展开全部 ${list.length} 个 ▾</button>` : ''}
    </div>`;
  }

  // ③ 近义词辨析
  if(syn){
    html += `<div class="vf-sec">
      <div class="vf-title">近义词辨析 <span class="vf-num">${syn.topic}</span></div>
      <div class="syn-group">
        ${syn.words.map(it => `<div class="syn-row"><span class="syn-w">${it.w}</span><span class="syn-d">${it.d}</span></div>`).join('')}
      </div>
    </div>`;
  }

  return html + '</div>';
}
function toggleFamily(btn){
  const list = btn.previousElementSibling;
  if(!list) return;
  const collapsed = list.classList.toggle('collapsed');
  const n = list.dataset.count || '';
  btn.textContent = collapsed ? `展开全部 ${n} 个 ▾` : '收起 ▴';
}

/* ================= 学习页：词族导图 / 例句分级 / 猜词预热 ================= */
// 词库适配接口：bank/*.js 未加载时返回 null，行为与改造前完全一致。
// 将来只需在数据脚本区加一行 <script src="bank/gaokao.js">，学习页就会自动优先使用新词库。
// 四六级词库按需加载：只在用到四六级词时才拉 1.6MB，中高考用户不受影响
let cetLoading = null;
function ensureCetPack(){
  if(typeof BANK_PACK_CET !== 'undefined') return Promise.resolve(true);
  if(cetLoading) return cetLoading;
  cetLoading = new Promise(res => {
    const s = document.createElement('script');
    s.src = 'bank/pack_cet.js';
    s.onload = () => res(true);
    s.onerror = () => { cetLoading = null; res(false); };
    document.head.appendChild(s);
  });
  return cetLoading;
}
function isCetLevel(lv){ return lv === '四级' || lv === '六级'; }
// 真题类型：中考/高考/四级/六级
function isExamType(t){ return t === 'gaokao' || t === 'zhongkao' || t === 'cet4' || t === 'cet6'; }
// 这条真题句是否与当前学段匹配（匹配的加权更多）
function examMatched(t, level){
  return (t === 'zhongkao' && level === '初中') || (t === 'gaokao' && level === '高中')
      || (t === 'cet4' && level === '四级') || (t === 'cet6' && level === '六级');
}

// 当前词库是四级/六级时，后台把词库包拉下来；到货后静默重画一次
let cetWired = false;
function warmCetPack(){
  if(cetWired) return;
  const g = GROUPS[currentGroup];
  if(!g || !isCetLevel(g.level)) return;
  cetWired = true;
  ensureCetPack().then(ok => {
    if(!ok){ cetWired = false; return; }
    try{
      for(const w of words()) w._bankOn = false;
      learnSig = '';
      if(appMode === 'learn') renderLearn();
      else renderAll();
    }catch(e){}
  });
}

function resolveLearnData(w){
  if(!w) return null;
  const k = String(w.word || '').toLowerCase();
  if(typeof BANK_PACK !== 'undefined' && BANK_PACK){
    const hit = BANK_PACK[k] || BANK_PACK[w.word];
    if(hit) return hit;
  }
  if(typeof BANK_PACK_CET !== 'undefined' && BANK_PACK_CET){
    const hit = BANK_PACK_CET[k] || BANK_PACK_CET[w.word];
    if(hit) return hit;
  }
  return null;
}
// 把词库数据挂到单词对象上（幂等，只做一次）。没命中词库的词保持原样。
function applyBank(w){
  if(!w || w._bankOn) return w;
  const b = resolveLearnData(w);
  if(!b) return w;          // 不标记，等四六级包到位后还能再补
  w._bankOn = true;
  // ① 真题例句排最前，接着是词库里「带中文+出处」的词典句，最后接原有词典句
  const oldEx = Array.isArray(w.examples) ? w.examples.slice() : [];
  const bankEx = (b.ex || []).map(e => ({ en:e[0], cn:e[3] || '', src:e[1] || '', srcType:e[2] || '' }));
  const bankDict = (b.dx || []).map(e => ({ en:e[0], cn:e[1] || '', src:e[2] || '' }));
  const merged = bankEx.concat(bankDict);
  if(merged.length){
    const seen = new Set(merged.map(e => String(e.en).toLowerCase()));
    w.examples = merged.concat(oldEx.filter(e => !seen.has(String(e.en).toLowerCase())));
  }
  // ② 英美音标 + 来源
  if(Array.isArray(b.ph)){
    if(b.ph[0]) w.ukPhonetic = b.ph[0];
    if(b.ph[1]) w.usPhonetic = b.ph[1];
    if(b.ph[0] || b.ph[1]){
      w._phFromBank = true;
      w._phSrc = Array.isArray(b.phs) ? b.phs : [];
    }
  }
  // ③ 词频徽标
  if(b.co) w.collins = b.co;
  if(b.ox) w.oxford = b.ox;
  if(b.fr) w.frq = b.fr;
  w._taskEx = null;        // 例句变了，题型的例句分配要重算
  return w;
}

// ---- 学段词表（懒构建，用于判断例句超纲程度）----
let LEVEL_VOCAB = null;
const LEVEL_ORDER = ["初中","高中","四级","六级"];
const LEVEL_EXPECT_LEN = { "初中":10, "高中":14, "四级":18, "六级":20 };
const FUNC_WORDS = ("a an the and or but if because when while that which who whom whose what how why where this these those it its " +
  "he she they them his her their we our you your i me my mine not no nor so than then there here as at by for from in into of on onto " +
  "over to up with without about above after again against all am are be been being both can could did do does doing down during each " +
  "few had has have having just may might more most much must now off once only other out own same should some such too under until very " +
  "was were will would one two three first last many another get got make made take took").split(" ");

function buildLevelVocab(){
  const sets = {};
  const acc = new Set(FUNC_WORDS);
  for(const lv of LEVEL_ORDER){
    (WORD_DB[lv] || []).forEach(([w]) => acc.add(String(w).toLowerCase()));
    sets[lv] = new Set(acc);
  }
  LEVEL_VOCAB = sets;
  return sets;
}
function vocabFor(level){
  if(!LEVEL_VOCAB) buildLevelVocab();
  return LEVEL_VOCAB[level] || LEVEL_VOCAB["初中"];
}
function currentLevelName(){
  const g = GROUPS[currentGroup];
  const w = words()[learnIndex];
  return (g && g.level) || (w && w.level) || "初中";
}

// 例句难度分：越小越贴合当前学段
function scoreExample(en, level, cn){
  const plain = String(en || '').replace(/<[^>]+>/g, '');
  const toks = plain.toLowerCase().match(/[a-z][a-z'’-]*/g) || [];
  const expect = LEVEL_EXPECT_LEN[level] || 12;
  let s = Math.abs(toks.length - expect) * 1.2;
  const vocab = vocabFor(level);
  let oov = 0;
  for(const t of toks) if(!vocab.has(t)) oov++;
  s += oov * 1.0;
  // 句中最难的两个词，星级越低越难
  if(typeof ECDICT_DATA !== 'undefined' && ECDICT_DATA){
    const stars = toks
      .map(t => { const e = ECDICT_DATA[t]; return e && e.collins ? Number(e.collins) : 0; })
      .filter(Boolean).sort((a, b) => a - b).slice(0, 2);
    if(stars.length) s += (stars.reduce((a, b) => a + (5 - b), 0) / stars.length) * 0.4;
  }
  if(!cn) s += 2.0;   // 没有中文译文降权
  return s;
}

// 选 2~3 条例句：词典句 + 报刊句一起打分，保证至少一条带中文
function pickLearnExamples(w, n){
  n = n || 3;
  const level = currentLevelName();
  const pool = [];
  (w.examples || []).forEach((e, i) => pool.push({
    en: e.en, cn: e.cn || '',
    // 早期抓取的例句只存了英文和中文，丢了书名。它们确实来自有道词典接口，
    // 补一个诚实的来源标签（不是编书名），保证"每条例句都能标出来源"
    src: e.src || '有道词典',
    srcType: e.srcType || '',
    _real: !!e.src,
    key: 'd' + i
  }));
  (w.extras || []).forEach((e, i) => pool.push({ en: e.en, cn: '', src: e.src || '', srcType: '', _real: !!e.src, key: 'x' + i }));
  if(!pool.length) return [];
  const scored = pool.map(p => {
    let s = scoreExample(p.en, level, p.cn);
    // 人工补充句（管理页加的）排最前：那是有人专门挑过的句子
    if(p.srcType === 'manual') s -= 10.5;
    // 真题优先：同学段的真题句大幅加权；句子太长时仍会被长度罚分压下去，不会硬塞难句
    else if(isExamType(p.srcType)){
      s -= examMatched(p.srcType, level) ? 10 : 6;
    }
    // 来源优先：有具体出处的加权，既有中文又有出处的再加一档
    if(p._real) s -= 1.5;
    if(p._real && p.cn) s -= 2.2;
    return { ...p, _s: s };
  });
  scored.sort((a, b) => a._s - b._s);
  const out = scored.slice(0, n);
  // 前两条里必须有一条带中文，否则零基础的学生看不到译文；优先挑"有具体出处"的那条。
  // 只在取 2 条以上时补位——取 1 条时不能顶掉第一条，否则词义甄别题会和学习页首句不一致。
  if(out.length > 1 && !out.slice(0, 2).some(p => p.cn)){
    const withCn = scored.find(p => p.cn && p._real && !out.includes(p)) || scored.find(p => p.cn && !out.includes(p));
    if(withCn) out[1] = withCn;
  }
  return out;
}

// ---- 词族导图 ----
// 配图缩到左栏上方，导图排在图片下方、同一侧栏内，两列铺开，连线用 SVG 画。
const MM_POS = {
  1: [[148, 112]],
  2: [[76, 108], [220, 108]],
  3: [[76, 84], [220, 84], [148, 160]],
  4: [[76, 78], [220, 78], [76, 160], [220, 160]],
  5: [[76, 70], [220, 70], [148, 122], [76, 172], [220, 172]],
  6: [[76, 70], [220, 70], [76, 122], [220, 122], [76, 172], [220, 172]]
};
function mmLayout(n){
  const k = Math.max(1, Math.min(6, n));
  return MM_POS[k] || MM_POS[2];
}
function renderMindmap(w, famPick){
  const pick = famPick || pickFamily(w);
  const members = (pick.list || []).filter(m => m && m.w).slice(0, 6);
  const cap = `<div class="mm2-cap">同源词 · 派生词</div>`;

    const [x, y] = pos[i];

    return `<div class="mm2-node" style="left:${x}px;top:${y}px" data-say="${escapeHtml(m.w)}" onclick="playDataSay(this)" title="${escapeHtml(m.w)}${cn ? ' ' + escapeHtml(cn) : ''}">
      <div class="n-en">${escapeHtml(m.w)}</div>${cn ? `<div class="n-cn">${escapeHtml(cn)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="mm2">${cap}

}

// ---- 课前猜词预热（三选一）----
const PREHEAT = { on: true, showWord: true };
// 支持 ?preheat=0 关闭预热（便于课堂演示或调试）
try{ if(new URLSearchParams(location.search).get('preheat') === '0') PREHEAT.on = false; }catch(e){}
let preheatState = { done: new Set() };
function preheatEnabled(){
  if(!PREHEAT.on) return false;
  return loadStore(LS.preheat, true) !== false;
}
function wordImage(word){
  const k = String(word).toLowerCase();
  if(typeof PICS_DATA !== 'undefined' && PICS_DATA[k]) return PICS_DATA[k];
  if(typeof ATLAS_PICS !== 'undefined' && ATLAS_PICS[k]) return ATLAS_PICS[k];
  return '';
}
// 挑 2 个干扰图：同学段、有图、按 URL 去重（有道图库存在多词共用一张图的情况），
// 并排掉「释义撞车」的词——否则 sink 的干扰项也可能是 basin（同样是水池图），题目就没有唯一解。
const CN_STOP_CH = new Set('的地得了着过和与及或等很更最不无之其'.split(''));
function cnCharsOf(cn){
  const text = coreCn(cn, 3).text.replace(/^[a-z/]+\.\s*/i, '');
  return new Set([...text].filter(ch => /[\u4e00-\u9fa5]/.test(ch) && !CN_STOP_CH.has(ch)));
}
function pickGuessDistractors(w, n){
  n = n || 2;
  const target = wordImage(w.word);
  if(!target) return null;
  const used = new Set([target]);
  const targetChars = cnCharsOf(w.cn);
  const picked = [];
  const push = (x) => {
    if(!x || x.word === w.word) return;
    if(picked.length >= n) return;
    const img = wordImage(x.word);
    if(!img || used.has(img)) return;
    // 释义有重合 → 图很可能是同一类事物，作为干扰项会歧义
    for(const ch of cnCharsOf(x.cn)) if(targetChars.has(ch)) return;
    used.add(img);
    picked.push({ word: x.word, img });
  };
  // ① 同词族优先，② 同批词，③ 同学段词
  try{
    const fam = pickFamily(w).list || [];
    for(const m of fam) push(words().find(x => x.word === m.w));
    for(const m of fam) push((GROUPS[currentGroup].words || []).find(x => x.word === m.w));
  }catch(e){}
  for(const x of words()) push(x);
  for(const x of (GROUPS[currentGroup].words || [])) push(x);
  if(picked.length < n) return null;
  const pack = picked.slice(0, n).map(x => ({ ...x, correct: false }));
  pack.splice(Math.floor(Math.random() * (pack.length + 1)), 0, { word: w.word, img: target, correct: true });
  return pack;
}
function preheatHtml(w, pack){
  if(!pack) return '';
  const cards = pack.map((c, i) => `<div class="ph-card" data-ok="${c.correct ? 1 : 0}" onclick="answerPreheat(${i},this)">
    <img src="${c.img}" alt="" loading="lazy" onerror="this.style.visibility='hidden'"></div>`).join('');
  return `<div class="preheat"><div class="preheat-q">先猜一猜：哪张图是 <b>${escapeHtml(w.word)}</b>？</div><div class="preheat-grid">${cards}</div></div>`;
}
function answerPreheat(i, el){
  const grid = el && el.parentElement;
  if(!grid) return;
  if(el.dataset.ok === '1'){
    el.classList.add('right');
    Array.from(grid.children).forEach(c => { c.style.pointerEvents = 'none'; });
    setTimeout(() => {
      const main = document.querySelector('.learn-main');
      if(main) main.classList.remove('masked');
      const side = document.querySelector('.learn-side');
      if(side) side.classList.remove('masked');
      const box = document.querySelector('.preheat');
      if(box) box.remove();
      const w = words()[learnIndex];
      if(w){
        preheatState.done.add(String(w.word).toLowerCase());
        learnSig = learnSignature();      // 避免返回本页时重复弹预热
        playWordAudio(w.word);
      }
    }, 620);
  }else{
    el.classList.add('wrong');
    setTimeout(() => el.classList.remove('wrong'), 500);
  }
}

const LS = { wrongbook:'lx_wrongbook', studylog:'lx_studylog', decks:'lx_decks', activeDeck:'lx_active_deck', preheat:'lx_preheat' };
const EBB_INTERVALS = [1, 2, 4, 7, 15, 30]; // 艾宾浩斯遗忘曲线间隔（天）
const DAY = 86400000;

function loadStore(key, def){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
// 保存：先按正常写；空间不足时自动清理图片缓存重试一次；仍失败则明确提示（不再静默丢数据）
function saveStore(key, val){
  let str;
  try{ str = JSON.stringify(val); }catch(e){ toast("⚠️ 数据格式异常，保存失败"); return false; }
  try{
    localStorage.setItem(key, str);
    return true;
  }catch(e){
    if(pruneImageCache()){
      try{ localStorage.setItem(key, str); return true; }catch(e2){}
    }
    toast("⚠️ 保存失败：浏览器本地空间已满，请先导出备份后清理");
    return false;
  }
}
// 清理单词配图缓存（占用最大、可重新生成），为词库/错题本腾出空间
function pruneImageCache(){
  const del = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("wordimg_")===0) del.push(k);
  }
  del.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  return del.length > 0;
}
// 本地存储占用（KB），用于界面提示
function storageUsageKB(){
  let n = 0;
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i) || "";
    n += (k.length + (localStorage.getItem(k)||"").length);
  }
  return Math.round(n / 1024);
}

/* ---- 艾宾浩斯学习记录 ---- */
function loadStudylog(){ return loadStore(LS.studylog, {}); }
// 把一个词纳入复习队列（已存在则不重复加入），deckId 用于按词库统计待复习
function enrollStudy(word, level, deckId){
  const log = loadStudylog();
  if(log[word]) return false;
  const rec = { level: level||'', stage:0, nextDue: Date.now()+EBB_INTERVALS[0]*DAY, addedAt: Date.now() };
  if(deckId) rec.deck = deckId;
  log[word] = rec;
  saveStore(LS.studylog, log);
  updateBadges();
  return true;
}
function markLearned(word, level, deckId){
  const log = loadStudylog();
  if(!log[word]){
    log[word] = { level, stage:0, nextDue: Date.now()+EBB_INTERVALS[0]*DAY, addedAt: Date.now() };
    if(deckId) log[word].deck = deckId;
    addPoints(5, '学习新词', 'vocab'); // 每个新单词第一次学习 +5 分
    saveStore(LS.studylog, log);
    // 词汇量里程碑：每累计 25 个新词额外奖励，鼓励持续扩词
    const learnedN = Object.keys(log).length;
    if(learnedN % 25 === 0) addPoints(25, '词汇里程碑', 'vocab');
  }
  updateBadges();
}
function getDueReviews(){
  const log = loadStudylog();
  const now = Date.now();
  return Object.entries(log).filter(([,r])=>r.nextDue && r.nextDue<=now)
    .map(([w,r])=>({ word:w, cn:findCn(w), stage:r.stage||0, nextDue:r.nextDue }))
    .sort((a,b)=>a.nextDue-b.nextDue);
}
function reviewResult(word, result){
  const log = loadStudylog();
  const r = log[word];
  if(!r) return;
  if(result==='know') r.stage = Math.min((r.stage||0)+1, EBB_INTERVALS.length-1);
  else if(result==='fuzzy') r.stage = Math.max((r.stage||0)-1, 0);
  else r.stage = 0;
  r.nextDue = Date.now() + EBB_INTERVALS[r.stage]*DAY;
  saveStore(LS.studylog, log);
  // 复习奖励：认识 +3，模糊 +1，忘记 +0
  if(result==='know') addPoints(3, '复习·认识', 'vocab');
  else if(result==='fuzzy') addPoints(1, '复习·模糊', 'vocab');
}

// 三维积分来源：词汇量 / 答题正确率 / PK 战绩
const POINT_CATS = { vocab:'词汇量', answer:'答题', pk:'对战' };
const ANSWER_REASONS = ['语义词联','词义甄别','语境填空','拼写重构','句式组配','双语转译','通关奖励','正确率奖励'];
const TYPE_LABEL = { match:'语义词联', choice:'词义甄别', fill:'语境填空', spell:'拼写重构', sentence:'句式组配', trans:'双语转译' };

function guessCat(reason){
  const r = String(reason||'');
  if(r.indexOf('对战') >= 0) return 'pk';
  if(r.indexOf('答题') >= 0 || ANSWER_REASONS.indexOf(r) >= 0) return 'answer';
  return 'vocab';
}
function loadPoints(){
  const raw = loadStore(LS_POINTS, {});
  const out = Object.assign({ total:0, today:0, todayKey:'', earned:{}, cat:null }, raw||{});
  if(!out.cat || typeof out.cat.vocab !== 'number'){
    // 老用户迁移：按历史得分原因归类，不丢分
    const cat = { vocab:0, answer:0, pk:0 };
    for(const [k,v] of Object.entries(out.earned||{})){
      cat[guessCat(k)] += Number(v) || 0;
    }
    if(!cat.vocab && !cat.answer && !cat.pk) cat.vocab = out.total || 0;
    out.cat = cat;
  }
  return out;
}
function savePoints(p){ saveStore(LS_POINTS, p); }
function getRank(total){ let r=0; for(let i=0;i<RANKS.length;i++){ if(total>=RANKS[i].min) r=i; } return r; }

/* ---- 答题统计：正确率与连对（影响每次得分，也用于成就页三维展示） ---- */
function loadStats(){
  const raw = loadStore(LS_STATS, {}) || {};
  const pk = Object.assign({ win:0, lose:0, draw:0, streak:0, best:0 }, raw.pk || {});
  return Object.assign({ ans:0, right:0, streak:0, best:0, byType:{} }, raw, { pk });
}
function saveStats(s){ saveStore(LS_STATS, s); }
function accuracy(st){ st = st || loadStats(); return st.ans ? Math.round(st.right / st.ans * 100) : 0; }
// 连对加成：3/6/9/12/15 题分别 +10% ~ +50%
function streakMult(streak){
  if(streak >= 15) return 1.5;
  if(streak >= 12) return 1.4;
  if(streak >= 9)  return 1.3;
  if(streak >= 6)  return 1.2;
  if(streak >= 3)  return 1.1;
  return 1;
}
// 记录一次答题：答对才得分，连对递增加成；答错清零连对但不扣分
// countAcc=false 用于消消乐这类没有"答错提交"的对拼玩法，避免虚高正确率
function recordAnswer(type, ok, base, countAcc){
  const s = loadStats();
  const count = (countAcc !== false);
  if(count){
    s.ans++;
    if(ok){ s.right++; }
    if(ok){ s.streak++; if(s.streak > (s.best||0)) s.best = s.streak; }
    else { s.streak = 0; }
  }
  const t = s.byType[type] || { n:0, r:0 };
  t.n++; if(ok) t.r++;
  s.byType[type] = t;
  saveStats(s);
  if(count && typeof batchStat === 'object' && batchStat){ batchStat.ans++; if(ok) batchStat.right++; }
  const mult = streakMult(s.streak);
  const gain = ok ? Math.ceil(base * mult) : 0;
  if(gain) addPoints(gain, '答题·' + (TYPE_LABEL[type] || type), 'answer');
  return { gain, mult, streak: s.streak };
}
// 记录一场对战：胜/负/平都计入战绩，连胜额外加分
function recordPk(win){
  const s = loadStats();
  const pk = s.pk;
  if(win === 0){ pk.win++; pk.streak = (pk.streak||0) + 1; if(pk.streak > (pk.best||0)) pk.best = pk.streak; }
  else if(win === 1){ pk.lose++; pk.streak = 0; }
  else { pk.draw = (pk.draw||0) + 1; }
  saveStats(s);
  const gain = win === 0 ? Math.min(30, 15 + Math.max(0, (pk.streak - 1) * 5)) : (win === 1 ? 5 : 8);
  addPoints(gain, '单词对战', 'pk');
  return gain;
}

// 加分：累计积分 + 分类记账 + 段位晋升检测
function addPoints(n, reason, cat){
  if(!n || n<=0) return false;
  const p = loadPoints();
  const before = p.total;
  const prevRank = getRank(before);
  p.total += n;
  const tk = new Date().toDateString();
  if(p.todayKey !== tk){ p.todayKey = tk; p.today = 0; }
  p.today += n;
  p.earned[reason] = (p.earned[reason]||0) + n;
  const c = cat || guessCat(reason);
  p.cat[c] = (p.cat[c]||0) + n;
  savePoints(p);
  const newRank = getRank(p.total);
  updateRankUI();
  if(newRank > prevRank){ showRankUp(newRank); }
  return true;
}
let pendingRankUp = 0;
function showRankUp(idx){
  pendingRankUp = (typeof idx === 'number') ? idx : 0;
  const el = $("#rankUp");
  if(el){
    el.textContent = "🎉 晋升 " + (RANKS[pendingRankUp] ? RANKS[pendingRankUp].icon + ' ' + RANKS[pendingRankUp].name : '新段位');
    el.classList.add("show");
    setTimeout(()=>el.classList.remove("show"), 2200);
  }
  toast("🎉 段位晋升：" + (RANKS[pendingRankUp] ? RANKS[pendingRankUp].name : ''));
}
function updateRankUI(){
  const p = loadPoints();
  const r = getRank(p.total);
  const cur = RANKS[r], next = RANKS[r+1] || null;
  const icon = $("#rankIcon"), name = $("#rankName"), pts = $("#rankPts"), bar = $("#rankBar"), nxt = $("#rankNext"), badge = $("#ptsBadge");
  const tIcon = $("#topRankIcon"), tPts = $("#topRankPts");
  if(icon) icon.textContent = cur.icon;
  if(name) name.textContent = cur.name;
  if(pts) pts.textContent = p.total;
  if(badge) badge.textContent = p.total>0 ? p.total : '';
  if(tIcon) tIcon.textContent = cur.icon;
  if(tPts) tPts.textContent = p.total;
  if(next){
    const prog = Math.min(100, Math.round((p.total - cur.min) / (next.min - cur.min) * 100));
    if(bar) bar.style.width = prog + "%";
    if(nxt) nxt.innerHTML = `距 <b>${next.icon} ${next.name}</b> 还差 <b>${next.min - p.total}</b> 分`;
  } else {
    if(bar) bar.style.width = "100%";
    if(nxt) nxt.innerHTML = `已登顶最高段位 🏆`;
  }
}

}

function findCn(word){
  const lw = word.toLowerCase();
  for(const lv of Object.keys(WORD_DB)){ const hit=(WORD_DB[lv]||[]).find(x=>x[0].toLowerCase()===lw); if(hit) return hit[1]; }
  for(const d of loadDecks()){ const hit=(d.words||[]).find(x=>x[0].toLowerCase()===lw); if(hit) return hit[1]; }
  return '';
}

function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
// 每个词库的待复习数量（依据艾宾浩斯记录里的 deck 标记）
function dueCountByDeck(){
  const log = loadStudylog(), now = Date.now(), map = {};
  for(const w in log){
    const r = log[w];
    if(r && r.deck && r.nextDue && r.nextDue<=now) map[r.deck] = (map[r.deck]||0)+1;
  }
  return map;
}

// 统一建档入口：手动粘贴与文件导入共用
function addDeck(name, words){
  if(!name){ toast("请填写词库名称"); return null; }
  if(!words || !words.length){ toast("没有可保存的单词"); return null; }
  const decks = loadDecks();
  const deck = { id: Date.now().toString(36), name, words, createdAt: Date.now() };
  decks.push(deck);
  if(!saveDecks(decks)) return null;      // 保存失败已在 saveStore 内提示
  return deck;
}
function createDeck(){
  const name = $("#deckName").value.trim();
  const raw = $("#deckWords").value.trim();
  if(!name){ toast("请填写词库名称"); return; }
  if(!raw){ toast("请粘贴单词"); return; }
  const { words } = parseWordLines(raw.split(/\n+/));
  if(!words.length){ toast("未能解析出单词，请检查格式"); return; }
  const deck = addDeck(name, words);
  if(!deck) return;
  $("#deckName").value = ""; $("#deckWords").value = "";
  hideDeckCreate();
  renderDecks();
  toast(`已创建词库「${name}」，共 ${words.length} 词`);
}
function deleteDeck(id){
  const d = loadDecks().find(x=>x.id===id);
  if(!d) return;
  if(!confirm(`确定删除词库「${d.name}」（${(d.words||[]).length} 词）吗？\n删除后无法恢复，建议先导出备份。`)) return;
  if(!saveDecks(loadDecks().filter(x=>x.id!==id))) return;
  if(getActiveDeckId()===id){ setActiveDeckId(null); activeCustomWords = null; currentBatch = []; }
  renderDecks();
  toast("已删除词库");
}
function activateDeck(id){
  let activated = false;
  if(id!==null){
    const deck = loadDecks().find(d=>d.id===id);
    const list = deck ? (deck.words||[]) : [];
    if(list.length){
      activeCustomWords = list.map(([w,cn])=>buildWord(w,cn,'自定义',id));
      setActiveDeckId(id);
      activated = true;
    } else {
      // 空词库/词库已被删除：不要停在空批次上，明确回退
      activeCustomWords = null;
      setActiveDeckId(null);
      toast("这个词库是空的，已切回内置词库");
    }
  } else {
    activeCustomWords = null;
    setActiveDeckId(null);
  }
  currentBatch = [];
  currentStep = 0; learnIndex = 0;
  appMode = 'learn';
  newBatch();
  renderDecks();
  if(activated) toast("已切换到自定义词库");
  else if(id === null) toast("已切换回内置词库");
  // 空词库的情况上面已经给出专门提示，这里不再覆盖
  renderAll();
  pushRoute();
}

let _jszipPromise = null;
function loadJSZip(){
  if(window.JSZip) return Promise.resolve(window.JSZip);
  if(_jszipPromise) return _jszipPromise;
  _jszipPromise = new Promise((resolve, reject)=>{
    const s = document.createElement("script");
    s.src = "vendor/jszip.min.js";
    s.onload = ()=> window.JSZip ? resolve(window.JSZip) : reject(new Error("解析组件加载失败"));
    s.onerror = ()=> reject(new Error("解析组件加载失败，请检查网络后重试"));
    document.head.appendChild(s);
  });
  return _jszipPromise;
}

// 把「行文本」解析成 [单词, 释义]：兼容"word 中文"、"word,中文"、制表符分列
function parseWordLines(lines){
  const out = [], skipped = [];
  // 表头：只判断第一个单元格（单词/释义/word/meaning…）
  const headerRe = /^(单词|词汇|英文|english|word|words|释义|中文|意思|meaning|序号|编号|no\.?|phonetic|音标)$/i;
  // 合法词形：纯字母（可含空格、连字符、撇号、点），2~4 个词，不含数字
  const isValidWord = s => {
    if(!s) return false;
    if(!/^[A-Za-z][A-Za-z'’.\-\s]*$/.test(s)) return false;   // 含数字/符号 → 不是单词
    if(s.replace(/[^A-Za-z]/g,'').length < 2) return false;
    const parts = s.split(/\s+/).filter(Boolean);
    return parts.length >= 1 && parts.length <= 4;
  };
  for(const raw of lines){
    let line = String(raw==null?'':raw).replace(/\u00a0/g,' ').replace(/[\r\t]+$/,'').trim();
    if(!line) continue;
    // 去掉行首序号：1. / 1、 / (1) / 1)
    line = line.replace(/^[(（]?\d{1,3}[)）.、:：]\s*/,'').trim();
    if(!line) continue;
    // 先用分隔符切列，便于识别表头与「多列」结构
    const cols = line.split(/\t|,|;|\||\s{2,}/).map(x=>x.trim()).filter(Boolean);
    const firstCell = cols[0] || line;
    if(headerRe.test(firstCell.split(/\s+/)[0] || '')) continue;   // 表头整行跳过
    let en = '', cn = '';
    const cnIdx = line.search(/[\u4e00-\u9fff]/);
    if(cnIdx >= 0){
      en = line.slice(0, cnIdx).replace(/[\s,，;；:：、=\-–—|]+$/,'').trim();
      cn = line.slice(cnIdx).replace(/^[\s,，;；:：、=\-–—|]+/,'').trim();
    } else {
      en = cols[0] || '';
      cn = cols.slice(1).join(' ').trim();
    }
    if(!en){ continue; }                                      // 纯中文行（标题/说明）静默跳过
    if(!isValidWord(en)){ skipped.push(line); continue; }     // 形似词条但不像单词，计入“已忽略”
    out.push([en, cn]);
  }
  // 按小写词形去重，保留先出现的
  const seen = new Set(), uniq = [];
  for(const [w,c] of out){
    const k = w.toLowerCase();
    if(seen.has(k)) continue;
    seen.add(k); uniq.push([w,c]);
  }
  return { words: uniq, skipped: skipped.length };
}

// 读取文件 → 行文本数组
async function readDeckFile(file){
  const name = (file.name||'').toLowerCase();
  const buf = await file.arrayBuffer();
  const sig = new Uint8Array(buf.slice(0,8));
  const isOle = sig[0]===0xD0 && sig[1]===0xCF && sig[2]===0x11 && sig[3]===0xE0;
  if(name.endsWith('.xlsx')) return { lines: await readXlsxRows(buf), type:'excel' };
  if(name.endsWith('.docx')) return { lines: await readDocxLines(buf), type:'word' };
  if(name.endsWith('.csv') || name.endsWith('.txt')) return { lines: splitText(new TextDecoder('utf-8').decode(buf)), type:'text' };
  if(isOle || name.endsWith('.xls') || name.endsWith('.doc')){
    throw new Error('这是旧版 Office 格式，请在 Excel/Word 里「另存为」.xlsx 或 .docx 后再导入');
  }
  return { lines: splitText(new TextDecoder('utf-8').decode(buf)), type:'text' };
}
function splitText(txt){
  return txt.replace(/^\ufeff/,'').split(/\r?\n/);
}

// 列号：A→0, B→1, AA→26
function colIndex(ref){
  const m = /^([A-Z]+)/.exec(ref||'');
  if(!m) return 0;
  let n = 0;
  for(const ch of m[1]) n = n*26 + (ch.charCodeAt(0)-64);
  return n-1;
}
async function readXlsxRows(buf){
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(buf);
  // 共享字符串表
  const shared = [];
  const ssFile = zip.file('xl/sharedStrings.xml');
  if(ssFile){
    const doc = new DOMParser().parseFromString(await ssFile.async('text'), 'application/xml');
    Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName==='si').forEach(si=>{
      const texts = Array.from(si.getElementsByTagName('*')).filter(n=>n.localName==='t');
      shared.push(texts.map(t=>t.textContent).join(''));
    });
  }
  const sheetFiles = Object.keys(zip.files).filter(p=>/^xl\/worksheets\/sheet\d*\.xml$/.test(p)).sort();
  if(!sheetFiles.length) throw new Error('Excel 里没有找到工作表');
  const doc = new DOMParser().parseFromString(await zip.file(sheetFiles[0]).async('text'), 'application/xml');
  const rows = [];
  Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName==='row').forEach(rowEl=>{
    const cells = [];
    Array.from(rowEl.children).forEach(c=>{
      if(c.localName!=='c') return;
      const idx = colIndex(c.getAttribute('r'));
      const t = c.getAttribute('t');
      let val = '';
      if(t==='s'){
        const v = Array.from(c.getElementsByTagName('*')).find(n=>n.localName==='v');
        val = v ? (shared[parseInt(v.textContent,10)] || '') : '';
      } else if(t==='inlineStr'){
        val = Array.from(c.getElementsByTagName('*')).filter(n=>n.localName==='t').map(n=>n.textContent).join('');
      } else {
        const v = Array.from(c.getElementsByTagName('*')).find(n=>n.localName==='v');
        val = v ? v.textContent : '';
      }
      cells[idx] = String(val).trim();
    });
    rows.push(cells);
  });
  return rowsToLines(rows);
}
// 表格行 → "英文\t中文" 行：自动识别英文列与中文列（表头可有可无）
function rowsToLines(rows){
  const table = rows.map(r=>r.map(x=>(x==null?'':String(x)).trim()));
  let start = 0;
  const first = table[0] || [];
  if(first.some(c=>/^(单词|词汇|英文|english|word|words)$/i.test(c))) start = 1;
  const sample = table.slice(start, start+30).filter(r=>r.some(Boolean));
  const width = Math.max(0, ...sample.map(r=>r.length));
  let enCol = -1, cnCol = -1, bestEn = 0, bestCn = 0;
  for(let c=0;c<width;c++){
    let enN=0, cnN=0;
    sample.forEach(r=>{
      const v = r[c]||'';
      if(!v) return;
      if(/[a-zA-Z]{2,}/.test(v) && !/[\u4e00-\u9fff]/.test(v)) enN++;
      if(/[\u4e00-\u9fff]/.test(v)) cnN++;
    });
    if(enN>bestEn){ bestEn=enN; enCol=c; }
    if(cnN>bestCn){ bestCn=cnN; cnCol=c; }
  }
  if(enCol<0) enCol = 0;
  const lines = [];
  for(let i=start;i<table.length;i++){
    const r = table[i];
    const en = (r[enCol]||'').trim();
    if(!en) continue;
    let cn = (cnCol>=0 && cnCol!==enCol) ? (r[cnCol]||'').trim() : '';
    if(!cn){
      // 没识别到中文列：取英文列右侧第一个非空单元格兜底
      for(let c=enCol+1;c<r.length;c++){
        const v = (r[c]||'').trim();
        if(v && c!==enCol){ cn = v; break; }
      }
    }
    lines.push(cn ? en + '\t' + cn : en);
  }
  return lines;
}
// Word 正文：段落逐行；表格按行拼接
async function readDocxLines(buf){
  const JSZip = await loadJSZip();
  const zip = await JSZip.loadAsync(buf);
  const f = zip.file('word/document.xml');
  if(!f) throw new Error('不是有效的 Word 文档');
  const doc = new DOMParser().parseFromString(await f.async('text'), 'application/xml');
  const bodies = Array.from(doc.getElementsByTagName('*')).filter(n=>n.localName==='body');
  const root = bodies[0] || doc.documentElement;
  const getText = el => Array.from(el.getElementsByTagName('*')).filter(n=>n.localName==='t').map(n=>n.textContent).join('');
  const lines = [];
  const walk = node => {
    Array.from(node.childNodes).forEach(child=>{
      if(child.nodeType!==1) return;
      const tag = child.localName;
      if(tag==='p'){
        const t = getText(child).replace(/\s+/g,' ').trim();
        if(t) lines.push(t);
      } else if(tag==='tbl'){
        Array.from(child.children).forEach(tr=>{
          if(tr.localName!=='tr') return;
          const cells = Array.from(tr.children).filter(td=>td.localName==='tc')
            .map(td=>getText(td).replace(/\s+/g,' ').trim());
          const t = cells.filter(Boolean).join('\t');
          if(t) lines.push(t);
        });
      } else if(tag!=='sectPr'){
        walk(child);
      }
    });
  };
  walk(root);
  return lines;
}

// 选文件 → 解析 → 预览 → 确认建档
async function onDeckFile(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;
  if(file.size > 8*1024*1024){ toast("文件过大（超过 8MB），请拆分后再导入"); return; }
  toast("正在解析文件…");
  try{
    const { lines } = await readDeckFile(file);
    const { words, skipped } = parseWordLines(lines);
    if(!words.length) throw new Error("没有解析出单词，请确认文件里是「单词 + 释义」两列");
    showImportPreview(file.name.replace(/\.[^.]+$/,''), words, skipped);
  }catch(e){
    toast("❌ " + (e && e.message ? e.message : "导入失败，请检查文件格式"));
  }
}

function closeImportPreview(){

function confirmImport(){

/* ================= 备份与恢复（防清缓存/换设备丢数据） ================= */
function exportBackup(){
  const data = {
    app: "moci-lexi", v: 3, exportedAt: new Date().toISOString(),
    decks: loadDecks(),

  };

  a.href = url;
  a.download = "墨词备份-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);

function importBackup(input){
  const file = input.files && input.files[0];
  input.value = "";
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const d = JSON.parse(reader.result);
      if(!d || d.app !== "moci-lexi") throw new Error("不是墨词的备份文件");
      const deckN = (d.decks||[]).length, wrongN = Object.keys(d.wrongbook||{}).length, logN = Object.keys(d.studylog||{}).length;
      if(!confirm(`备份内容：${deckN} 个词库、${wrongN} 个错题、${logN} 条复习记录。\n导入会覆盖当前数据，确定继续吗？`)) return;
      if(d.decks) saveStore(LS.decks, d.decks);
      if(d.wrongbook) saveStore(LS.wrongbook, d.wrongbook);
      if(d.studylog) saveStore(LS.studylog, d.studylog);
      if(d.points) saveStore(LS_POINTS, d.points);
      if(d.stats) saveStore(LS_STATS, d.stats);
      saveStore(LS.activeDeck, d.activeDeck==null ? null : d.activeDeck);
      // 恢复后要按 activeDeck 重新装配单词，否则会出现"显示已激活、实际用内置词"
      const aid = getActiveDeckId();
      const dk = aid ? loadDecks().find(x=>x.id===aid) : null;
      activeCustomWords = (dk && (dk.words||[]).length)
        ? dk.words.map(([w,cn])=>buildWord(w,cn,'自定义',dk.id))
        : null;
      if(!activeCustomWords && aid) setActiveDeckId(null);
      currentBatch = [];
      newBatch();
      updateBadges(); updateRankUI(); updateDeckBadges();
      renderDecks();
      toast("✅ 备份已恢复");
    }catch(e){
      toast("❌ " + (e && e.message ? e.message : "备份文件无法识别"));
    }
  };
  reader.readAsText(file);
}

/* 音标按需查询（走后端中转，解决有道接口 CORS 限制）

async function loadPhonetic(w){
  const box = $("#phoneticBox");
  if(!box) return;
  if(w.ukPhonetic || w.usPhonetic) return; // 本地权威音标已就绪，跳过网络查询
  try{
    const resp = await fetch(`/api/phonetic?q=${encodeURIComponent(w.word)}`);
    if(!resp.ok) throw new Error('http '+resp.status);
    const data = await resp.json();
    let uk = data.uk || "", us = data.us || "";
    if(uk) uk = "/"+uk+"/"; if(us) us = "/"+us+"/";
    if(uk || us){
      w.ukPhonetic = uk; w.usPhonetic = us;
      box.innerHTML = `英 ${uk} &nbsp; 美 ${us}`;
    } else {
      box.innerHTML = '';
    }
  }catch(e){
    if(box) box.innerHTML = '';
  }
}

/* 单词配图三级策略：
   ① 本地缓存（有道图/AI图都缓存，刷新秒开）
   ② 有道图解词典（PICS_DATA，免费、国内直连，约60%词有图）
   ③ Agnes AI 生成兜底（仅抽象词，额度需求减半） */
const IMG_CACHE_PREFIX = 'wordimg_';
function getCachedImage(word){
  try{ return localStorage.getItem(IMG_CACHE_PREFIX + word) || ''; }catch(e){ return ''; }
}
function setCachedImage(word, url){
  try{ localStorage.setItem(IMG_CACHE_PREFIX + word, url); }catch(e){}
}
function imgTag(url, word){
  return `<img src="${url}" alt="${word}" onerror="onImgFail(this.parentElement,'${word}')">`;
}
async function loadImage(w){
  const imgEl = $("#wordImg");
  if(!imgEl) return;
  if(w.imageUrl){ return; }
  // 1. 本地缓存
  const cached = getCachedImage(w.word);
  if(cached){
    w.imageUrl = cached;
    imgEl.innerHTML = imgTag(cached, w.word);
    return;
  }
  // 2. 有道图解词典优先（真实照片，免费国内直连，约59%具体名词）
  const yd = (typeof PICS_DATA !== 'undefined' && PICS_DATA[w.word.toLowerCase()]) || '';
  if(yd){
    w.imageUrl = yd;
    setCachedImage(w.word, yd);
    imgEl.innerHTML = imgTag(yd, w.word);
    return;
  }
  // 3. AI 写实照片（有道无图时优先 AI，真实感；抽象词也能有写实场景图）
  await genImage(w, imgEl);
  if(w.imageUrl){ return; }
  // 4. Word Atlas 插画最后兜底（AI 失败/额度耗尽时用场景插画）
  const at = (typeof ATLAS_PICS !== 'undefined' && ATLAS_PICS[w.word.toLowerCase()]) || '';
  if(at){
    w.imageUrl = at;
    setCachedImage(w.word, at);
    imgEl.innerHTML = imgTag(at, w.word);
    return;
  }
}
async function genImage(w, imgEl){
  // 快速翻词时旧的生图请求没有意义，先确认这个词还在当前页
  const cur = words()[learnIndex];
  if(!cur || cur.word !== w.word) return;
  try{
    // 取该词最长的一条例句作为生图语境（让 AI 按例句场景画，更贴词义）
    let sentence = '';
    if(w.examples && w.examples.length){
      const arr = w.examples.map(e=>e.en.replace(/<[^>]+>/g,'').trim());
      arr.sort((a,b)=>b.length-a.length);
      sentence = arr[0] || '';
    }
    const resp = await fetch('/api/generate-image', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ word: w.word, cn: w._cn || w.cn, sentence })
    });
    if(!resp.ok) throw new Error('http '+resp.status);
    const data = await resp.json();
    if(data.url){
      w.imageUrl = data.url;
      setCachedImage(w.word, data.url);
      imgEl.innerHTML = imgTag(data.url, w.word);
    }
  }catch(e){
    // AI 失败（额度用尽等）保留占位，下次进入重试
  }
}
// 图片加载失败：按顺序回退 有道图 → AI 写实 → Word Atlas 插画，全部失败则显示占位符
async function onImgFail(el, word){
  try{ localStorage.removeItem(IMG_CACHE_PREFIX + word); }catch(e){}
  const w = words().find(x=>x.word === word);
  if(!w){ el.innerHTML = '<span class="emoji">🖼️</span>'; return; }
  const lw = word.toLowerCase();
  const yd = (typeof PICS_DATA !== 'undefined' && PICS_DATA[lw]) || '';
  const at = (typeof ATLAS_PICS !== 'undefined' && ATLAS_PICS[lw]) || '';
  const fail = (w._imgFail = (w._imgFail||0) + 1);
  w.imageUrl = '';
  if(fail === 1 && yd){ // 第一次失败 → 试有道真实照片
    w.imageUrl = yd; setCachedImage(word, yd); el.innerHTML = imgTag(yd, word); return;
  }
  if(fail <= 2 && !w._aiTried){ // 第二次失败 → 试 AI 写实照片
    w._aiTried = true; await genImage(w, el);
    if(w.imageUrl) return;
  }
  if(fail <= 3 && at){ // AI 失败 → Word Atlas 插画兜底
    w.imageUrl = at; setCachedImage(word, at); el.innerHTML = imgTag(at, word); return;
  }
  if(!w.imageUrl){ el.innerHTML = '<span class="emoji">🖼️</span>'; }
}

/* ---- 释义精简：只取最常用的 N 个义项并标词性；短语（无词性前缀）不标词性 ---- */
const CN_POS_RE = /^((?:(?:n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|aux|modal|abbr)\s*\.\s*&?\s*)+)/i;
const CN_BRACKET_RE = /^[\[【][^\]】]*[\]】]\s*/;
// 释义清洗：去掉 ECDICT 自带的人文噪音（"n. (Able)人名；(英)埃布尔"）与领域标签（"[经管]"）
function cleanCnText(cn){
  const raw = String(cn == null ? '' : cn).trim();
  if(!raw) return raw;
  const out = [];
  let afterPerson = false;
  for(const part of raw.split(/[；;]/)){
    let p = part.trim();
    if(!p) continue;
    if(/人名|地名|姓氏|译名|旧称/.test(p)){ afterPerson = true; continue; }
    // 紧跟在"人名"后面的纯音译片段，如 "(英)埃布尔"
    if(afterPerson && /^[（(][^）)]*[）)]\s*[^a-zA-Z]*$/.test(p)) continue;
    afterPerson = false;
    p = p.replace(/\[[^\]]{1,6}\]/g, '').replace(/\s{2,}/g, ' ').trim();
    if(!p) continue;
    out.push(p);
  }
  const res = out.join('；').replace(/；{2,}/g, '；').replace(/^；|；$/g, '').trim();
  return res || raw;   // 全部被清掉说明本来就是人名/地名，保留原文
}
function coreCn(cn, n){
  n = n || 2;
  let raw = String(cn || '').trim();
  if(!raw) return { pos:'', senses:[], text:'（暂无释义）', short:'（暂无释义）' };
  raw = raw.replace(CN_BRACKET_RE, '');          // 去掉 [broke-broken] 这类变形标注
  const posList = [];
  const pushPos = s => {
    const t = String(s || '').replace(/\s+/g, '').replace(/&$/, '');
    if(t && !posList.includes(t)) posList.push(t);
  };
  const m0 = raw.match(CN_POS_RE);
  let body = raw;
  if(m0){ pushPos(m0[1]); body = body.slice(m0[0].length); }
  let parts = body.split(/[；;]/).map(s => s.trim()).filter(Boolean);
  if(!parts.length) parts = [body];
  const all = [];
  for(const part of parts){
    let t = part.replace(CN_BRACKET_RE, '');
    const m = t.match(CN_POS_RE);
    if(m){ pushPos(m[1]); t = t.slice(m[0].length); }   // 义项自带的词性挪到统一标签里
    // 义项内部的逗号是近义并列，只留前半，避免"放弃，抛弃，遗弃，纵情"这类堆砌
    t = t.split(/[，,]/)[0].trim();
    if(!t || all.includes(t)) continue;
    all.push(t);
  }
  // "人名/地名"这类词典标注对背单词没有意义，优先剔掉
  const clean = all.filter(t => !/人名|地名|姓氏|简称/.test(t));
  const senses = (clean.length ? clean : all).slice(0, n);
  const pos = posList.join('/');
  const text = (pos ? pos + ' ' : '') + senses.join('；');
  return { pos, senses, text, short: senses[0] || '' };
}

/* ---- 分题型倒计时（支持暂停：答错弹解析时不该继续扣时间） ---- */
let qTimer = null;
let qTimerState = null;
function stopCountdown(){ if(qTimer){ clearInterval(qTimer); qTimer = null; } qTimerState = null; }
function startCountdown(sec, onTick, onEnd){
  stopCountdown();
  const total = Math.max(1, sec) * 1000;
  const st = { total, remaining: total, end: Date.now() + total, onTick, onEnd, paused: false };
  qTimerState = st;
  const tick = () => {
    if(st.paused) return;
    const left = Math.max(0, st.end - Date.now());
    st.remaining = left;
    if(st.onTick) st.onTick(left / 1000, left / total);
    if(left <= 0){
      st.paused = true;
      if(qTimer){ clearInterval(qTimer); qTimer = null; }
      if(st.onEnd) st.onEnd();
    }
  };
  tick();
  if(!st.paused) qTimer = setInterval(tick, 100);
}
function pauseCountdown(){
  const st = qTimerState;
  if(!st || st.paused) return;
  st.remaining = Math.max(0, st.end - Date.now());
  st.paused = true;
  if(qTimer){ clearInterval(qTimer); qTimer = null; }
}
function resumeCountdown(){
  const st = qTimerState;
  if(!st || !st.paused || st.remaining <= 0) return;
  st.paused = false;
  st.end = Date.now() + st.remaining;
  const tick = () => {
    if(st.paused) return;
    const left = Math.max(0, st.end - Date.now());
    st.remaining = left;
    if(st.onTick) st.onTick(left / 1000, left / st.total);
    if(left <= 0){
      st.paused = true;
      if(qTimer){ clearInterval(qTimer); qTimer = null; }
      if(st.onEnd) st.onEnd();
    }
  };
  tick();
  if(!st.paused) qTimer = setInterval(tick, 100);
}
function timerBar(sec){
  return `<div class="q-timer" id="qTimerBox">
      <div class="q-timer-track"><i id="qTimerFill"></i></div>
      <span class="q-timer-num" id="qTimerNum">${sec}s</span>
    </div>`;
}
// 驱动题目上的计时条；到点回调 onEnd（按"超时=答错"处理）
function runQTimer(sec, onEnd){
  const fill = $("#qTimerFill"), num = $("#qTimerNum"), box = $("#qTimerBox");
  startCountdown(sec, (left, ratio) => {
    if(!fill || !num) return;
    fill.style.width = Math.max(0, Math.min(1, ratio)) * 100 + '%';
    num.textContent = Math.ceil(left) + 's';
    if(box) box.classList.toggle('urgent', ratio <= 0.25);
  }, onEnd);
}

function findWordInfo(word){

// 组装一条解析：释义 / 音标 / 你选的 / 例句 / 同源词

  if(chosen){

      rows.push(['你选的', `<b>${escapeHtml(cw.word)}</b> ${escapeHtml(coreCn(cw.cn, 1).text)}`]);
    }

  // 例句优先用词汇认知页刚学的那句，形成"学—练"呼应

  if(ex && ex.en){

    const srcLine = ex.src ? `<span class="fb-cn">出处：${escapeHtml(ex.src)}</span>` : '';
    rows.push(['例句', `<span class="fb-ex">${en}${ex.cn ? `<span class="fb-cn">${escapeHtml(ex.cn)}</span>` : ''}${srcLine}</span>`]);

  try{

    if(mates.length) rows.push(['同源词', mates.map(x => `<b>${escapeHtml(x.w)}</b>`).join(' · ')]);
  }catch(e){}
  return rows;
}
