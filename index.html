<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻松背单词 - 中高考词汇训练</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --primary:#4f6ef7; --primary2:#7c5cf0;
    --text:#1f2430; --muted:#8a90a3; --border:#e7e9f2;
    --green:#22c58b; --red:#ff6b6b; --amber:#ffb020; --yellow:#ffe9a8;
    --shadow:0 6px 24px rgba(70,80,130,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

  /* ===== 左侧菜单栏布局（DeepSeek 风格） ===== */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:260px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 14px}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
  .brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;flex-shrink:0}
  .brand-name{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}

  .menu-label{font-size:11px;color:#b6bac7;letter-spacing:1px;padding:14px 12px 6px;text-transform:uppercase}
  .menu-group{display:flex;flex-direction:column;gap:2px}
  .menu-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:#5a6072;font-size:14px;transition:.15s;position:relative}
  .menu-item:hover{background:#f3f5fc;color:var(--primary)}
  .menu-item.active{background:linear-gradient(135deg,#eef1ff,#f4efff);color:var(--primary);font-weight:600}
  .menu-item.active::before{content:"";position:absolute;left:-14px;top:20%;height:60%;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary2))}
  .menu-item .mi-icon{font-size:17px;width:22px;text-align:center}
  .menu-item .mi-num{width:18px;height:18px;border-radius:50%;background:#eef0f7;color:#9aa0b0;font-size:11px;display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}
  .menu-item.active .mi-num{background:var(--primary);color:#fff}
  .menu-item.done .mi-num{background:var(--green);color:#fff}

  .menu-group-tabs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .menu-group-tab{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#5a6072;font-size:13.5px;transition:.15s}
  .menu-group-tab:hover{background:#f3f5fc;color:var(--primary)}
  .menu-group-tab.active{background:linear-gradient(135deg,#eef1ff,#f4efff);color:var(--primary);font-weight:600}

  .search-box{position:relative;margin:6px 0 4px}
  .search-box input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:.15s}
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .search-result{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:280px;overflow-y:auto;z-index:50;display:none}
  .search-result.show{display:block}
  .search-result .sr-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f2f3f8}
  .search-result .sr-item:hover{background:#f3f5fc}
  .search-result .sr-item .sr-word{font-weight:600}
  .search-result .sr-item .sr-cn{color:var(--muted);font-size:12px;margin-left:6px}

  .sidebar-foot{margin-top:auto;padding:14px 8px 4px;font-size:11px;color:#b6bac7;border-top:1px solid var(--border)}

  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .main-head{max-width:860px;margin:0 auto 18px}
  .main-title{font-size:20px;font-weight:800;margin-bottom:4px}
  .main-sub{color:var(--muted);font-size:13px}

  .progress-bar{height:6px;background:#eef0f7;border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress-bar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .3s}

  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px;margin-bottom:20px;max-width:860px;margin-left:auto;margin-right:auto}
  h2.page-title{text-align:center;margin-bottom:6px;font-size:22px}
  .page-sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:14px}

  /* ===== 学习页（图片居中主打） ===== */
  .learn-grid{display:grid;grid-template-columns:1fr;gap:22px}
  .word-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .word-img{width:100%;max-width:420px;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:18px;background:linear-gradient(135deg,#eef1ff,#f7f0ff);display:flex;align-items:center;justify-content:center}
  .word-img img{width:100%;height:100%;object-fit:cover}
  .word-img .emoji{font-size:120px;line-height:1}
  .word-info{max-width:720px;margin:0 auto;width:100%}
  .word-text{font-size:44px;font-weight:800;letter-spacing:.5px}
  .word-text .syl{cursor:pointer;border-radius:4px;padding:0 2px;transition:.15s}
  .word-text .syl.stress{color:var(--primary2);font-weight:800}
  .word-text .syl.active{background:var(--red);color:#fff}
  .word-phonetic{color:var(--muted);font-size:15px;margin:6px 0 2px}
  .word-cn{font-size:20px;font-weight:600;color:var(--primary);margin-top:8px}
  .speak-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .btn-speak{padding:9px 20px;border-radius:22px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:14px;transition:.15s}
  .btn-speak:hover{background:var(--primary);color:#fff}
  .btn-speak.playing{background:var(--primary);color:#fff}

  .word-info h3{font-size:15px;color:var(--primary);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{padding:6px 12px;border-radius:14px;background:#f0f3ff;color:#4a5ad0;font-size:13px;border:1px solid #dfe5ff}
  .chip .cn{color:#8a90a3;font-size:12px}
  .root-box{background:#f8f9fd;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;border-left:3px solid var(--primary2)}
  .root-box b{color:var(--primary2)}
  /* 思维导图：词根词缀中心 + 同源词发散 */
  .mindmap{background:linear-gradient(135deg,#f5f7ff,#fdf3ff);border-radius:18px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden}
  .mindmap::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 28%,rgba(99,102,241,.10),transparent 62%);pointer-events:none}
  .mm-center{position:relative;display:flex;flex-direction:column;align-items:center;margin-bottom:16px;text-align:center}
  .mm-center::after{content:"";width:2px;height:14px;background:linear-gradient(var(--primary),transparent);margin-top:2px}
  .mm-afix{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:10px 22px;border-radius:999px;font-weight:800;font-size:18px;box-shadow:0 6px 16px rgba(79,110,247,.35);margin-bottom:8px}
  .mm-tag{background:rgba(255,255,255,.22);font-size:11px;font-weight:600;padding:2px 8px;border-radius:8px}
  .mm-mean{font-size:13px;font-weight:500;opacity:.92}
  .mm-core{font-size:15px;color:var(--text);font-weight:700}
  .mm-core-cn{color:var(--muted);margin-left:6px;font-size:13px;font-weight:500}
  .mm-nodes{position:relative;display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
  .mm-node{background:#fff;border-radius:14px;padding:10px 14px;text-align:center;border:2px solid;box-shadow:0 3px 10px rgba(0,0,0,.06);transition:.18s;min-width:72px}
  .mm-node:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.12)}
  .mm-en{font-weight:800;font-size:15px;letter-spacing:.3px}
  .mm-cn{font-size:12px;color:#8a90a3;margin-top:2px}
  .mm-empty{width:100%;text-align:center;color:var(--muted);font-size:13px;padding:8px}
  .example{margin-bottom:10px;padding:10px 14px;border-radius:12px;background:#fbfbfe;border:1px solid var(--border)}
  .example .en{font-weight:600;font-size:15px}
  .example .en b{color:var(--primary)}
  .example .cn{color:var(--muted);font-size:13px}
  .ex-speak{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:13px;margin-right:8px;vertical-align:middle;transition:.15s;padding:0;line-height:1}
  .ex-speak:hover{background:var(--primary);color:#fff}

  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .btn{padding:12px 26px;border-radius:26px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:.2s}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,110,247,.35)}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-skip{background:#fff;border:1px dashed #c4c9d8;color:var(--muted);font-size:13px;padding:10px 18px}
  .progress-info{color:var(--muted);font-size:14px}

  /* ===== 题型通用 ===== */
  .question{background:#fbfbfe;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
  .q-index{font-size:13px;color:var(--muted);margin-bottom:6px}
  .q-sentence{font-size:17px;font-weight:500;line-height:1.8}
  .q-sentence b{color:var(--primary);font-weight:700}
  .q-sentence .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .option{padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--border);cursor:pointer;font-size:15px;text-align:center;transition:.15s;user-select:none}
  .option:hover{border-color:var(--primary)}
  .option.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .option.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连线 */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .match-col{display:flex;flex-direction:column;gap:12px}
  .match-col h3{text-align:center;font-size:15px;color:var(--muted);margin-bottom:4px}
  .match-item{padding:14px 16px;border-radius:14px;background:#fbfbfe;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:16px;font-weight:600;transition:.15s;user-select:none}
  .match-item:hover{border-color:var(--primary)}
  .match-item.selected{border-color:var(--primary);background:#eef2ff}
  .match-item.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .match-item.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}
  .match-item.done{opacity:.4;pointer-events:none}

  /* 拼写 */
  .spell-word{font-size:20px;font-weight:700;margin-bottom:6px}
  .spell-cn{color:var(--muted);margin-bottom:14px}
  .letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;min-height:44px}
  .letter-tile{padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,#f0f3ff,#eef0ff);border:1px solid #dfe5ff;cursor:pointer;font-size:18px;font-weight:700;min-width:44px;text-align:center;transition:.15s;user-select:none}
  .letter-tile:hover{transform:translateY(-2px)}
  .letter-tile.used{opacity:.25;pointer-events:none}
  .answer-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;min-height:48px}
  .slot{width:48px;height:48px;border-radius:12px;border:2px dashed #c4c9d8;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;background:#fff}
  .slot.filled{border-style:solid;border-color:var(--primary);background:#f7f9ff}
  .slot.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .slot.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连词成句 */
  .sentence-frag{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;min-height:44px}
  .frag{padding:10px 16px;border-radius:12px;background:#f0f3ff;border:1px solid #dfe5ff;cursor:pointer;font-size:15px;font-weight:600;transition:.15s;user-select:none}
  .frag.used{opacity:.25;pointer-events:none}
  .sentence-build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;border:2px dashed #dfe5ff;border-radius:12px;padding:12px;margin-bottom:16px}
  .sentence-build .frag{background:#fff;border:1px solid var(--primary)}
  .sentence-build .frag.right{background:#e9fbf4;border-color:var(--green);color:var(--green)}

  /* 翻译 */
  .trans-area textarea{width:100%;min-height:100px;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}

  /* 语篇 */
  .passage{font-size:16px;line-height:2.1;background:#fbfbfe;border-radius:14px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
  .passage .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .passage-trans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);color:var(--muted);font-size:14px}
  .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);text-align:center;padding:0 6px;margin:0 3px;color:var(--primary);font-weight:700;cursor:pointer}
  .blank.filled{color:var(--green)}
  .option-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  .opt-chip{padding:10px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600;transition:.15s}
  .opt-chip:hover{border-color:var(--primary);color:var(--primary)}
  .opt-chip.used{opacity:.3;pointer-events:none}
  .opt-chip.selected{border-color:var(--primary);color:var(--primary)}

  /* 结果 */
  .result-box{text-align:center;padding:40px 20px}
  .result-emoji{font-size:72px}
  .result-score{font-size:48px;font-weight:800;margin:10px 0}
  .result-msg{color:var(--muted);margin-bottom:24px}

  .hidden{display:none!important}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:12px 22px;border-radius:26px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}

  /* ===== 复习巩固模块样式 ===== */
  .empty-state{text-align:center;padding:48px 20px}
  .empty-emoji{font-size:52px;margin-bottom:14px}
  .empty-title{font-size:18px;font-weight:600;color:#333;margin-bottom:6px}
  .empty-desc{color:#999;font-size:14px}
  .review-card{background:#f8f9fd;border-radius:16px;padding:34px 20px;text-align:center;margin:20px 0}
  .rc-word{font-size:42px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
  .rc-hint{color:#aaa;font-size:13px;margin-bottom:16px}
  .rc-cn{font-size:22px;color:var(--primary2);font-weight:600;margin:12px 0}
  .review-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .btn-ghost{background:#f0f1f5;color:#444}
  .btn-mini{padding:5px 12px;font-size:13px;border-radius:8px}
  .wrong-list,.deck-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .wrong-item,.deck-item{display:flex;align-items:center;gap:12px;background:#f8f9fd;border-radius:12px;padding:12px 16px}
  .deck-item{cursor:pointer;border:1px solid transparent}
  .deck-item.active{border-color:var(--primary2);background:#f0f1ff}
  .wi-word{font-weight:600;font-size:17px}
  .wi-cn{color:#999;font-size:13px;margin-left:8px}
  .wi-count{color:var(--red);font-size:12px;margin-left:auto;white-space:nowrap}
  .wi-actions{display:flex;gap:6px}
  .di-name{font-weight:600}
  .di-count{color:#999;font-size:13px;margin-left:auto}
  .deck-create{margin-top:18px;text-align:center}
  #deckName,#deckWords{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
  #deckWords{resize:vertical}
  .btn-danger{background:var(--red);color:#fff}

  @media(max-width:720px){
    .learn-grid,.match-grid,.options{grid-template-columns:1fr}
    .word-text{font-size:32px}
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;padding:12px;border-right:none;border-bottom:1px solid var(--border)}
    .brand{padding:0 6px 0 0}
    .menu-label,.menu-group-tabs,.sidebar-foot{display:none}
    .menu-group{flex-direction:row;flex-wrap:wrap}
    .menu-item{width:auto}
    .menu-item.active::before{display:none}
    .main{padding:18px 14px 50px}
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">词</div>
      <div>
        <div class="brand-name">墨词 · Lexi</div>
        <div class="brand-sub">中高考词汇研习</div>
      </div>
    </div>
    <div class="menu-label">词库专题</div>
    <div class="menu-group-tabs" id="groupTabs"></div>
    <div class="menu-label">检索单词</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索单词…" oninput="onSearch(this.value)">
      <div class="search-result" id="searchResult"></div>
    </div>
    <div class="menu-label">研习流程</div>
    <div class="menu-group" id="steps"></div>
    <div class="menu-label">复习巩固</div>
    <div class="menu-group" id="reviewMenu">
      <div class="menu-item" id="miReview" onclick="openMode('review')"><span class="mi-icon">📅</span><span>今日复习</span><span class="mi-num" id="dueBadge"></span></div>
      <div class="menu-item" id="miWrongbook" onclick="openMode('wrongbook')"><span class="mi-icon">📕</span><span>错题本</span><span class="mi-num" id="wrongBadge"></span></div>
      <div class="menu-item" id="miDecks" onclick="openMode('decks')"><span class="mi-icon">📚</span><span>我的词库</span></div>
    </div>
    <div class="sidebar-foot">墨词 Lexi · 词汇训练系统</div>
  </aside>
  <main class="main">
    <div class="main-head">
      <div class="main-title" id="mainTitle">词汇认知</div>
      <div class="main-sub" id="mainSub"></div>
      <div class="progress-bar"><div id="progressBar" style="width:0%"></div></div>
    </div>
    <section id="learnPage" class="card"></section>
    <section id="matchPage" class="card hidden"></section>
    <section id="choicePage" class="card hidden"></section>
    <section id="fillPage" class="card hidden"></section>
    <section id="spellPage" class="card hidden"></section>
    <section id="sentencePage" class="card hidden"></section>
    <section id="transPage" class="card hidden"></section>
    <section id="passagePage" class="card hidden"></section>
    <section id="resultPage" class="card hidden"></section>
    <section id="reviewPage" class="card hidden"></section>
    <section id="wrongbookPage" class="card hidden"></section>
    <section id="decksPage" class="card hidden"></section>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="words-data.js"></script>
<script src="examples_data.js"></script>
<script src="pics_data.js"></script>
<script src="syllables_data.js"></script>
<script src="atlas_pics.js"></script>
<script>
/* ================= 单词数据 ================= */
/* 词库从 words-data.js 的 WORD_DB 加载（7549 词，按级别分组）
   字段：w 单词, cn 释义, lv 级别
   运行时动态补齐：音标(有道)、图片(后端AI)、例句(内置模板) */
const LEVELS = ["初中", "高中"];
const LEVEL_EMOJI = { "初中":"🌱", "高中":"📚" };

// 例句模板库（按词义通用模板，目标词动态替换）
const EXAMPLE_TEMPLATES = [
  { en:"I learned the word \"__W__\" today.", cn:"今天我学会了单词 __W__。" },

// 匹配单词的词根词缀（优先词根 > 前缀 > 后缀）
function matchAffixes(w){
  const lower = w.toLowerCase();
  // 词根：按长度降序匹配（长词根优先，减少误匹配）
  const roots = AFFIXES.filter(a=>a.type==="root").sort((a,b)=>b.key.length-a.key.length);
  for(const a of roots){
    if(lower.includes(a.key) && lower.length - a.key.length >= 2){
      return a;
    }
  }
  for(const a of AFFIXES){
    if(a.type !== "prefix") continue;
    if(lower.startsWith(a.key) && lower.length - a.key.length >= 3){
      return a;
    }
  }
  for(const a of AFFIXES){
    if(a.type !== "suffix") continue;
    if(lower.endsWith(a.key) && lower.length - a.key.length >= 3){
      return a;
    }
  }
  return null;
}

// 从 WORD_DB 构建 GROUPS（兼容原有渲染逻辑）
const GROUPS = LEVELS.map(lv => ({
  name: lv + "词汇",
  emoji: LEVEL_EMOJI[lv],
  level: lv,
  words: (WORD_DB[lv] || []).map(([w, cn]) => buildWord(w, cn, lv))
}));

// 构建同源词索引：词根词缀 key -> 包含该词缀的单词列表
const AFFIX_INDEX = {};
GROUPS.forEach(g => g.words.forEach(w => {
  if(w._affixKey){
    (AFFIX_INDEX[w._affixKey] = AFFIX_INDEX[w._affixKey] || []).push(w);
  }
}));
// 为每个单词填充同源词
GROUPS.forEach(g => g.words.forEach(w => {
  if(w._affixKey){
    const same = (AFFIX_INDEX[w._affixKey] || []).filter(x => x.word !== w.word);
    w.related = same.slice(0, 6).map(x => x.word + " " + x.cn);
  }
}));

// 构建例句：优先用 EXAMPLES_DATA（Tatoeba 真实例句），否则用模板兜底
function buildExamples(w){
  const data = (typeof EXAMPLES_DATA !== 'undefined' && EXAMPLES_DATA[w.toLowerCase()]) || [];
  if(data.length){
    return data.slice(0, 5).map(e => ({ en: e.en, cn: e.cn }));
  }
  return EXAMPLE_TEMPLATES.map(t=>({
    en: t.en.replace(/__W__/g, `<B>${w}</B>`),
    cn: t.cn.replace(/__W__/g, w)
  }));
}

// 构建一个单词对象（动态补齐字段）
function buildWord(w, cn, lv){
  let cachedImg = "";
  try{ cachedImg = localStorage.getItem('wordimg_' + w) || ""; }catch(e){}
  const affix = matchAffixes(w);
  return {
    word: w,
    cn: cn,
    level: lv,
    ukPhonetic: "", usPhonetic: "",   // 音标运行时通过有道查询
    syllables: autoSyllables(w),       // 音节自动拆分
    related: [],                        // 同源词（AFFIX_INDEX 构建后填充）
    root: affix ? { text: affix.text, meaning: affix.meaning, type: affix.type, key: affix.key } : null,
    examples: buildExamples(w),         // 真实例句优先，模板兜底
    imageUrl: cachedImg,                // 优先从本地缓存读取（已生成的单词直接复用，节省额度）
    _cn: cn,
    _affixKey: affix ? affix.key : null // 用于同源词索引
  };
}

// 音节拆分：VCV/VCCV 规则粗拆 + cmudict 权威音标校准音节数 + 标注重音
function autoSyllables(w){
  if(!w) return [{text:''}];
  // 1. VCV/VCCV 粗拆（元音组 + 辅音归属规则）
  const vowels = "aeiouyAEIOUY";
  const n = w.length;
  const isV = [];
  for(let i=0;i<n;i++) isV.push(vowels.includes(w[i]));
  const vGroups = [];
  let i = 0;
  while(i < n){
    if(isV[i]){
      let j = i;
      while(j+1 < n && isV[j+1]) j++;
      vGroups.push([i, j]);
      i = j + 1;
    } else {
      i++;
    }
  }
  let segs;
  if(vGroups.length <= 1){
    segs = [w];
  } else {
    segs = [];
    let start = 0;
    for(let g=0; g<vGroups.length; g++){
      const ge = vGroups[g][1];
      if(g === vGroups.length - 1){
        segs.push(w.slice(start));
      } else {
        const ns = vGroups[g+1][0];
        const consCount = ns - ge - 1;
        let end = ge;
        if(consCount >= 2) end = ge + 1;
        segs.push(w.slice(start, end + 1));
        start = end + 1;
      }
    }
  }
  // 2. cmudict 权威校准：音节数 + 主重音位置（覆盖 98.8% 词）
  const info = (typeof SYLLABLES_DATA !== 'undefined' && SYLLABLES_DATA[w.toLowerCase()]) || null;
  let stress = -1;
  if(info){
    let arr = segs;
    // 音节数多拆了（如 silent e）→ 合并最短的相邻对
    while(arr.length > info.n){
      let bi = 0, bl = Infinity;
      for(let k=0;k<arr.length-1;k++){ const c = arr[k].length + arr[k+1].length; if(c < bl){ bl = c; bi = k; } }
      arr[bi] = arr[bi] + arr[bi+1]; arr.splice(bi+1, 1);
    }
    // 音节数少拆了 → 拆分最长的音节
    while(arr.length < info.n){
      let mi = 0;
      for(let k=0;k<arr.length;k++) if(arr[k].length > arr[mi].length) mi = k;
      const s = arr[mi], mid = Math.floor(s.length / 2);
      arr.splice(mi, 1, s.slice(0, mid), s.slice(mid));
    }
    segs = arr;
    stress = info.s;
  }
  return segs.map((text, idx)=>({ text, stress: idx===stress }));
}

let currentStep = 0; // 0学习 1连线 2词义选择 3选词填空 4拼写 5连词成句 6翻译 7语篇 8结果
let learnIndex = 0;
let BATCH_SIZE = 15; // 每批学习的单词数
let currentBatch = []; // 当前批次的学习词（从当前级别随机抽取）
let activeCustomWords = null; // 激活的自定义词库词对象数组（null=内置词库）

// 获取当前批次的学习词（不是全部词库）
const words = () => {
  if(currentBatch.length > 0) return currentBatch;
  if(activeCustomWords) return activeCustomWords.slice(0, BATCH_SIZE);
  return GROUPS[currentGroup].words.slice(0, BATCH_SIZE);
};
// 重新抽一批词
function newBatch(){
  const pool = activeCustomWords || GROUPS[currentGroup].words;
  const n = Math.min(BATCH_SIZE, pool.length);
  currentBatch = shuffle(pool).slice(0, n);
  learnIndex = 0;
}

const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

// 构建全库索引（word -> {w,cn,lv}）
const ALL_WORDS = [];
LEVELS.forEach(lv=>{
  (WORD_DB[lv]||[]).forEach(([w,cn])=>{ ALL_WORDS.push({w, cn, lv}); });
});
function onSearch(q){
  const box = $("#searchResult");
  if(!q || !q.trim()){ box.classList.remove("show"); return; }
  const kw = q.trim().toLowerCase();
  const hits = ALL_WORDS.filter(x=>x.w.toLowerCase().startsWith(kw)).slice(0,12);
  if(hits.length===0){ box.classList.remove("show"); return; }
  box.innerHTML = hits.map((h,i)=>`<div class="sr-item" onclick="jumpToWord(${i})" data-idx="${i}">` +
    `<span class="sr-word">${h.w}</span><span class="sr-cn">${h.cn.slice(0,20)}</span>` +
    `<span class="sr-cn" style="float:right">${h.lv}</span></div>`).join("");
  box.classList.add("show");
  box._hits = hits;
}
function jumpToWord(i){
  const hits = $("#searchResult")._hits || [];
  const hit = hits[i];
  if(!hit) return;
  // 切换到对应级别，并定位到该词
  const lvIdx = LEVELS.indexOf(hit.lv);
  if(lvIdx < 0) return;
  currentGroup = lvIdx;
  // 从该级别完整词库中定位目标词（不是当前15词批次），并重建批次：目标词放首位
  const pool = GROUPS[lvIdx].words;
  const target = pool.find(x=>x.word.toLowerCase()===hit.w.toLowerCase());
  if(!target) return;
  const rest = pool.filter(x=>x !== target);
  currentBatch = [target].concat(shuffle(rest).slice(0, BATCH_SIZE-1));
  learnIndex = 0;
  currentStep = 0;
  $("#searchInput").value = "";
  $("#searchResult").classList.remove("show");
  renderAll();
  toast(`已定位到 ${hit.w}`);
}

/* ================= 音频 ================= */
let currentAudio = null;
let playing = false;
function stopAudio(){
  if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; }
  if(window.speechSynthesis){ try{speechSynthesis.cancel();}catch(e){} }
  playing = false;
}
function playWordAudio(word, onEnd){
  stopAudio();
  const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
  currentAudio = a;
  a.play().then(()=>{}).catch(()=>{
    playTTS(word, onEnd);
  });
  if(onEnd) a.onended = onEnd;
}
function speakTTS(text, onEnd){
  try{
    if(!window.speechSynthesis){ toast("当前浏览器不支持发音"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .85;
    const voices = speechSynthesis.getVoices();
    const en = voices.find(v=>/^en(-|_)/i.test(v.lang)) || voices.find(v=>/en/i.test(v.lang));
    if(en) u.voice = en;
    if(onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  }catch(e){ toast("发音失败"); }
}
// 通用：用 edge-tts 播放文本（整句/音节/单词兜底统一走 /api/tts，微软神经网络音色）
function playTTS(text, onEnd){
  const a = new Audio("/api/tts?text=" + encodeURIComponent(text) + "&lang=en-US");
  currentAudio = a;
  if(onEnd) a.onended = onEnd;
  a.onerror = ()=>{ if(onEnd) onEnd(); };
  a.play().catch(()=>{ if(onEnd) onEnd(); });
}
// 例句整句朗读（edge-tts 自然整句，不再是逐词读）
function speakSentence(sentence){
  stopAudio();
  const plain = sentence.replace(/<[^>]+>/g,"");
  playTTS(plain);
}
function speakWords(sentence){
  const wordsArr = sentence.replace(/[^\w\s']/g," ").split(/\s+/).filter(w=>w.length>0);
  let i=0;
  (function playNext(){
    if(i>=wordsArr.length) return;
    const w = wordsArr[i];
    const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(w)+"&type=2");
    currentAudio = a;
    a.onended = ()=>{ i++; playNext(); };
    a.onerror = ()=>{ i++; playNext(); };
    a.play().catch(()=>{ i++; playNext(); });
  })();
}
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }

/* ================= 音节拆分朗读 ================= */
// 播放音节分段：逐段读，高亮对应部分，最后完整读2遍
function playSyllables(wordData){
  stopAudio();
  const syls = wordData.syllables;
  const word = wordData.word;
  // 高亮所有音节段
  const sylEls = document.querySelectorAll(".word-text .syl");
  let idx = 0;
  function playSeg(){
    if(idx >= syls.length){
      // 全部读完，完整单词读2遍
      readWhole(0);
      return;
    }
    // 高亮当前段
    sylEls.forEach((el,i)=>{ el.classList.toggle("active", i===idx); });
    const seg = syls[idx].text;
    // 音节片段用 edge-tts 朗读（不再用 speechSynthesis，避免无英文语音包导致没声音）
    playTTS(seg, ()=>{
      idx++;
      setTimeout(playSeg, 300);
    });
  }
  function readWhole(count){
    if(count >= 2){
      sylEls.forEach(el=>el.classList.remove("active"));
      playing = false;
      return;
    }
    // 完整单词真人发音
    const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
    currentAudio = a;
    a.onended = ()=>readWhole(count+1);
    a.onerror = ()=>{ playTTS(word, ()=>readWhole(count+1)); };
    a.play().catch(()=>{ playTTS(word, ()=>readWhole(count+1)); });
  }
  playSeg();
}

/* ================= 渲染 ================= */
function renderTabs(){
  $("#groupTabs").innerHTML = GROUPS.map((g,i)=>`<div class="menu-group-tab ${i===currentGroup?'active':''}" onclick="switchGroup(${i})"><span>${g.emoji}</span><span>${g.name}</span></div>`).join("");
}
function renderSteps(){
  $("#steps").innerHTML = STEPS.map((s,i)=>{
    const cls = i===currentStep?"active":(i<currentStep?"done":"");
    return `<div class="menu-item ${cls}" onclick="goStep(${i})"><span class="mi-icon">${s.icon}</span><span>${s.title}</span><span class="mi-num">${i<currentStep?'✓':(i+1)}</span></div>`;
  }).join("");
  // 更新主区标题
  $("#mainTitle").textContent = currentStep<STEPS.length ? STEPS[currentStep].title : "研习完成";
  $("#mainSub").textContent = currentStep<STEPS.length ? STEPS[currentStep].sub : "";
}
function updateProgress(){
  const w = words();
  if(currentStep===0){ $("#progressBar").style.width = (learnIndex/w.length*100)+"%"; }
  else if(currentStep>=1 && currentStep<STEP_LABELS.length){ $("#progressBar").style.width = (currentStep/STEP_LABELS.length*100)+"%"; }
  else { $("#progressBar").style.width = "100%"; }
}
function goStep(i){
  if(i===0) learnIndex = 0;
  currentStep = i;
  renderAll();
}
function switchGroup(i){
  currentGroup = i; currentStep=0; learnIndex=0; stopAudio();
  currentBatch = [];  // 清空批次，触发重新抽取
  newBatch();
  renderAll();
}
function renderAll(){
  renderTabs(); renderSteps(); updateProgress(); updateBadges();
  ["learnPage","matchPage","choicePage","fillPage","spellPage","sentencePage","transPage","passagePage","resultPage","reviewPage","wrongbookPage","decksPage"].forEach(id=>$("#"+id).classList.add("hidden"));
  // 复习巩固菜单高亮
  const miMap = { review:'miReview', wrongbook:'miWrongbook', decks:'miDecks' };
  ["miReview","miWrongbook","miDecks"].forEach(id=>{ const el=$("#"+id); if(el) el.classList.remove("active"); });
  if(miMap[appMode]){ const el=$("#"+miMap[appMode]); if(el) el.classList.add("active"); }
  stopAudio();
  if(appMode==='review'){ renderReview(); window.scrollTo({top:0}); return; }
  if(appMode==='wrongbook'){ renderWrongbook(); window.scrollTo({top:0}); return; }
  if(appMode==='decks'){ renderDecks(); window.scrollTo({top:0}); return; }
  if(currentStep===0) renderLearn();
  else if(currentStep===1) renderMatch();
  else if(currentStep===2) renderChoice();
  else if(currentStep===3) renderFill();
  else if(currentStep===4) renderSpell();
  else if(currentStep===5) renderSentence();
  else if(currentStep===6) renderTrans();
  else if(currentStep===7) renderPassage();
  else renderResult();
  window.scrollTo({top:0,behavior:"smooth"});
}

  else wb[word] = { cn: cn||'', count:1, ts: Date.now() };

function loadStudylog(){ return loadStore(LS.studylog, {}); }
function markLearned(word, level){
  const log = loadStudylog();
  if(!log[word]){ log[word] = { level, stage:0, nextDue: Date.now()+EBB_INTERVALS[0]*DAY }; }
  saveStore(LS.studylog, log);
  updateBadges();
}
function getDueReviews(){
  const log = loadStudylog();
  const now = Date.now();
  return Object.entries(log).filter(([,r])=>r.nextDue && r.nextDue<=now)
    .map(([w,r])=>({ word:w, cn:findCn(w), stage:r.stage||0, nextDue:r.nextDue }))
    .sort((a,b)=>a.nextDue-b.nextDue);
}
function reviewResult(word, result){
  const log = loadStudylog();
  const r = log[word];
  if(!r) return;
  if(result==='know') r.stage = Math.min((r.stage||0)+1, EBB_INTERVALS.length-1);
  else if(result==='fuzzy') r.stage = Math.max((r.stage||0)-1, 0);
  else r.stage = 0;
  r.nextDue = Date.now() + EBB_INTERVALS[r.stage]*DAY;
  saveStore(LS.studylog, log);
}

function findCn(word){
  const lw = word.toLowerCase();
  for(const lv of Object.keys(WORD_DB)){ const hit=(WORD_DB[lv]||[]).find(x=>x[0].toLowerCase()===lw); if(hit) return hit[1]; }
  for(const d of loadDecks()){ const hit=(d.words||[]).find(x=>x[0].toLowerCase()===lw); if(hit) return hit[1]; }
  return '';
}

function createDeck(){

  if(!raw){ toast("请粘贴单词"); return; }

    // 以第一个中文字符为界，前为英文（可含短语），后为释义
    const m = t.match(/[\u4e00-\u9fff]/);

      const en = t.slice(0, m.index).replace(/[\s,，;；:：]+$/, '').trim();
      const cn = t.slice(m.index).trim();
      return en ? [en, cn] : [t, ''];
    }
    return [t, ''];
  }).filter(x=>x!==null);
  if(words.length===0){ toast("未能解析出单词，请检查格式"); return; }
  const decks = loadDecks();

/* 音标按需查询（走后端中转，解决有道接口 CORS 限制） */
async function loadPhonetic(w){
  const box = $("#phoneticBox");
  if(!box) return;
  try{
    const resp = await fetch(`/api/phonetic?q=${encodeURIComponent(w.word)}`);
    if(!resp.ok) throw new Error('http '+resp.status);
    const data = await resp.json();
    let uk = data.uk || "", us = data.us || "";
    if(uk) uk = "/"+uk+"/"; if(us) us = "/"+us+"/";
    if(uk || us){
      w.ukPhonetic = uk; w.usPhonetic = us;
      box.innerHTML = `英 ${uk} &nbsp; 美 ${us}`;
    } else {
      box.innerHTML = '';
    }
  }catch(e){
    if(box) box.innerHTML = '';
  }
}

/* 单词配图三级策略：
   ① 本地缓存（有道图/AI图都缓存，刷新秒开）
   ② 有道图解词典（PICS_DATA，免费、国内直连，约60%词有图）
   ③ Agnes AI 生成兜底（仅抽象词，额度需求减半） */
const IMG_CACHE_PREFIX = 'wordimg_';
function getCachedImage(word){
  try{ return localStorage.getItem(IMG_CACHE_PREFIX + word) || ''; }catch(e){ return ''; }
}
function setCachedImage(word, url){
  try{ localStorage.setItem(IMG_CACHE_PREFIX + word, url); }catch(e){}
}
function imgTag(url, word){
  return `<img src="${url}" alt="${word}" onerror="onImgFail(this.parentElement,'${word}')">`;
}
async function loadImage(w){
  const imgEl = $("#wordImg");
  if(!imgEl) return;
  if(w.imageUrl){ return; }
  // 1. 本地缓存
  const cached = getCachedImage(w.word);
  if(cached){
    w.imageUrl = cached;
    imgEl.innerHTML = imgTag(cached, w.word);
    return;
  }
  // 2. Word Atlas 插画优先（开源 CC BY 4.0，覆盖74%含抽象词）
  const at = (typeof ATLAS_PICS !== 'undefined' && ATLAS_PICS[w.word.toLowerCase()]) || '';
  if(at){
    w.imageUrl = at;
    setCachedImage(w.word, at);
    imgEl.innerHTML = imgTag(at, w.word);
    return;
  }
  // 3. 有道图解词典兜底（具体名词）
  const yd = (typeof PICS_DATA !== 'undefined' && PICS_DATA[w.word.toLowerCase()]) || '';
  if(yd){
    w.imageUrl = yd;
    setCachedImage(w.word, yd);
    imgEl.innerHTML = imgTag(yd, w.word);
    return;
  }
  // 4. 最后 AI 生成兜底（抽象词）
  await genImage(w, imgEl);
}
async function genImage(w, imgEl){
  try{
    // 取该词最长的一条例句作为生图语境（让 AI 按例句场景画，更贴词义）
    let sentence = '';
    if(w.examples && w.examples.length){
      const arr = w.examples.map(e=>e.en.replace(/<[^>]+>/g,'').trim());
      arr.sort((a,b)=>b.length-a.length);
      sentence = arr[0] || '';
    }
    const resp = await fetch('/api/generate-image', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ word: w.word, cn: w._cn || w.cn, sentence })
    });
    if(!resp.ok) throw new Error('http '+resp.status);
    const data = await resp.json();
    if(data.url){
      w.imageUrl = data.url;
      setCachedImage(w.word, data.url);
      imgEl.innerHTML = imgTag(data.url, w.word);
    }
  }catch(e){
    // AI 失败（额度用尽等）保留占位，下次进入重试
  }
}
// 图片加载失败：按顺序回退 有道图 → AI，全部失败则显示占位符
async function onImgFail(el, word){
  try{ localStorage.removeItem(IMG_CACHE_PREFIX + word); }catch(e){}
  const w = words().find(x=>x.word === word);
  if(!w){ el.innerHTML = '<span class="emoji">🖼️</span>'; return; }
  const lw = word.toLowerCase();
  const yd = (typeof PICS_DATA !== 'undefined' && PICS_DATA[lw]) || '';
  const fail = (w._imgFail = (w._imgFail||0) + 1);
  w.imageUrl = '';
  if(fail === 1 && yd){ // 第一次失败 → 试有道图
    w.imageUrl = yd; setCachedImage(word, yd); el.innerHTML = imgTag(yd, word); return;
  }
  if(fail <= 2 && !w._aiTried){ // 第二次失败 → 试 AI 生成
    w._aiTried = true; await genImage(w, el);
  }
  if(!w.imageUrl){ el.innerHTML = '<span class="emoji">🖼️</span>'; }
}

function matchClick(side,i){
  if(side==="en"){
    matchState.selected = {side:"en",i};
    document.querySelectorAll(".match-item").forEach(e=>e.classList.remove("selected"));
    $("#en-"+i).classList.add("selected");
  } else {
    if(!matchState.selected || matchState.selected.side!=="en") return;
    const enIdx = matchState.selected.i;
    const enWord = matchState.en[enIdx];
    const cnWord = matchState.cn[i];
    const correct = words().find(x=>x.word===enWord)?.cn === cnWord;
    const enEl = $("#en-"+enIdx), cnEl = $("#cn-"+i);
    if(correct){ enEl.classList.remove("selected","wrong"); enEl.classList.add("right","done"); cnEl.classList.add("right","done"); matchState.right.add(enWord); toast("✅ 配对正确！"); }
    else { enEl.classList.add("wrong"); cnEl.classList.add("wrong"); addWrong(enWord, cnWord); setTimeout(()=>{enEl.classList.remove("wrong");cnEl.classList.remove("wrong");},400); toast("❌ 再想想～"); }
    matchState.selected = null;
    if(matchState.right.size === words().length){ setTimeout(()=>{ toast("🎉 全部配对完成！"); setTimeout(()=>goStep(2),1200); },800); }
  }
}

/* ================= 题型2：词义匹配选择 ================= */
let choiceState = { idx:0 };
function renderChoice(){
  choiceState = { idx:0 };
  renderChoiceQ();
}
function renderChoiceQ(){
  const w = words()[choiceState.idx];
  // 生成选项：正确 + 3个干扰（从其他词的中文释义取）
  const others = words().filter(x=>x.word!==w.word).map(x=>x.cn);
  const opts = shuffle([w.cn, ...shuffle(others).slice(0,3)]);
  choiceState.answer = w.cn;
  // 例句：用第一个例句，目标词加粗
  const example = w.examples[0];
  const enHtml = example.en.replace(/<B>(.*?)<\/B>/g, (m,p1)=>`<b>${p1}</b>`);
  $("#choicePage").classList.remove("hidden");
  $("#choicePage").innerHTML = `
    <h2 class="page-title">🎯 词义甄别</h2>
    <p class="page-sub">语境之中，辨明加粗单词的真义</p>
    <div class="question">
      <div class="q-index">第 ${choiceState.idx+1} / ${words().length} 题</div>
      <div class="q-sentence">${enHtml}</div>
    </div>
    <div class="options">${opts.map((o,i)=>`<div class="option" onclick="answerChoice(${i},this)">${o}</div>`).join("")}</div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(3)">跳过本题型 →</button></div>
  `;
}
function answerChoice(i, el){
  const opts = el.parentElement.querySelectorAll(".option");
  const correct = el.textContent.trim() === choiceState.answer;
  if(correct){ el.classList.add("right"); toast("✅ 正确！"); }
  else { el.classList.add("wrong"); addWrong(words()[choiceState.idx].word, words()[choiceState.idx].cn); opts.forEach(o=>{ if(o.textContent.trim()===choiceState.answer) o.classList.add("right"); }); toast("❌ 正确答案已标绿"); }
  opts.forEach(o=>o.style.pointerEvents="none");
  setTimeout(()=>{
    if(choiceState.idx < words().length-1){ choiceState.idx++; renderChoiceQ(); }
    else { goStep(3); }
  }, 1200);
}

/* ================= 题型3：选词填空 ================= */
let fillState = { idx:0 };
function renderFill(){
  fillState = { idx:0 };
  renderFillQ();
}
function renderFillQ(){
  const w = words()[fillState.idx];
  // 挖空：用例句，把目标词挖掉
  const example = w.examples[0];
  const plain = example.en;
  const target = w.word;
  const sentence = plain.replace(new RegExp(target,"i"), "______");
  const sentenceHtml = plain.replace(new RegExp(target,"i"), "<b>______</b>");
  // 选项：目标词 + 干扰词（本组其他词 + 易混词）
  const distractorPool = [];
  words().forEach(x=>{ if(x.word!==w.word) distractorPool.push(x.word); });
  // 易混词补充（形近）
  const confusable = { restaurant:["rest","reservation"], menu:["memo","manual"], waiter:["water","writer"], delicious:["delicate","delight"], reservation:["preservation","observation"],
    airport:["seaport","air"], passport:["pass","port"], luggage:["baggage","language"], destination:["station","designation"], souvenir:["memory","remember"],
    teacher:["teach","reacher"], library:["liberty","literary"], subject:["object","project"], homework:["housework","work"], knowledge:["know","acknowledge"],
    family:["familiar","famous"], father:["farther","feature"], mother:["other","month"], sister:["resister","sisterly"], friend:["fiend","fried"] };
  const conf = (confusable[w.word]||[]);
  const opts = shuffle([w.word, ...shuffle(distractorPool).slice(0,2), ...conf.slice(0,1)].slice(0,4));
  fillState.answer = w.word;
  $("#fillPage").classList.remove("hidden");
  $("#fillPage").innerHTML = `
    <h2 class="page-title">✍️ 语境填空</h2>
    <p class="page-sub">一词入句，选择恰如其分的单词</p>
    <div class="question">
      <div class="q-index">第 ${fillState.idx+1} / ${words().length} 题 · 中文：${w.cn}</div>
      <div class="q-sentence">${sentenceHtml}</div>
    </div>
    <div class="options">${opts.map((o,i)=>`<div class="option" onclick="answerFill(${i},this)">${o}</div>`).join("")}</div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(4)">跳过本题型 →</button></div>
  `;
}
function answerFill(i, el){
  const opts = el.parentElement.querySelectorAll(".option");
  const correct = el.textContent.trim() === fillState.answer;
  if(correct){ el.classList.add("right"); toast("✅ 正确！"); }
  else { el.classList.add("wrong"); addWrong(words()[fillState.idx].word, words()[fillState.idx].cn); opts.forEach(o=>{ if(o.textContent.trim()===fillState.answer) o.classList.add("right"); }); toast("❌ 正确答案已标绿"); }
  opts.forEach(o=>o.style.pointerEvents="none");
  setTimeout(()=>{ if(fillState.idx<words().length-1){ fillState.idx++; renderFillQ(); } else { goStep(4); } }, 1200);
}

/* ================= 题型4：单词拼写（修复bug） ================= */
let spellState = { idx:0, slots:[], letters:[], used:new Set(), letterIndex:[] };
function renderSpell(){
  spellState = { idx:0 };
  renderSpellWord();
}
function renderSpellWord(){
  const w = words()[spellState.idx];
  spellState.slots = [];       // 已填字母序列
  spellState.letterIndex = []; // 每个已填字母对应的原始letter索引
  spellState.letters = shuffle(w.word.split(""));
  $("#spellPage").classList.remove("hidden");
  $("#spellPage").innerHTML = `
    <h2 class="page-title">🔤 拼写重构</h2>
    <p class="page-sub">乱序字母归位，重现原词（点击已填字母可修改）</p>
    <div style="text-align:center">
      <div class="spell-cn">释义：${w.cn} &nbsp; <span style="color:var(--muted)">(${w.word.length} 个字母)</span></div>
      <button class="btn btn-ghost" style="padding:8px 20px;font-size:14px;margin-bottom:14px" onclick="playWordAudio('${w.word}')">🔊 听发音</button>
      <div class="answer-slots">${w.word.split("").map((_,i)=>`<div class="slot" id="slot-${i}" onclick="removeLetter(${i})"></div>`).join("")}</div>
      <div class="letters">${spellState.letters.map((ch,i)=>`<div class="letter-tile" id="lt-${i}" onclick="addLetter(${i})">${ch}</div>`).join("")}</div>
      <button class="btn btn-primary" onclick="checkSpell()">提交答案</button>
      <button class="btn btn-ghost" onclick="clearSpell()">清空重来</button>
    </div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(5)">跳过本题型 →</button></div>
  `;
}
function addLetter(i){
  const w = words()[spellState.idx];
  if(spellState.slots.length >= w.word.length) return;
  // 防止同一字母被重复选用
  if(spellState.letterIndex.includes(i)) return;
  const ch = spellState.letters[i];
  spellState.slots.push(ch);
  spellState.letterIndex.push(i);
  $("#lt-"+i).classList.add("used");
  renderSlots();
}
function clearSpell(){
  // 一键清空：恢复所有已用字母，重新拼写
  spellState.letterIndex.forEach(li=>{
    const tile = $("#lt-"+li);
    if(tile) tile.classList.remove("used");
  });
  spellState.slots = [];
  spellState.letterIndex = [];
  renderSlots();
}
function removeLetter(slotIdx){
  if(slotIdx >= spellState.slots.length) return;
  // 找到该槽位对应的字母索引并恢复
  const li = spellState.letterIndex[slotIdx];
  spellState.slots.splice(slotIdx,1);
  spellState.letterIndex.splice(slotIdx,1);
  const tile = $("#lt-"+li);
  if(tile) tile.classList.remove("used");
  renderSlots();
}
function renderSlots(){
  const w = words()[spellState.idx];
  for(let i=0;i<w.word.length;i++){
    const s = $("#slot-"+i);
    if(!s) continue;
    const ch = spellState.slots[i] || "";
    s.textContent = ch;
    s.classList.toggle("filled", !!ch);
    s.classList.remove("right","wrong");
  }
}
function checkSpell(){
  const w = words()[spellState.idx];
  const ans = spellState.slots.join("");
  if(ans.length < w.word.length){ toast("还没拼完哦"); return; }
  const slots = document.querySelectorAll("#spellPage .slot");
  if(ans === w.word){
    slots.forEach(s=>s.classList.add("right"));
    toast("✅ 拼写正确！");
    setTimeout(()=>{ if(spellState.idx<words().length-1){ spellState.idx++; renderSpellWord(); } else { goStep(5); } },900);
  } else {
    slots.forEach((s,i)=>s.classList.add(w.word[i]===ans[i]?"right":"wrong"));
    addWrong(w.word, w.cn);
    toast("❌ 拼错了，点击已填字母修改后重试");
    setTimeout(()=>{ slots.forEach(s=>s.classList.remove("right","wrong")); },1000);
  }
}

/* ================= 题型5：连词成句 ================= */
let sentenceState = { idx:0, frags:[], built:[] };
function renderSentence(){
  sentenceState = { idx:0 };
  renderSentenceQ();
}
function renderSentenceQ(){
  const w = words()[sentenceState.idx];
  const example = w.examples[0];
  const plain = example.en.replace(/<[^>]+>/g,"");
  // 拆分为碎片（按单词+标点）
  const tokens = plain.match(/[A-Za-z']+|[.,?!]/g) || [];
  sentenceState.frags = shuffle(tokens);
  sentenceState.built = [];
  sentenceState.target = tokens;
  $("#sentencePage").classList.remove("hidden");
  $("#sentencePage").innerHTML = `
    <h2 class="page-title">🧩 句式组配</h2>
    <p class="page-sub">缀词成句，拼出完整句式（点击已选碎片可撤回）</p>
    <div class="question">
      <div class="q-index">第 ${sentenceState.idx+1} / ${words().length} 题</div>
      <div class="q-sentence" style="color:var(--muted)">参考中文：${example.cn}</div>
    </div>
    <div class="sentence-build" id="buildArea"></div>
    <div class="sentence-frag" id="fragArea">${sentenceState.frags.map((f,i)=>`<span class="frag" id="fr-${i}" onclick="pickFrag(${i})">${f}</span>`).join("")}</div>
    <div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="checkSentence()">提交答案</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-skip" onclick="goStep(6)">跳过本题型 →</button></div>
  `;
}
function pickFrag(i){
  const f = sentenceState.frags[i];
  const fr = $("#fr-"+i);
  if(fr.classList.contains("used")) return;
  sentenceState.built.push({text:f, idx:i});
  fr.classList.add("used");
  renderBuild();
}
function renderBuild(){
  const area = $("#buildArea");
  area.innerHTML = sentenceState.built.map((b,k)=>`<span class="frag" onclick="unpickFrag(${k})">${b.text}</span>`).join("");
}
function unpickFrag(k){
  const b = sentenceState.built[k];
  sentenceState.built.splice(k,1);
  const fr = $("#fr-"+b.idx);
  if(fr) fr.classList.remove("used");
  renderBuild();
}
function checkSentence(){
  const builtStr = sentenceState.built.map(b=>b.text).join(" ");
  const targetStr = sentenceState.target.join(" ");
  const area = $("#buildArea");
  if(builtStr === targetStr){
    area.querySelectorAll(".frag").forEach(f=>f.classList.add("right"));
    toast("✅ 拼句正确！");
    setTimeout(()=>{ if(sentenceState.idx<words().length-1){ sentenceState.idx++; renderSentenceQ(); } else { goStep(6); } },1100);
  } else {
    addWrong(words()[sentenceState.idx].word, words()[sentenceState.idx].cn);
    toast("❌ 顺序不对，点击已选碎片撤回重排");
  }
}

/* ================= 题型6：句子翻译 ================= */
let transState = { idx:0 };
function renderTrans(){
  transState = { idx:0 };
  renderTransQ();
}
function renderTransQ(){
  const w = words()[transState.idx];
  const example = w.examples[0];
  transState.answer = example.en.replace(/<[^>]+>/g,"");
  $("#transPage").classList.remove("hidden");
  $("#transPage").innerHTML = `
    <h2 class="page-title">🌐 双语转译</h2>
    <p class="page-sub">汉译英，运用本节课所学单词</p>
    <div class="question">
      <div class="q-index">第 ${transState.idx+1} / ${words().length} 题 · 提示单词：${w.word}</div>
      <div class="q-sentence">${example.cn}</div>
    </div>
    <div class="trans-area"><textarea id="transInput" placeholder="在此输入英文翻译..."></textarea></div>
    <div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="checkTrans()">提交并查看答案</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-skip" onclick="goStep(7)">跳过本题型 →</button></div>
  `;
}
function checkTrans(){
  const input = $("#transInput").value.trim();
  if(!input){ toast("请先输入你的翻译"); return; }
  // 简单判分：比较是否包含目标词
  const target = words()[transState.idx].word.toLowerCase();
  const hasTarget = input.toLowerCase().includes(target);
  let msg = "";
  if(hasTarget){ msg = "✅ 很好！你正确使用了目标单词 "+words()[transState.idx].word; }
  else { msg = "⚠️ 建议在句中用上目标单词 "+words()[transState.idx].word; addWrong(words()[transState.idx].word, words()[transState.idx].cn); }
  // 显示参考答案
  toast(msg);
  const area = document.querySelector("#transPage .trans-area");
  area.innerHTML = `<div style="color:var(--green);font-weight:600;margin-bottom:6px">参考答案：</div><div>${transState.answer}</div><div style="margin-top:14px"><button class="btn btn-ghost" onclick="nextTrans()">下一题 →</button></div>`;
}
function nextTrans(){
  if(transState.idx<words().length-1){ transState.idx++; renderTransQ(); } else { goStep(7); }
}

/* ================= 题型7：语篇短文 ================= */
function renderPassage(){
  const w = words();
  // 动态词库：把本批词的例句串联成一篇复习短文（目标词标黄）
  const sentences = w.map(x=>{
    const ex = x.examples[0];
    const plain = ex.en.replace(/<[^>]+>/g,"");
    const hl = plain.replace(new RegExp(x.word,"i"), m=>`<span class="hl">${m}</span>`);
    return `<p style="margin-bottom:12px">${hl}</p>`;
  }).join("");
  const cnList = w.map(x=>`<p style="margin-bottom:6px"><b>${x.word}</b> — ${x.cn}</p>`).join("");
  $("#passagePage").classList.remove("hidden");
  $("#passagePage").innerHTML = `
    <h2 class="page-title">📜 篇章研读</h2>
    <p class="page-sub">本批词汇融于例句，目标词已标黄，通读复习</p>
    <div class="passage">${sentences}</div>
    <div class="passage-trans"><b>本批词汇释义：</b><br>${cnList}</div>
    <div style="text-align:center;margin-top:20px">
      <button class="btn btn-ghost" onclick="speakPassage()">🔊 朗读短文</button>
      <button class="btn btn-primary" onclick="goStep(8)">完成，查看结果 →</button>
    </div>
  `;
}
function speakPassage(){
  const w = words();
  const plain = w.map(x=>x.examples[0].en.replace(/<[^>]+>/g,"")).join(". ");
  speakSentence(plain);
}

/* ================= 结果页 ================= */
function renderResult(){
  $("#resultPage").classList.remove("hidden");
  $("#resultPage").innerHTML = `
    <div class="result-box">
      <div class="result-emoji">🎉</div>
      <div class="result-score">完成！</div>
      <div class="result-msg">你已完成「${GROUPS[currentGroup].name}」本批 ${words().length} 词研习：<br>词汇认知 → 语义词联 → 词义甄别 → 语境填空 → 拼写重构 → 句式组配 → 双语转译 → 篇章研读</div>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-ghost" onclick="againBatch()">🔁 再学一遍</button>
        <button class="btn btn-primary" onclick="nextBatch()">换一批词 →</button>
      </div>
    </div>
  `;
}
function againBatch(){
  currentStep = 0; learnIndex = 0;
  renderAll();
}
function nextBatch(){
  currentStep = 0; learnIndex = 0;
  newBatch();
  renderAll();
}

/* ================= 初始化 ================= */
newBatch();
renderAll();
</script>
