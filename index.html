/* ---- 背景节奏（Web Audio 合成，无外部音频文件；可在 HUD 里一键关闭） ---- */
const bgm = {
  ac:null, timer:null, on:false, urgent:false, step:0, muted:false,
  ensure(){
    if(this.muted) return null;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    if(!this.ac){
      try{ this.ac = new AC(); }catch(e){ return null; }
    }
    if(this.ac.state === 'suspended'){ try{ this.ac.resume(); }catch(e){} }
    return this.ac;
  },
  blip(freq, dur, type, vol){
    const ac = this.ac;
    if(!ac) return;
    try{
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + dur + 0.02);
    }catch(e){}
  },
  beat(){
    this.step++;
    if(this.step % 4 === 1){ this.blip(104, 0.16, 'sine', 0.09); this.blip(208, 0.09, 'triangle', 0.03); }
    else this.blip(150, 0.055, 'square', 0.022);
    if(this.urgent) this.blip(880, 0.03, 'square', 0.018);
  },
  start(){
    if(!this.ensure()) return;
    if(this.timer) return;
    this.on = true; this.step = 0;
    const loop = () => {
      if(!this.on) return;
      this.beat();
      this.timer = setTimeout(loop, this.urgent ? 300 : 420);
    };
    this.timer = setTimeout(loop, 80);
  },
  stop(){ this.on = false; if(this.timer){ clearTimeout(this.timer); this.timer = null; } this.urgent = false; },
  setUrgent(v){ this.urgent = !!v; },
  toggle(){
    const next = !loadStore(LS_BGM, true);
    saveStore(LS_BGM, next);
    this.muted = !next;
    if(next){ this.start(); } else { this.stop(); }
    return next;
  },
  enabled(){ return !!loadStore(LS_BGM, true); }
};
function stopBgm(){ bgm.stop(); }

/* ---- 意群切分：按「介词短语 / 从句 / 标点」成组，而不是拆成单个单词 ---- */
const PREP_SET = new Set(('about above across after against along among around as at before behind below beneath beside besides between beyond by despite down during except for from in inside into like near of off on onto out outside over past since through throughout till to toward towards under until up upon with within without').split(' '));
const SUBORD_SET = new Set(('because although though while when whenever where wherever if unless until since than whether that which who whom whose what how why').split(' '));
const COORD_SET = new Set(['and','but','or','so','yet']);
const DET_SET = new Set(('a an the this that these those my your his her its our their some any no every each another other').split(' '));
const AUX_SET = new Set('is am are was were be been being do does did have has had will would can could shall should may might must'.split(' '));
// 规则动词靠词库里的 "v." 前缀推导变形；不规则动词单独列（went / made / took 这类查不到原形）
const IRREG_VERBS = new Set(('went gone made took taken said found gave given got gotten knew known saw seen came come thought told became become left felt put brought began begun kept held wrote written stood heard let meant set met ran paid sat spoke spoken led grew grown lost fell fallen sent built understood drew drawn broke broken spent cut rose risen drove driven bought wore worn chose chosen ate eaten read woke woken taught caught threw thrown slept slid sought sold fought struck dealt arose arisen forbade forbidden forgave forgiven froze frozen hid hidden bit bitten blew blown bore borne swore sworn tore torn').split(' '));
let _verbSet = null;
function verbForms(){
  if(_verbSet) return _verbSet;
  const s = new Set(IRREG_VERBS);
  const add = w => { if(w && w.length > 1) s.add(w); };
  for(const lv of Object.keys(WORD_DB)){
    for(const item of WORD_DB[lv]){
      const word = String(item[0] || '').toLowerCase().replace(/[^a-z]/g, '');
      if(!word) continue;
      const m = String(item[1] || '').match(CN_POS_RE);
      if(!m || !/v/.test(m[1].toLowerCase())) continue;
      add(word);
      if(/e$/.test(word)){ add(word + 's'); add(word + 'd'); add(word.slice(0, -1) + 'ing'); }
      else if(/[^aeiou]y$/.test(word)){ add(word.slice(0, -1) + 'ies'); add(word.slice(0, -1) + 'ied'); add(word + 'ing'); }
      else {
        add(word + 's'); add(word + 'ed'); add(word + 'ing');
        if(/[^aeiou][aeiou][bdgklmnprt]$/.test(word)){
          add(word + word.slice(-1) + 'ed');
          add(word + word.slice(-1) + 'ing');
        }
      }
    }
  }
  _verbSet = s;
  return s;
}
function tokenIsVerb(t){
  if(!t || AUX_SET.has(t)) return false;
  return verbForms().has(t);
}
// 粗略的形容词判断，只用于「形容词 + 名词」不误判成「主语 + 谓语」
function looksAdj(w){
  return /(al|ive|ous|ic|ical|able|ible|ful|less|ary|ent|ant|ish)$/.test(String(w || '').toLowerCase().replace(/[,.;:!?]$/, ''));
}
function chunkSentence(text){
  const raw = String(text || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  if(!raw) return [];
  const toks = raw.match(/[A-Za-z0-9'’\-]+[,.;:!?]?/g) || [];
  if(!toks.length) return [];
  const chunks = [];
  let cur = [];
  const flush = () => { if(cur.length){ chunks.push(cur.join(' ')); cur = []; } };
  const bare = s => String(s || '').toLowerCase().replace(/[,.;:!?]$/, '');
  const lastBare = () => bare(cur[cur.length - 1]);
  const curIsPP = () => cur.length > 0 && PREP_SET.has(bare(cur[0]));
  for(let i = 0; i < toks.length; i++){
    const tk = toks[i];
    const low = bare(tk);
    const prevPunct = i > 0 && /[,.;:!?]$/.test(toks[i - 1]);
    let boundary = false;
    if(prevPunct) boundary = true;
    else if(SUBORD_SET.has(low) && cur.length >= 2) boundary = true;
    else if(COORD_SET.has(low) && cur.length >= 5) boundary = true;
    // 介词短语内部不再切：只有"上一个词不是限定词"时才认为前一个介词短语已经说完
    else if(PREP_SET.has(low) && cur.length >= 2 && !DET_SET.has(lastBare())) boundary = true;
    // 介词短语说完了，谓语（含助动词）另起一块。
    // 例外：前一个词是形容词、当前词又长得像第三人称单数/复数（answers、plans、works），
    // 多半是「形容词 + 名词」，不是谓语，切下去会把 academic answers 劈成两半。
    else if(cur.length >= 3 && curIsPP() && !COORD_SET.has(lastBare()) && (AUX_SET.has(low) || (tokenIsVerb(low) && !(looksAdj(lastBare()) && /s$/.test(low))))) boundary = true;
    if(boundary) flush();
    cur.push(tk);
    if(/[,.;:!?]$/.test(tk)) flush();
  }
  flush();
  // 把孤零零的单词语群并到相邻语群（否则会出现只有一个 "The" 的碎片）
  for(let i = chunks.length - 1; i >= 0; i--){
    if(chunks[i].split(' ').length > 1 || chunks.length === 1) continue;
    if(i > 0) chunks[i - 1] += ' ' + chunks[i];
    else chunks[i + 1] = chunks[i] + ' ' + chunks[i + 1];
    chunks.splice(i, 1);
  }
  return chunks;
}
// 优秀档如果自然意群不够 8 块，就把最长的那块继续拆细（从句 → 逗号 → 谓语 → 介词 → 状语 → 不定式）
function forceChunks(chunks, target){
  const out = chunks.slice();
  const wc = s => String(s).trim().split(/\s+/).filter(Boolean).length;
  const bare = s => String(s).trim().toLowerCase();
  // 六档切法，从强语法边界到弱边界依次退让，保证切出来的仍是「意群」而不是碎词
  const TIERS = [
    { re: /^(.+?)\s+(and|or|but|so|because|although|though|while|when|if|that|which|who|where)\s+(.+)$/i,
      parts: m => [m[1], m[2] + ' ' + m[3]] },
    { re: /^(.+?),+\s*(.+)$/,
      parts: m => [m[1] + ',', m[2]] },
    { re: /^(.+?)\s+(to|is|are|was|were|has|have|had|will|would|can|could|should|may|might|must|do|does|did)\s+(.+)$/i,
      parts: m => [m[1], m[2] + ' ' + m[3]] },
    { re: /^(.+?)\s+(with|for|from|by|in|on|at|of|about|into|over|under|after|before|during|without|through|across|against)\s+(.+)$/i,
      parts: m => [m[1], m[2] + ' ' + m[3]] },
    // 状语 / 否定词另起一块：not / never / also / just / only / even / still / already / almost
    { re: /^(.+?)\s+(not|never|also|just|only|even|still|already|almost|always|often|usually|sometimes|really|quite|rather|too|very)\s+(.+)$/i,
      parts: m => [m[1], m[2] + ' ' + m[3]] },
    // 不定式 / 动名词短语
    { re: /^(.+?)\s+(to|of|for)\s+([a-z]+ing\b.*)$/i,
      parts: m => [m[1], m[2] + ' ' + m[3]] }
  ];
  const pickBest = (minSide) => {
    for(const t of TIERS){
      let best = null;
      for(let i = 0; i < out.length; i++){
        const m = out[i].match(t.re);
        if(!m) continue;
        const parts = t.parts(m);
        if(parts.length < 2) continue;
        if(parts.some(p => wc(p) < minSide)) continue;
        // 放宽到 1 个词时，不许把 the / a / his 这类限定词单独成块
        if(minSide === 1 && parts.some(p => DET_SET.has(bare(p).replace(/^[,.;:!?]+|[,.;:!?]+$/g, '')))) continue;
        const len = wc(out[i]);
        if(!best || len > best.len) best = { i, parts, len };
      }
      if(best) return best;          // 高优先级切法有解就不动用更弱的
    }
    return null;
  };
  let guard = 0;
  while(out.length < target && guard++ < 40){
    // 先按「两侧至少 2 个词」切；实在凑不够 8 块才放宽到 1 个词
    let best = pickBest(2) || pickBest(1);
    if(!best){
      // 兜底：把最长的一块从中间劈开（两侧各至少 2 词），保证中等/优秀档真的到 5/8 块
      if(target < 5) break;
      const minW = target >= 8 ? 4 : 5;
      let pick = null;
      for(let i = 0; i < out.length; i++){
        const toks = out[i].trim().split(/\s+/);
        if(toks.length < minW) continue;
        if(!pick || toks.length > pick.n) pick = { i, toks, n: toks.length };
      }
      if(!pick) break;
      // 切点从中间向两侧找，两侧都不能停在限定词/介词上（避免切出 "while the" + "Meatpacking…"）
      const mid = Math.floor(pick.toks.length / 2);
      const strip = s => bare(s).replace(/^[,.;:!?]+|[,.;:!?]+$/g, '');
      let k = -1;
      for(let d = 0; d < 3 && k < 0; d++){
        for(const cand of [mid - d, mid + d]){
          if(cand < 2 || cand > pick.toks.length - 2) continue;
          const leftLast = strip(pick.toks[cand - 1]);
          const rightFirst = strip(pick.toks[cand]);
          if(DET_SET.has(rightFirst) || DET_SET.has(leftLast)) continue;
          if(PREP_SET.has(leftLast) || COORD_SET.has(leftLast)) continue;
          k = cand; break;
        }
      }
      if(k < 0) break;
      best = { i: pick.i, parts: [pick.toks.slice(0, k).join(' '), pick.toks.slice(k).join(' ')] };
    }
    out.splice(best.i, 1, ...best.parts);
  }
  return out;
}
// 按难度挑句子：基础要 3-5 个意群，优秀要 8 个以上
function chunkedExample(w, diffKey, exclude){
  const d = DIFF[diffKey] || DIFF.mid;
  const lo = d.chunk[0], hi = d.chunk[1];
  const skip = exclude || new Set();
  const pool = taskExamplePool(w);
  // 逐级放宽扫描，优先级从高到低：
  // ① 有中文译文 + 意群数落在本档区间（理想解）
  // ② 有中文译文（真题句多数没有译文，双语句常常只有一两块）
  // ③ 无译文但意群数在区间内（优秀档靠这类长真题句才凑得出 ≥8 块）
  // ④ 兜底：任何能拼成两句以上的句子
  // 若一锅端打分，长真题句会靠长度优势挤掉双语句，学生看到「（暂无译文）」只能瞎猜。
  const scan = (needCn, needRange, longest) => {
    let best = null, bestScore = 1e9;
    for(const p of pool){
      if(needCn && !p.cn) continue;
      const plain = p.en.replace(/<[^>]+>/g, '');
      const key = plain.toLowerCase().replace(/\s+/g, ' ').trim();
      if(skip.has(key)) continue;
      let ch = chunkSentence(plain);
      // 自然意群不够下限时先按语法边界拆到下限，再判断是否落在本档区间，
      // 否则「长句但只有 4 块」的句子会被直接筛掉，中等档只能退回到 3 块的短句。
      if(ch.length >= 2 && ch.length < lo && lo <= 8){
        const forced = forceChunks(ch, lo);
        if(forced.length > ch.length) ch = forced;
      }
      const n = ch.length;
      if(n < 2) continue;                                // 只有一块就拼不出句子
      if(needRange && (n < lo || n > hi)) continue;
      let s = 0;
      if(n < lo) s += (lo - n) * 5;
      if(n > hi) s += (n - hi) * 5;
      if(!p.cn) s += 4;                                 // 连词成句需要中文参考
      s += Math.abs(n - (lo + Math.min(hi, 12)) / 2) * 0.4;
      s += p.idx * 0.02;
      // 常考句型加权：中高考高频句式（It is…to / not only…but also / 定语从句…）优先出题
      try{ if(!longest && typeof PATTERNS !== 'undefined' && PATTERNS.some(q => q.re.test(plain))) s -= 3; }catch(e){}
      if(longest) s = -plain.split(/\s+/).length * 10 + p.idx * 0.02;   // 兜底：宁可要最长的句子（词数越多越拆得出 8 块）
      if(s < bestScore){ bestScore = s; best = { en:p.en, cn:p.cn, src:p.src, chunks:ch, n }; }
    }
    return best;
  };
  // 优秀档优先保证「≥8 个意群」的难度，宁可放弃译文；基础档优先保证有译文；
  // 中等档次优先「意群数落在 5–8」——语料里带译文的多是 1–3 块的短句，硬留译文等于降难度。
  const order = d.key === 'hard'
    ? [[true, true], [false, true], [false, false, true], [true, false]]
    : (d.key === 'mid'
      ? [[true, true], [false, true], [true, false], [false, false]]
      : [[true, true], [true, false], [false, true], [false, false]]);
  let best = null;
  for(const [cn, rg, lg] of order){ best = scan(cn, rg, lg); if(best) break; }
  // 意群不足下限时，按连接词/介词再拆一层（优秀档固定拆到 8 块），保证难度分层真实存在；
  // 拆不动（句子本身太短）就保持原样，不硬造短语。
  const target = d.key === 'hard' ? 8 : lo;
  if(best && best.chunks.length < target){
    const forced = forceChunks(best.chunks, target);
    if(forced.length > best.chunks.length){ best.chunks = forced; best.n = forced.length; }
  }
  return best;
}

/* ---- 翻译判定：关键词覆盖率，而不是"只含目标词" ---- */
const STOP_EN = new Set(('a an the is are was were be been being am do does did have has had will would can could shall should may might must to of in on at for with from by as and or but if that this these those it its i you he she we they me him her us them my your his our their not no so than then there here what which who when where why how').split(' '));
function transStem(t){
  let s = String(t || '').toLowerCase();
  if(s.length > 5) s = s.replace(/(ations|ation|ings|ing|ies|ied|ed|es|ly|ment|ness)$/, '');
  if(s.length > 4 && s.endsWith('e')) s = s.slice(0, -1);
  if(s.length > 4 && s.endsWith('i')) s = s.slice(0, -1) + 'y';
  return s;
}
function transScore(input, ref, target){
  const norm = s => String(s || '').toLowerCase().replace(/[’]/g, "'")
    .replace(/[^a-z0-9' ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const a = norm(input), b = norm(ref);
  const inToks = a.split(' ').filter(Boolean);
  const inStems = new Set(inToks.map(transStem));
  const key = [...new Set(b.split(' ').filter(t => t && !STOP_EN.has(t) && t.length > 1))];
  const hit = [], miss = [];
  for(const t of key){ (inStems.has(transStem(t)) ? hit : miss).push(t); }
  const recall = key.length ? hit.length / key.length : 0;
  const hasTarget = inStems.has(transStem(norm(target)));
  return { recall, hit, miss, hasTarget, keyN:key.length };
}

/* ---- 句型识别（翻译题"中等"档给句式提示） ---- */
const PATTERNS = [
  { re:/^it\s+is\s+\w+\s+(for|of)\s+\w+\s+to\s+/i, label:'It is + adj. + for/of sb. + to do' },
  { re:/^it\s+takes?\s+/i, label:'It takes sb. + 时间/精力 + to do' },
  { re:/^there\s+(is|are|was|were)\b/i, label:'There be 句型' },
  { re:/\bnot only\b[\s\S]+\bbut also\b/i, label:'not only … but also …' },
  { re:/\b(so|such)\b[\s\S]+\bthat\b/i, label:'so / such … that …' },
  { re:/\btoo\b[\s\S]+\bto\b/i, label:'too … to …' },
  // 只保留无歧义的使役结构：have/get 在疑问句里多是助动词，容易误判
  { re:/\b(made|make|makes|making|let|lets|letting)\s+\w+\s+\w+/i, label:'make / let + 宾语 + 动词原形' },
  { re:/\b(get|got|gets|getting)\s+\w+\s+to\s+\w+/i, label:'get sb. to do sth.' },
  { re:/\b(is|are|was|were|be|been|being)\s+\w+(ed|en)\b/i, label:'被动语态 be + 过去分词' },
  { re:/\b(who|which|whose)\b/i, label:'含定语从句' },
  { re:/\b(if|unless)\b/i, label:'if / unless 条件句' },
  { re:/\b(because|since|although|though|while)\b/i, label:'原因/让步状语从句' },
  { re:/\b(wish|hope|wonder)\b/i, label:'wish / hope / wonder + 从句' }
];
function detectPattern(s){
  const t = String(s || '').replace(/<[^>]+>/g, '');
  for(const p of PATTERNS) if(p.re.test(t)) return p.label;
  return '主谓宾 / 主系表基本句型';
}
// 把参考译文中的实词挖空，得到可模仿的句式骨架
function skeletonOf(s){
  const toks = String(s || '').replace(/<[^>]+>/g, '').match(/[A-Za-z0-9'’\-]+[,.;:!?]?/g) || [];
  return toks.map(tk => {
    const low = tk.toLowerCase().replace(/[,.;:!?]$/, '');
    const punct = (tk.match(/[,.;:!?]$/) || [''])[0];
    if(STOP_EN.has(low) || low.length <= 2) return tk;
    return '____' + punct;
  }).join(' ');
}

/* ================= 题型1：语义词联（开心消消乐玩法） ================= */
let matchState = { selected:null, cleared:0, total:0, cells:[], misses:0, best:0 };
// 限时：每对约 4~6.5 秒（随难度收紧），再加 12 秒找牌缓冲
function matchTimeLimit(n){
  const k = curDiff().key;
  const per = k === 'hard' ? 4.0 : (k === 'mid' ? 5.0 : 6.5);
  return Math.round(n * per) + 12;
}
// 释义极简：只留 2~3 个最高频核心义项 + 对应词性；短语/无词性不硬加词性
function bombCn(cn){
  const cc = coreCn(cn, 3);
  let n = cc.senses.length;
  // 义项太长就砍到 2 条，避免卡片被文字撑成断行、认读变慢
  while(n > 2 && cc.senses.slice(0, n).join('；').length > 12) n--;
  return { pos: cc.pos, body: cc.senses.slice(0, Math.max(1, n)).join('；') };
}
function renderMatch(){
  const list = words();
  stopCountdown(); stopBgm();
  const cells = [];
  list.forEach((x,i)=>{
    cells.push({ type:'en', text:x.word, pair:i });
    // 只显示最常用的 2~3 个义项 + 词性，拒绝把整条释义堆在卡片上
    const cc = bombCn(x.cn);
    cells.push({ type:'cn', text:cc.body, pair:i, pos:cc.pos, body:cc.body });
  });
  const limit = matchTimeLimit(list.length);
  matchState = { selected:null, cleared:0, total:list.length, cells:shuffle(cells), misses:0, best:0, limit, t0:Date.now(), pausedAt:0 };
  $("#matchPage").classList.remove("hidden");
  $("#matchPage").innerHTML = `
    <h2 class="page-title">🍬 语义词联 · 消消乐</h2>
    <p class="page-sub">点英文卡即发音，找出对应释义，配对消除</p>
    ${diffBar()}
    <div class="bomb-top">
      <span class="bomb-clock" id="bombClock">${limit}s</span>
      <span class="bomb-combo off" id="bombCombo"></span>
      <button class="bomb-tool${bgm.enabled()?' on':''}" id="bombBgm" onclick="toggleMatchBgm()">🎵 背景音</button>
    </div>
    <div class="bomb-hud">
      <span>已消除 <b id="bombCleared">0</b> / ${matchState.total}</span>
      <span>失误 <b id="bombMiss">0</b></span>
    </div>
    <div class="bomb-grid${matchState.cells.length > 24 ? ' dense' : ''}" id="bombGrid">
      ${matchState.cells.map((c,i)=>`<div class="bomb-cell ${c.type}" id="bomb-${i}" onclick="bombClick(${i})">${
        c.type === 'cn'
          ? (c.pos ? `<span class="cn-pos">${escapeHtml(c.pos)}</span>` : '') + escapeHtml(c.body || c.text)
          : escapeHtml(c.text)
      }</div>`).join("")}
    </div>
    <div class="fb-box" id="fbBox"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-skip" onclick="goStep(2)">跳过本题型 →</button></div>
  `;
  clearFb();
  bgm.muted = !bgm.enabled();
  if(bgm.enabled()) bgm.start();
  startCountdown(limit, (left)=>{
    const el = $("#bombClock");
    if(el){ el.textContent = Math.ceil(left) + 's'; el.classList.toggle('urgent', left <= 15); }
    bgm.setUrgent(left <= 15);
  }, ()=>{ matchFinish('timeout'); });
}
function toggleMatchBgm(){
  const on = bgm.toggle();
  const btn = $("#bombBgm");
  if(btn) btn.classList.toggle('on', on);
  toast(on ? '🎵 背景音已开启' : '🔇 背景音已关闭');
  if(on && matchState.t0 && matchState.limit){
    bgm.setUrgent((matchState.limit * 1000 - (Date.now() - matchState.t0)) / 1000 <= 15);
  }
}
function matchFinish(reason){
  stopCountdown(); stopBgm();
  const st = matchState;
  const used = Math.max(1, Math.round((Date.now() - st.t0) / 1000));
  const rate = st.total ? Math.round(st.cleared / st.total * 100) : 0;
  const clear = reason === 'clear';
  let score = st.cleared * 12 + st.best * 8;
  if(clear) score += Math.max(0, st.limit - used) * 2;
  $("#matchPage").innerHTML = `
    <h2 class="page-title">🍬 语义词联 · 消消乐</h2>
    ${diffBar()}
    <div class="bomb-done">
      <div class="bd-emoji">${clear ? '🎉' : '⏰'}</div>
      <div class="bd-title">${clear ? '全部消除，过关！' : '时间到，还差一点'}</div>
      <div class="bd-grid">
        <div class="bd-item"><b>${st.cleared}/${st.total}</b><span>已消除</span></div>
        <div class="bd-item"><b>${rate}%</b><span>完成度</span></div>

// 释义相似度：词性相同 + 汉字重合 → 越像。优秀档挑"像的"当干扰项，基础档挑"不像的"
function optAffinity(a, b){
  let s = 0;
  if(a.pos && b.pos && a.pos === b.pos) s += 2;
  const set = new Set(a.senses.join('').split(''));
  for(const ch of b.senses.join('')) if(set.has(ch)) s += 1;
  return s;
}
// 生成释义选项：同批 → 本级 → 全库逐级兜底，选项数量随难度变化
function choiceOptions(w, n){
  const d = curDiff();
  n = n || d.optN;
  const ansCc = coreCn(w.cn, 2);
  const ans = ansCc.text;
  const out = [{ text: ans, word: w.word }];
  const usedText = new Set([ans]);
  const usedWord = new Set([String(w.word).toLowerCase()]);
  const pool = [];
  const seen = new Set();
  const addPool = (arr, cap) => {
    for(const x of arr){
      if(pool.length >= cap) return;
      if(!x || !x.word || !x.cn) continue;
      const k = String(x.word).toLowerCase();
      if(seen.has(k) || usedWord.has(k)) continue;
      seen.add(k);
      pool.push({ word:x.word, cn:x.cn, cc:coreCn(x.cn, 2) });
    }
  };
  addPool(words(), 24);
  addPool(GROUPS[currentGroup].words, 48);
  if(pool.length < n * 3){
    // 只在当前学段内补干扰项：跨级抽词会让初一学生看到四六级释义，属于超纲
    const lv = currentLevelName();
    addPool((WORD_DB[lv] || []).map(([word, cn]) => ({ word, cn })), n * 6);
  }
  const scored = pool.map(p => ({ ...p, aff: optAffinity(ansCc, p.cc) }));
  scored.sort((a, b) => b.aff - a.aff);
  // 优秀档：从最像的一端取；基础/中等：从最不像的一端取，避免近义混淆
  const list = d.near ? scored : scored.slice().reverse();
  for(const p of list){
    if(out.length >= n) break;
    if(!p.cc.text || usedText.has(p.cc.text)) continue;
    usedText.add(p.cc.text);
    out.push({ text:p.cc.text, word:p.word });
  }
  return shuffle(out);
}

// 高频易混形近/义近词表（中高考常考辨析）
const CONFUSABLE = {

  family:["familiar","famous"], father:["farther","feature"], mother:["other","month"], sister:["resister","sisterly"], friend:["fiend","fried"],
  accept:["except","expect"], affect:["effect","effort"], alone:["lonely","along"], alive:["living","live"], rise:["raise","arise"],
  borrow:["lend","blow"], bring:["take","ring"], beside:["besides","behind"], farther:["further","father"], especially:["specially","special"],
  travel:["trip","journey"], voice:["sound","noise"], custom:["habit","customer"], clothes:["cloth","clothing"], expect:["except","inspect"],
  invent:["discover","invite"], lose:["loose","lost"], quiet:["quite","quit"], worth:["worthy","while"], receive:["accept","believe"],
  adapt:["adopt","adept"], advice:["advise","advice"], principle:["principal","prince"], weather:["whether","wither"],
  desert:["dessert","deserve"], access:["excess","assess"], breath:["breathe","breadth"], quite:["quiet","quit"], through:["though","thorough"],
  success:["succeed","success"], health:["healthy","wealth"], nature:["natural","mature"], difficult:["different","difficulty"], important:["import","importance"],
  careful:["careless","care"], careless:["careful","careless"], culture:["cultural","agriculture"], environment:["environmental","government"],
  continue:["contain","continent"], compare:["compete","complete"], protect:["project","predict"], produce:["product","reduce"], include:["conclude","exclude"],
  attract:["attack","contract"], celebrate:["celery","celebrity"], communicate:["community","comment"], consider:["consist","constant"], decide:["divide","declare"]
};
// 生成选词填空选项：正确词 + 易混词 + 同源词 + 已学旧词 + 同学段随机兜底
// 全部选项限定在当前学段词表内 —— 七年级词库不会冒出四六级词，做到零超纲。
function buildFillOptions(w, n){
  const d = curDiff();
  n = n || d.optN;
  const level = currentLevelName();
  const allowed = vocabFor(level);
  const inLevel = x => allowed.has(String(x || '').toLowerCase());
  const correct = w.word;
  const used = new Set([correct.toLowerCase()]);
  const opts = [correct];
  // 1. 易混形近/义近词（基础档不用，否则一上来就太难）
  if(d.key !== 'basic'){
    (CONFUSABLE[w.word] || [])
      .filter(x => !used.has(x.toLowerCase()) && inLevel(x))
      .slice(0, n - 2)
      .forEach(x => { opts.push(x); used.add(x.toLowerCase()); });
  }
  // 2. 同源词（词根词缀相关）
  if(w._affixKey && opts.length < n){
    const same = (AFFIX_INDEX[w._affixKey] || [])
      .filter(x => x.word !== w.word && !used.has(x.word.toLowerCase()) && inLevel(x.word));
    if(same.length){ opts.push(same[0].word); used.add(same[0].word.toLowerCase()); }
  }
  // 3. 过往复习的旧词（艾宾浩斯已学过的词，同样限本学段）
  const studied = Object.keys(loadStudylog())
    .filter(x => x.toLowerCase() !== correct.toLowerCase() && !used.has(x.toLowerCase()) && inLevel(x));
  for(const s of shuffle(studied)){ if(opts.length >= n) break; opts.push(s); used.add(s.toLowerCase()); }
  // 4. 本学段随机兜底（保证选项数量始终够）
  if(opts.length < n){
    const all = (WORD_DB[level] || []).map(([word]) => word).filter(x => !used.has(x.toLowerCase()));
    shuffle(all).slice(0, n - opts.length).forEach(x => opts.push(x));
  }
  return shuffle(opts.slice(0, n));
}

// 把句中的目标词整词挖空：优先用 <B></B> 标记定位，可连带挖掉变形（abandoned → ______）
function blankTarget(en, word){
  const w = String(word || '').toLowerCase();
  const key = w.slice(0, Math.min(4, w.length));
  const re = /<B>(.*?)<\/B>/gi;
  let m;
  while ((m = re.exec(en))) {
    const t = m[1].toLowerCase();
    if (t.startsWith(w) || (key && t.startsWith(key))) {
      return en.slice(0, m.index) + '<b>______</b>' + en.slice(m.index + m[0].length);
    }
  }
  // 没有 <B> 标记：按词形前缀找第一个匹配的整词挖掉
  const tokRe = /\b[A-Za-z][A-Za-z'’-]*\b/g;
  let t;
  while ((t = tokRe.exec(en))) {
    if (key && t[0].toLowerCase().startsWith(key)) {
      return en.slice(0, t.index) + '<b>______</b>' + en.slice(t.index + t[0].length);
    }
  }
  return en;
}
// 判断句子里是否出现了目标词（含变形），用于挑"能挖空"的句子
function containsWordForm(text, word){
  const w = String(word || '').toLowerCase();
  const key = w.slice(0, Math.min(4, w.length));
  if (!key) return false;
  const toks = String(text || '').toLowerCase().match(/[a-z][a-z'’-]*/g) || [];
  return toks.some(t => t.startsWith(key));
}
// 词汇认知页真正展开过的句子（默认 2 条），填空要避开它们
function learnExampleKeys(w){
  const set = new Set();
  try{
    for(const e of (pickLearnExamples(w, 2) || [])){
      set.add(String(e.en).replace(/<[^>]+>/g, '').toLowerCase().replace(/\s+/g, ' ').trim());
    }
  }catch(e){}
  return set;
}
// 超纲词计数：判断一条例句对当前学段是不是太难
function oovOf(en, level){
  const plain = String(en || '').replace(/<[^>]+>/g, '');
  const toks = plain.toLowerCase().match(/[a-z][a-z'’-]*/g) || [];
  const vocab = vocabFor(level);
  let n = 0;
  for(const t of toks) if(!vocab.has(t)) n++;
  return n;
}
// 挑一条"没学过"的句子：长度贴合难度，超纲词越少越好
function fillExample(w, d){
  const skip = learnExampleKeys(w);
  // 同一批词里，连词成句已经用过的那句就不要再拿来填空，避免两个题型重复
  try{
    const ord = chunkedExample(w, d.key);
    if(ord) skip.add(String(ord.en).replace(/<[^>]+>/g, '').toLowerCase().replace(/\s+/g, ' ').trim());
  }catch(e){}
  const level = currentLevelName();
  const wantLen = d.key === 'hard' ? 20 : (d.key === 'mid' ? 16 : 12);
  const rank = (blocked) => {
    let best = null, bestScore = 1e9;
    for(const p of taskExamplePool(w)){
      const plain = p.en.replace(/<[^>]+>/g, '');
      const key = plain.toLowerCase().replace(/\s+/g, ' ').trim();
      if(blocked.has(key)) continue;
      if(!containsWordForm(plain, w.word)) continue;  // 句子里得有目标词才能挖空
      // 超纲词重罚：宁可句子短一点，也不要出现读不懂的难词；真题句给额外优先
      const examBonus = isExamType(p.srcType) ? -6 : 0;
      const oov = oovOf(p.en, level);
      const s = scoreExample(p.en, level, 'x') + oov * 4 + (oov === 0 ? -3.5 : 0) + Math.abs(p.len - wantLen) * 2.0 + examBonus;
      if(s < bestScore){ bestScore = s; best = p; }
    }
    return best;
  };
  let best = rank(skip);
  // 严格条件下挑不到合适的（太短/太长），放宽到"只避开学习页首句"，保证句子难度更贴档位
  if(!best || Math.abs((best.len || 0) - wantLen) > 9){
    const relax = new Set();
    try{
      const first = (pickLearnExamples(w, 1) || [])[0];
      if(first) relax.add(String(first.en).replace(/<[^>]+>/g, '').toLowerCase().replace(/\s+/g, ' ').trim());
    }catch(e){}
    const alt = rank(relax);
    if(alt && (!best || Math.abs(alt.len - wantLen) < Math.abs(best.len - wantLen))) best = alt;
  }
  return best || taskExample(w, 'cloze');
}

    addWrong(w.word, w.cn);
    opts.forEach(o=>{ if(o.textContent.trim() === fillState.answer) o.classList.add("right"); });
    showFb({ ok:false, head:'选错了', rows:fillExplainRows(w, picked), onNext:()=>fillNext() });
  }
}

/* ================= 题型4：单词拼写（修复bug） ================= */
let spellState = { idx:0, slots:[], letters:[], used:new Set(), letterIndex:[] };
function renderSpell(){
  spellState = { idx:0 };
  renderSpellWord();
}
function renderSpellWord(){
  const w = words()[spellState.idx];
  if(!w){ goStep(5); return; }
  applyBank(w);
  const chars = w.word.split("");
  const isLetter = ch => /[A-Za-z]/.test(ch);
  // 空格 / 连字符 / 撇号固定给出，不再当作可拖动字母，短语也能正常拼
  spellState.chars = chars;
  spellState.fixed = chars.map(ch => isLetter(ch) ? null : ch);
  spellState.slots = chars.map(ch => isLetter(ch) ? "" : ch);
  spellState.letterIndex = chars.map(() => null);
  spellState.letters = shuffle(chars.filter(isLetter));
  $("#spellPage").classList.remove("hidden");
  $("#spellPage").innerHTML = `
    <h2 class="page-title">🔤 拼写重构</h2>
    <p class="page-sub">乱序字母归位，重现原词（点击已填字母可修改）</p>
    <div style="text-align:center">
      <div class="spell-cn">释义：${escapeHtml(coreCn(w.cn, 3).text)}</div>
      <button class="btn btn-ghost" style="padding:8px 20px;font-size:14px;margin-bottom:14px" onclick="playSpellWord()">🔊 听发音</button>
      <div class="answer-slots">${chars.map((ch,i)=> spellState.fixed[i] !== null
        ? `<div class="slot fixed" id="slot-${i}" title="空格/符号（已给出）">${spellState.fixed[i] === ' ' ? '␣' : escapeHtml(spellState.fixed[i])}</div>`
        : `<div class="slot" id="slot-${i}" onclick="removeLetter(${i})"></div>`).join("")}</div>
      <div class="letters">${spellState.letters.map((ch,i)=>`<div class="letter-tile" id="lt-${i}" onclick="addLetter(${i})">${ch}</div>`).join("")}</div>
      <button class="btn btn-primary" onclick="checkSpell()">提交答案</button>
      <button class="btn btn-ghost" onclick="clearSpell()">清空重来</button>
    </div>
    <div class="fb-box" id="fbBox"></div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(5)">跳过本题型 →</button></div>
  `;
  clearFb();
}
function spellNext(){
  clearFb();
  if(spellState.idx < words().length - 1){ spellState.idx++; renderSpellWord(); }
  else { goStep(5); }
}
function addLetter(i){
  const w = words()[spellState.idx];
  if(!w || !spellState.slots) return;
  if(spellState.letterIndex.includes(i)) return;      // 同一字母块不能重复使用
  const slot = spellState.slots.findIndex((ch, idx) => spellState.fixed[idx] === null && !ch);
  if(slot < 0) return;
  spellState.slots[slot] = spellState.letters[i];
  spellState.letterIndex[slot] = i;
  const tile = $("#lt-"+i); if(tile) tile.classList.add("used");
  renderSlots();
}
function clearSpell(){
  if(!spellState.slots || !spellState.fixed) return;
  spellState.letterIndex.forEach(li=>{
    if(li === null || li === undefined) return;
    const tile = $("#lt-"+li); if(tile) tile.classList.remove("used");
  });
  spellState.slots = spellState.slots.map((ch,i)=> spellState.fixed[i] !== null ? ch : "");
  spellState.letterIndex = spellState.letterIndex.map(()=>null);
  renderSlots();
}
function removeLetter(slotIdx){
  if(!spellState.slots || !spellState.fixed) return;
  if(spellState.fixed[slotIdx] !== null) return;      // 固定符号不可删除
  const li = spellState.letterIndex[slotIdx];
  if(li === null || li === undefined) return;
  spellState.slots[slotIdx] = "";
  spellState.letterIndex[slotIdx] = null;
  const tile = $("#lt-"+li); if(tile) tile.classList.remove("used");
  renderSlots();
}
function renderSlots(){
  const w = words()[spellState.idx];
  if(!w || !spellState.slots || !spellState.fixed) return;
  for(let i=0;i<spellState.slots.length;i++){
    const s = $("#slot-"+i);
    if(!s) continue;
    const fixed = spellState.fixed[i] !== null;
    const ch = spellState.slots[i] || "";
    if(!fixed) s.textContent = ch;
    s.classList.toggle("filled", !!ch);
    s.classList.remove("right","wrong");
  }
}
function checkSpell(){
  const w = words()[spellState.idx];
  if(!w || !spellState.slots) return;
  const missing = spellState.slots.some((ch,i)=> spellState.fixed[i] === null && !ch);
  if(missing){ toast("还没拼完哦"); return; }
  const ans = spellState.slots.join("");
  const slots = document.querySelectorAll("#spellPage .slot");
  if(ans === w.word){
    slots.forEach(s=>s.classList.add("right"));
    const r = recordAnswer('spell', true, 3);
    toast("✅ 拼写正确！ +" + r.gain + (r.mult>1 ? "（连对×"+r.mult+"）" : ""));
    setTimeout(()=>spellNext(), 800);
  } else {
    recordAnswer('spell', false, 3);
    slots.forEach((s,i)=>s.classList.add(w.word[i]===ans[i]?"right":"wrong"));
    addWrong(w.word, w.cn);
    // 答错立刻给出正确答案 + 解析，而不是让学生反复盲猜
    showFb({
      ok:false, head:'拼写错了',
      rows:[
        ['正确答案', `<b>${escapeHtml(w.word)}</b>`],
        ...explainRows(w, '')
      ],
      btn:'我记住了，下一题 →',
      tip:'对照上面的音节与音标再读一遍',
      onNext:()=>spellNext()
    });
    setTimeout(()=>{
      slots.forEach((s,i)=>{ s.classList.remove("right","wrong"); if(spellState.fixed[i] === null) s.textContent = w.word[i] || ''; s.classList.add("right"); });
    }, 900);
  }
}

/* ================= 题型7：语篇短文 ================= */
/* ================= 篇章研读：按本批词汇生成完整短文 ================= */
let passageState = null;
function simpleHash(str){
  let h = 5381;
  for(let i=0;i<str.length;i++) h = ((h<<5) + h + str.charCodeAt(i)) | 0;
  return Math.abs(h).toString(36);
}
function passageKey(){
  const ws = words().map(x=>x.word.toLowerCase()).sort().join(',');
  return 'lx_passage_' + simpleHash(ws + '#' + currentGroup);
}
// 屈折变化（与服务端 lib/passage-core.js 保持一致）
function wordVariantsClient(word){
  const w = String(word);
  const set = new Set([w, w+'s', w+'es', w+'ed', w+'ing', w+'er', w+'est', w+'ly', w+'d']);
  if(/e$/i.test(w)){ const b=w.slice(0,-1); ['ing','ed','es','er','est'].forEach(x=>set.add(b+x)); }
  if(/y$/i.test(w)){ const b=w.slice(0,-1); ['ies','ied','ier','iest'].forEach(x=>set.add(b+x)); }
  if(/[^aeiou][aeiou][bdgklmnprt]$/i.test(w)){ const b=w+w.slice(-1); ['ed','ing','er','est'].forEach(x=>set.add(b+x)); }
  return [...set].sort((a,b)=>b.length-a.length);
}
function escapeRe(str){ return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
// 目标词高亮（含变形）
function highlightPassage(text, list){
  const set = new Set();
  for(const w of list) for(const v of wordVariantsClient(w)) set.add(v);
  const uniq = [...set].sort((a,b)=>b.length-a.length);
  const safe = escapeHtml(text);
  if(!uniq.length) return safe;
  const re = new RegExp('\\b(' + uniq.map(escapeRe).join('|') + ')\\b', 'gi');
  return safe.replace(re, m => `<span class="hl">${m}</span>`);
}
function renderPassage(){
  $("#passagePage").classList.remove("hidden");
  const key = passageKey();
  const cached = loadStore(key, null);
  if(cached && cached.text && !cached.loading){
    passageState = Object.assign({}, cached, { loading:false, error:'' });
    paintPassage();
    return;
  }
  passageState = { loading:true, error:'' };
  paintPassage();
  requestPassage();
}
async function requestPassage(){
  const list = words().map(x=>({ w: x.word, cn: x.cn }));
  const reqKey = passageKey();          // 记录发起时的批次，避免把 A 批的短文存到 B 批
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 32000);
  try{
    const resp = await fetch('/api/passage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ words: list, level: LEVELS[currentGroup] || '初中' }),
      signal: ctrl.signal
    });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok || !data.text) throw new Error(data.error || ('HTTP ' + resp.status));
    saveStore(reqKey, Object.assign({ at: Date.now() }, data));
    prunePassageCache();
    if(reqKey !== passageKey()) return;   // 已切换到别的批次，不要覆盖当前页面
    passageState = Object.assign({ loading:false, error:'' }, data);
    paintPassage();
  }catch(e){
    const msg = (e && e.name === 'AbortError') ? '生成超时，请重试' : ((e && e.message) ? e.message : '生成失败');
    passageState = { loading:false, error: msg };
    paintPassage();
  }finally{
    clearTimeout(timer);
  }
}
// 缓存最多保留 12 篇，避免占用存储
function prunePassageCache(){
  const keys = [];
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('lx_passage_')===0) keys.push(k);
  }
  if(keys.length <= 12) return;
  keys.map(k=>{
    const v = loadStore(k, {});
    return { k, at: (v && v.at) || 0 };
  }).sort((a,b)=>a.at-b.at).slice(0, keys.length-12).forEach(x=>{
    try{ localStorage.removeItem(x.k); }catch(e){}
  });
}
function paintPassage(){
  const page = $("#passagePage");
  if(!page) return;
  const st = passageState || {};
  const head = `<h2 class="page-title">📜 篇章研读</h2>`;

  if(st.loading){
    page.innerHTML = `${head}
      <p class="page-sub">正在围绕本批 ${words().length} 个词汇撰写短文…</p>
      <div class="passage passage-skeleton">
        ${'<div class="sk-line"></div>'.repeat(3)}
        ${'<div class="sk-line short"></div>'.repeat(2)}
        ${'<div class="sk-line"></div>'.repeat(3)}
        ${'<div class="sk-line short"></div>'.repeat(2)}
      </div>
      <div class="ps-tip">生成一篇 200–350 词的完整短文通常需要 10–20 秒，请稍候</div>`;
    return;
  }

  if(st.error || !st.text){
    // 生成失败：退回例句通读，保证流程不断
    const seen = new Set();
    const kf = s => s.replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim().toLowerCase();
    const stitched = words().map(x=>{
      let ex = taskExample(x, 'passage');
      if(seen.has(kf(ex.en))){
        const alt = (x.examples||[]).concat(x.extras||[]).find(e=>!seen.has(kf(e.en)));
        if(alt) ex = alt;
      }
      seen.add(kf(ex.en));
      const plain = ex.en.replace(/<[^>]+>/g,'');
      const hl = plain.replace(new RegExp(escapeRe(x.word),'i'), m=>`<span class="hl">${m}</span>`);
      return `<p style="margin-bottom:12px">${hl}</p>`;
    }).join("");
    page.innerHTML = `${head}
      <p class="page-sub">短文生成失败${st.error ? '（' + escapeHtml(st.error) + '）' : ''}，暂以例句通读复习</p>
      <div class="passage">${stitched}</div>
      <div class="ps-tip">可以稍后点击「重新生成」再试一次</div>
      <div class="passage-actions">
        <button class="btn btn-ghost" onclick="regeneratePassage()">🔁 重新生成</button>
        <button class="btn btn-ghost" onclick="speakPassage()">🔊 朗读短文</button>
        ${speedSwitchHtml('lg')}
        <button class="btn btn-primary" onclick="goStep(8)">完成，查看结果 →</button>
      </div>`;
    return;
  }

  const used = st.used || [], missed = st.missed || [];
  const all = words().map(x=>x.word);
  const pct = Math.round((st.coverage || 0) * 100);
  const paras = String(st.text).split(/\n+/).filter(s=>s.trim()).map(p=>`<p style="margin-bottom:14px">${highlightPassage(p, all)}</p>`).join("");
  const chips = all.map(w=>{
    const ok = used.some(u=>u.toLowerCase()===w.toLowerCase());
    return `<span class="ps-chip ${ok?'ok':'miss'}" title="${ok?'已嵌入本篇':'本篇未用到'}">${w}</span>`;
  }).join("");

  page.innerHTML = `${head}
    <p class="page-sub">AI 围绕本批 ${all.length} 个词汇撰写 · 目标词已标黄</p>
    <div class="ps-head">
      <div class="ps-title">${escapeHtml(st.title || 'Untitled')}</div>
      <div class="ps-meta">${st.wordCount || 0} 词 · 词汇覆盖 <b>${pct}%</b>（${used.length}/${all.length}）</div>
    </div>
    <div class="passage" id="psBody">${paras}</div>
    <div class="passage-cn hidden" id="psCn">${st.translation ? escapeHtml(st.translation).replace(/\n+/g,'<br>') : ''}</div>
    <div class="ps-chips">${chips}</div>
    <div class="ps-tip">黄色为目标词汇；点击「中英对照」可查看全文翻译</div>
    <div class="passage-actions">
      <button class="btn btn-ghost" onclick="togglePassageCn(this)">中英对照</button>
      <button class="btn btn-ghost" onclick="speakPassage()">🔊 朗读短文</button>
      ${speedSwitchHtml('lg')}
      <button class="btn btn-ghost" onclick="regeneratePassage()">🔁 换一篇</button>
      <button class="btn btn-primary" onclick="goStep(8)">完成，查看结果 →</button>
    </div>`;
}
async function togglePassageCn(btn){
  const el = $("#psCn");
  if(!el) return;
  // 已显示 → 收起
  if(!el.classList.contains("hidden")){
    el.classList.add("hidden");
    btn.textContent = "中英对照";
    return;
  }
  const st = passageState || {};
  if(st.translation){
    el.innerHTML = escapeHtml(st.translation).replace(/\n+/g, '<br>');
    el.classList.remove("hidden");
    btn.textContent = "隐藏译文";
    return;
  }
  // 首次查看：单独请求翻译（避免和生成挤在一次调用里超时）
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = "译文生成中…";
  try{
    const resp = await fetch('/api/passage', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: st.text })
    });
    const data = await resp.json().catch(()=>({}));
    if(!resp.ok || !data.translation) throw new Error(data.error || '翻译失败');
    passageState.translation = data.translation;
    el.innerHTML = escapeHtml(data.translation).replace(/\n+/g, '<br>');
    el.classList.remove("hidden");
    btn.textContent = "隐藏译文";
    saveStore(passageKey(), Object.assign({ at: Date.now() }, passageState));
  }catch(e){
    toast("译文生成失败：" + ((e && e.message) ? e.message : '请稍后重试'));
    btn.textContent = old;
  }finally{
    btn.disabled = false;
  }
}
function regeneratePassage(){
  try{ localStorage.removeItem(passageKey()); }catch(e){}
  passageState = { loading:true, error:'' };
  paintPassage();
  requestPassage();
}
function speakPassage(){
  const st = passageState;
  if(st && st.text){ speakLongText(st.text); return; }
  const plain = words().map(x=>taskExample(x, 'passage').en.replace(/<[^>]+>/g,"")).join(". ");
  speakLongText(plain);
}

/* ================= ⚔️ 单词对战（PK） ================= */
const PK_CONF = { QN: 10, TIME: 10 };
const PK_AI = {
  easy:   { name:'轻松', icon:'🙂', p:0.60, min:2800, max:5200 },
  normal: { name:'标准', icon:'😎', p:0.78, min:2000, max:4000 },
  hard:   { name:'高手', icon:'😈', p:0.90, min:1400, max:2800 }
};
let pk = null;
let pkTick = null;

/* ---- 水平匹配：按本人近期正确率折算一个"相近、略高一点"的对手 ---- */
function pkMyAcc(){
  const s = loadStats();
  const n = s.ans || 0;
  if(n < 8) return 60;                                   // 样本太少，按中等偏下起步
  const base = Math.round(s.right / n * 100);
  return base;
}
function pkAutoCfg(){
  const mine = pkMyAcc();
  const target = Math.min(94, Math.max(50, mine + 7));   // 只高一点点：够得着又有压力
  const p = target / 100;
  const fast = 4300 - p * 3200;                           // 正确率越高，反应越快
  return {
    key:'auto', name:'匹配对手', icon:'🎯', p,
    min: Math.round(fast * 0.72), max: Math.round(fast * 1.35),
    mine, target
  };
}
function pkCfg(level){
  if(!level || level === 'auto') return pkAutoCfg();
  return PK_AI[level] || PK_AI.normal;
}

function pkBank(){
  // 出题来源：当前词库（自定义词库优先，否则当前分组）
  const list = words().filter(w => w && w.word && w.cn);
  return list.length >= 4 ? list : GROUPS[currentGroup].words;
}
function pkCleanCn(cn){
  return String(cn || '').split(/[；;]/)[0].replace(/^(n|v|vt|vi|adj|adv|prep|conj|pron|num|art|int|aux|modal|abbr)\.\s*/i, '').trim();
}
// 对战干扰项候选：自定义词库很小时补入本级词库，避免出现"只有一个选项"
function pkPool(){
  const base = pkBank().filter(w => w && w.word && w.cn);
  if(base.length >= 8) return base;
  const extra = GROUPS[currentGroup].words.filter(w => w && w.word && w.cn);
  const seen = new Set(base.map(w => w.word.toLowerCase()));
  return base.concat(extra.filter(w => !seen.has(w.word.toLowerCase())));
}
function pkQuestions(n){
  const pool = pkBank().slice();
  const bank = pkPool();
  const picked = shuffle(pool).slice(0, Math.min(n, pool.length));
  return picked.map(w => {
    const en2cn = Math.random() < 0.5;               // true=看英文选中文，false=看中文选英文
    if(en2cn){
      // 选项是中文首义（短，便于快速辨认），去重
      const mine = pkCleanCn(w.cn).slice(0, 16);
      const pool2 = [];
      for(const x of shuffle(bank)){
        const c = pkCleanCn(x.cn).slice(0, 16);
        if(!c || c === mine || pool2.includes(c)) continue;
        pool2.push(c);
        if(pool2.length >= 3) break;
      }
      const options = shuffle([mine, ...pool2]);
      return {
        word: w.word, cn: w.cn, en2cn: true,
        prompt: w.word,
        promptSub: '',
        options,
        answer: mine
      };
    }
    // 选项是英文单词
    const wrongs = shuffle(bank.filter(x => x.word && x.word.toLowerCase() !== w.word.toLowerCase()).map(x => x.word)).slice(0, 3);
    const options = shuffle([w.word, ...wrongs]);
    return {
      word: w.word, cn: w.cn, en2cn: false,
      prompt: pkCleanCn(w.cn),
      promptSub: '',
      options,
      answer: w.word
    };
  });
}
function pkScore(msLeft, correct){
  if(!correct) return 0;
  const ratio = Math.max(0, Math.min(1, msLeft / (PK_CONF.TIME * 1000)));
  return 100 + Math.round(ratio * 100);      // 答对 100 分 + 速度加分最多 100
}

  const mk = (name) => ({ name, score:0, right:0, ms:0, total:0, answered:false, chosen:null });
  pk = {
    mode, level: level || 'normal', aiCfg: cfg,
    qs: pkQuestions(PK_CONF.QN),
    idx: 0, turn: 0, phase: 'q',
    startAt: Date.now(),

    ai: null, aiTimer: null,
    qStart: 0, deadline: 0

        <div class="pk-side ${cur === 0 ? 'active' : ''}">
          <div class="pk-pname">${p0.name}</div>
          <div class="pk-pscore" id="pkS0">${p0.score}</div>
        </div>
        <div class="pk-mid">
          <div class="pk-progress">第 <b>${st.idx+1}</b> / ${st.qs.length} 题</div>
          <div class="pk-clock" id="pkClock">${PK_CONF.TIME}</div>
        </div>
        <div class="pk-side right ${cur === 1 ? 'active' : ''}">
          <div class="pk-pname">${p1.name}</div>
          <div class="pk-pscore" id="pkS1">${p1.score}</div>
        </div>
      </div>
      <div class="pk-bar"><div class="pk-bar-fill" id="pkBar"></div></div>

      <div class="pk-question">
        <div class="pk-q-tag">${q.en2cn ? '选出正确的中文释义' : '选出对应的英文单词'}</div>
        <div class="pk-q-text">${escapeHtml(q.prompt)}</div>
        ${q.promptSub ? `<div class="pk-q-sub">${q.promptSub}</div>` : ''}
        <div class="pk-turn-tip">轮到 <b>${st.players[st.turn].name}</b> 作答</div>
      </div>

      <div class="pk-options" id="pkOptions">
        ${q.options.map((o,i)=>`<button class="pk-option" onclick="pkAnswer(${i},this)">${escapeHtml(String(o).slice(0,26))}</button>`).join("")}
      </div>
      <div class="pk-feedback" id="pkFeedback"></div>
    </div>`;
  pkStartTimer();
}

function pkStartTimer(){
  stopPkTimer();
  const st = pk;
  if(!st) return;
  st.qStart = Date.now();
  st.deadline = st.qStart + PK_CONF.TIME * 1000;
  if(st.mode === 'ai'){
    // 双方各自重置本回合状态，然后 AI 按自己的反应速度独立答题（不等学生）
    st.players.forEach(p => { p.answered = false; p.chosen = null; });
    st.phase = 'q';
    pkScheduleAi();
  }
  pkTick = setInterval(() => {
    if(!pk || pk.phase !== 'q') return;
    const left = Math.max(0, pk.deadline - Date.now());
    const clock = $("#pkClock"), bar = $("#pkBar");
    if(clock){
      clock.textContent = Math.ceil(left / 1000);
      clock.classList.toggle('urgent', left <= 3000);
    }
    if(bar) bar.style.width = (left / (PK_CONF.TIME * 10)) + "%";
    if(left <= 0) pkTimeout();
  }, 100);
}
function stopPkTimer(){ if(pkTick){ clearInterval(pkTick); pkTick = null; } }

/* ---- 人机：AI 对手独立作答 ---- */
function pkScheduleAi(){
  const st = pk;
  if(!st || st.mode !== 'ai') return;
  clearTimeout(st.aiTimer);
  const cfg = st.aiCfg || pkCfg(st.level);
  // 反应时间落在配置区间内，最多用掉 82% 的答题时间（保证它确实"在答"而不是必超时）
  const think = Math.min(PK_CONF.TIME * 820, Math.round(cfg.min + Math.random() * (cfg.max - cfg.min)));
  const willRight = Math.random() < cfg.p;
  st.aiTimer = setTimeout(() => {
    const cur = pk;
    if(!cur || cur !== st || cur.phase !== 'q' || cur.idx !== st.idx) return;
    if(cur.players[1].answered) return;
    pkAiAnswer(think, willRight);
  }, think);
}
function pkAiAnswer(think, willRight){
  const st = pk;
  const q = st.qs[st.idx];
  const p = st.players[1];
  const msLeft = Math.max(0, st.deadline - Date.now());
  const rightIdx = q.options.findIndex(o => o === q.answer);
  let pick = rightIdx;
  if(!willRight){
    const wrongs = q.options.map((o, i) => i).filter(i => i !== rightIdx);
    pick = wrongs.length ? wrongs[Math.floor(Math.random() * wrongs.length)] : (rightIdx === 0 ? 1 : 0);
  }
  p.answered = true; p.chosen = pick;
  p.total++;
  if(willRight) p.right++;
  const gain = pkScore(msLeft, willRight);
  p.score += gain;
  p.ms += (PK_CONF.TIME * 1000 - msLeft);
  p.lastGain = gain;
  p.lastMs = PK_CONF.TIME * 1000 - msLeft;
  p.lastRight = willRight;
  // 不立刻公布 AI 选了什么：否则学生可以等 AI 先答再抄答案。
  // 学生提交（或本题结束）后才揭晓 AI 的选择。
  const fb = $("#pkFbAi");
  if(fb) fb.innerHTML = `<span class="wait">✍️ 已作答 · 用时 ${(p.lastMs / 1000).toFixed(1)}s</span>`;
  if(st.players[0].answered) pkRevealAi();
  pkPaintHud();
  pkMaybeAdvance();
}
// 揭晓 AI 本题的作答：选项着色 + 对错
function pkRevealAi(){
  const st = pk;
  if(!st || st.mode !== 'ai') return;
  const ai = st.players[1];
  if(ai.chosen == null || ai.chosen < 0) return;
  const q = st.qs[st.idx];
  const rightIdx = q.options.findIndex(o => o === q.answer);
  const correct = ai.chosen === rightIdx;
  const opt = $("#pkAi-" + ai.chosen);
  if(opt) opt.classList.add(correct ? 'right' : 'wrong');
  if(!correct && $("#pkAi-" + rightIdx)) $("#pkAi-" + rightIdx).classList.add('right');
  const fb = $("#pkFbAi");
  const t = ai.lastMs ? (ai.lastMs / 1000).toFixed(1) + 's' : '';
  if(fb) fb.innerHTML = correct
    ? `<span class="ok">✅ 答对 +${ai.lastGain} · ${t}</span>`
    : `<span class="no">❌ 答错 · ${t}</span>`;
}

/* ---- 人机：学生作答 ---- */
function pkAnswerMe(idx, el){
  const st = pk;
  if(!st || st.phase !== 'q') return;
  const me = st.players[0];
  if(me.answered) return;
  const q = st.qs[st.idx];
  const chosen = q.options[idx];
  const correct = chosen === q.answer;
  const msLeft = Math.max(0, st.deadline - Date.now());
  me.answered = true; me.chosen = idx;
  me.total++;
  if(correct) me.right++;
  const gain = pkScore(msLeft, correct);
  me.score += gain;
  me.ms += (PK_CONF.TIME * 1000 - msLeft);
  document.querySelectorAll("#pkOptsMe .pkd-opt").forEach(b => b.classList.add('locked'));
  if(el) el.classList.add(correct ? 'right' : 'wrong');
  if(!correct){
    const rightIdx = q.options.findIndex(o => o === q.answer);
    const rEl = $("#pkMe-" + rightIdx);
    if(rEl) rEl.classList.add('right');
  }
  const fb = $("#pkFbMe");
  if(fb) fb.innerHTML = correct
    ? `<span class="ok">✅ 答对 +${gain}</span>`
    : `<span class="no">❌ 答错，正确答案：${escapeHtml(String(q.answer).slice(0, 26))}</span>`;
  pkRevealAi();          // 我已提交，可以公布 AI 的选择了
  pkPaintHud();
  pkMaybeAdvance();
}

function pkPaintHud(){
  const st = pk;
  if(!st) return;
  const [a, b] = st.players;
  const set = (id, v) => { const el = $("#" + id); if(el) el.textContent = v; };
  set('pkS0', a.score); set('pkS1', b.score);
  set('pkA0', a.total ? Math.round(a.right / a.total * 100) + '%' : '—');
  set('pkA1', b.total ? Math.round(b.right / b.total * 100) + '%' : '—');
  set('pkV0', a.total ? (a.ms / a.total / 1000).toFixed(1) + 's' : '—');
  set('pkV1', b.total ? (b.ms / b.total / 1000).toFixed(1) + 's' : '—');
  set('pkProg0', `进度 ${a.total}/${st.qs.length}`);
  set('pkProg1', `进度 ${b.total}/${st.qs.length}`);
  const lead = $("#pkLead");
  if(lead){
    const d = a.score - b.score;
    lead.textContent = d === 0 ? '比分持平' : (d > 0 ? `领先 ${d} 分` : `落后 ${-d} 分`);
    lead.style.color = d === 0 ? '#8b91a6' : (d > 0 ? '#128a55' : '#c0392b');
  }
}
function pkMaybeAdvance(){
  const st = pk;
  if(!st || st.phase !== 'q') return;
  if(!st.players[0].answered || !st.players[1].answered) return;
  st.phase = 'reveal';
  stopPkTimer();
  setTimeout(() => { if(pk === st) pkNextQuestion(); }, 950);
}

function pkAnswer(idx, el){
  const st = pk;
  if(!st || st.phase !== 'q') return;
  if(st.mode === 'ai'){ pkAnswerMe(idx, el); return; }
  const q = st.qs[st.idx];
  const chosen = q.options[idx];
  const correct = chosen === q.answer;
  const msLeft = Math.max(0, st.deadline - Date.now());
  const who = st.turn;

  document.querySelectorAll(".pk-option").forEach(b=>b.classList.add("locked"));
  if(el){ el.classList.add(correct ? "right" : "wrong"); }
  if(!correct){
    document.querySelectorAll(".pk-option").forEach(b=>{ if(b.textContent.trim() === String(q.answer).slice(0,26)) b.classList.add("right"); });
  }
  st.phase = 'reveal';
  stopPkTimer();
  const gain = pkScore(msLeft, correct);
  const p = st.players[who];
  p.score += gain; p.total++; if(correct) p.right++;
  p.ms += (PK_CONF.TIME*1000 - msLeft);
  $("#pkS"+who).textContent = p.score;
  pkFeedback(correct
    ? `<span class="ok">✅ 正确 +${gain}</span>`
    : `<span class="no">❌ 答错，正确答案：${escapeHtml(String(q.answer).slice(0,30))}</span>`);

  st.answered[who] = true;
  if(who === 0){
    setTimeout(()=>{ st.turn = 1; pkNextTurn(); }, 900);
  } else {
    setTimeout(pkNextQuestion, 1100);
  }
}
function pkNextTurn(){
  stopPkTimer();
  const st = pk;
  $("#pkFeedback").innerHTML = `<span class="turn">换人！轮到 <b>${st.players[1].name}</b></span>`;
  document.querySelectorAll(".pk-option").forEach(b=>{ b.classList.remove("right","wrong","locked"); });
  const tip = document.querySelector(".pk-turn-tip");
  if(tip) tip.innerHTML = `轮到 <b>${st.players[1].name}</b> 作答`;
  document.querySelectorAll(".pk-side").forEach((e,i)=>e.classList.toggle("active", i===1));
  st.phase = 'q';
  pkStartTimer();
}
function pkTimeout(){
  const st = pk;
  if(!st || st.phase !== 'q') return;
  st.phase = 'reveal';
  stopPkTimer();
  const q = st.qs[st.idx];
  const rightIdx = q.options.findIndex(o => o === q.answer);
  if(st.mode === 'ai'){
    const meOut = !st.players[0].answered, aiOut = !st.players[1].answered;
    st.players.forEach(p => {
      if(p.answered) return;
      p.answered = true; p.total++; p.chosen = -1;
    });
    document.querySelectorAll("#pkOptsMe .pkd-opt").forEach(b => b.classList.add('locked'));
    const meFb = $("#pkFbMe");
    if(meFb && meOut) meFb.innerHTML = `<span class="no">⏰ 超时，正确答案：${escapeHtml(String(q.answer).slice(0, 26))}</span>`;
    const rMe = $("#pkMe-" + rightIdx);
    if(rMe) rMe.classList.add('right');
    const aiFb = $("#pkFbAi");
    if(aiFb && aiOut) aiFb.innerHTML = `<span class="wait">⏰ 思考超时</span>`;
    if(aiOut){
      const rAi = $("#pkAi-" + rightIdx);
      if(rAi) rAi.classList.add('right');
    } else {
      pkRevealAi();
    }
    pkPaintHud();
    setTimeout(() => { if(pk === st) pkNextQuestion(); }, 1000);
    return;
  }
  document.querySelectorAll(".pk-option").forEach(b=>{
    b.classList.add("locked");
    if(b.textContent.trim() === String(q.answer).slice(0,26)) b.classList.add("right");
  });
  pkFeedback(`<span class="no">⏰ ${st.players[st.turn].name} 超时</span>`);
  st.players[st.turn].total++;
  if(st.turn === 0){ setTimeout(()=>{ st.turn = 1; pkNextTurn(); }, 800); }
  else setTimeout(pkNextQuestion, 900);
}
function pkFeedback(html){
  const el = $("#pkFeedback");
  if(el) el.innerHTML = html;
}
function pkNextQuestion(){
  const st = pk;
  if(!st) return;
  clearTimeout(st.aiTimer);
  st.idx++;
  if(st.idx >= st.qs.length){ pkFinish(); return; }
  st.turn = 0;
  st.phase = 'q';
  pkRender();
}

/* ---------- 结算 ---------- */
function pkFinish(){
  stopPkTimer();
  const st = pk;
  if(st && st.aiTimer) clearTimeout(st.aiTimer);
  const [a, b] = st.players;
  const win = a.score > b.score ? 0 : (a.score < b.score ? 1 : -1);
  const bestKey = st.mode === 'ai' ? 'ai' : 'duel';
  const best = loadStore('lx_pk_best', { ai:0, duel:0 });
  if(win === 0){ best[bestKey] = (best[bestKey] || 0) + 1; saveStore('lx_pk_best', best); }
  else if(win === 1){ best[bestKey] = 0; saveStore('lx_pk_best', best); }
  const acc = p => p.total ? Math.round(p.right / p.total * 100) : 0;
  const avg = p => p.total ? (p.ms / p.total / 1000).toFixed(1) : '0.0';
  const pkGain = recordPk(win);

  const title = st.mode === 'duel'
    ? (win === 0 ? `${a.name} 获胜！` : (win === 1 ? `${b.name} 获胜！` : '平局'))
    : (win === 0 ? '你赢了！' : (win === 1 ? '惜败，再来一局？' : '平局'));
  $("#battlePage").innerHTML = `
    <div class="pk-result">
      <div class="pk-result-emoji">${win===0 ? '🏆' : (win===1 ? (st.mode==='duel'?'🎉':'💪') : '🤝')}</div>
      <div class="pk-result-title">${title}</div>
      <div class="pk-result-score"><b>${a.score}</b> : <b>${b.score}</b></div>
      <div class="pk-result-names">${a.name}　vs　${b.name}${typeof pkGain === 'number' ? `　·　积分 +${pkGain}` : ''}</div>
      <div class="pk-stats">
        <div class="pk-stat"><span>正确率</span><b>${acc(a)}%</b><em>${acc(b)}%</em></div>
        <div class="pk-stat"><span>平均用时</span><b>${avg(a)}s</b><em>${avg(b)}s</em></div>
        <div class="pk-stat"><span>总得分</span><b>${a.score}</b><em>${b.score}</em></div>
      </div>
      <div class="pk-actions">
        <button class="btn btn-primary" onclick="pkAgain()">再来一局</button>
        <button class="btn btn-ghost" onclick="pk=null;renderBattleHome()">返回对战大厅</button>
      </div>
    </div>`;
}
function pkAgain(){
  if(!pk) return renderBattleHome();
  const { mode, level, players } = pk;
  const [n1, n2] = [players[0].name, players[1].name];
  pk = null;
  startPk(mode, level, n1, n2);
}

/* ================= 🌐 在线对战（免配置实时通道） ================= */
// 本站是纯静态部署，没有常驻服务器。在线对战改为浏览器直连公共发布订阅通道：
// 房间码 → 话题，双方各开一条 SSE 长连接收消息，用 HTTP POST 发消息。
// 这样不需要注册账号、不需要配置 KV，也不会因为轮询把免费额度用光。
let online = null;

const PK_RELAY = 'https://ntfy.sh';
const PK_TOPIC = 'ketplanet-pk-v2-';
const PK_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // 去掉 0/O/1/I/L 等易混字符
const PK_MSG_MAX = 2000;                                // 单条消息字符上限，超出自动分片

function pkCode(){
  let s = '';
  for(let i = 0; i < 6; i++) s += PK_CHARS[Math.floor(Math.random() * PK_CHARS.length)];
  return s;
}
function pkTopicOf(code){ return PK_TOPIC + String(code || '').toLowerCase(); }
function pkNonce(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

async function pkPost(body){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 7000);
  try{
    const r = await fetch(PK_RELAY + '/' + pkTopicOf(online.code), {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },       // 简单请求，不触发 CORS 预检
      body,
      signal: ctrl.signal
    });
    return r.ok;
  }catch(e){ return false; }
  finally{ clearTimeout(timer); }
}

// 发一条消息：同一份 body 最多重试一次，接收端按 n 去重
async function pkSend(msg){
  if(!online) return false;
  const body = JSON.stringify(Object.assign({ v: 1, from: online.role, mid: online.mid || '', n: pkNonce() }, msg));
  let ok = await pkPost(body);
  if(!ok){ await new Promise(r => setTimeout(r, 600)); ok = await pkPost(body); }
  return ok;
}

// 大消息分片（开局消息带 10 道题，可能超过单条上限）
async function pkSendBig(t, data){
  const s = JSON.stringify(data);
  if(s.length <= PK_MSG_MAX) return pkSend({ t, data });
  const parts = Math.ceil(s.length / PK_MSG_MAX);
  for(let i = 0; i < parts; i++){
    const ok = await pkSend({ t, part: i, parts, s: s.slice(i * PK_MSG_MAX, (i + 1) * PK_MSG_MAX) });
    if(!ok) return false;
  }
  return true;
}

function pkOpenChannel(){
  pkCloseChannel();
  let es;
  try{ es = new EventSource(PK_RELAY + '/' + pkTopicOf(online.code) + '/sse?since=' + Math.floor(Date.now() / 1000)); }
  catch(e){ return; }
  online.es = es;
  es.onopen = () => { online.open = true; clearTimeout(online.openTimer); pkPaintLink(); };
  es.onerror = () => { online.open = false; pkPaintLink(); };   // EventSource 自动重连
  // 8 秒还没连上：给出可操作的提示（自动重连仍在后台继续）
  online.openTimer = setTimeout(() => {
    if(!online || online.open) return;
    const el = $("#pkLinkState");
    if(el){ el.className = 'pk-link off'; el.textContent = '○ 连接失败，正在重试…请检查网络'; }
  }, 8000);
  es.onmessage = ev => {
    let env; try{ env = JSON.parse(ev.data); }catch(e){ return; }
    if(!env || env.event !== 'message' || !env.message) return;
    let m; try{ m = JSON.parse(env.message); }catch(e){ return; }
    pkOnPeerMsg(m);
  };
}
function pkCloseChannel(){
  if(!online) return;
  if(online.es){ try{ online.es.close(); }catch(e){} online.es = null; }
  clearTimeout(online.openTimer);
  online.open = false;
}
function pkPaintLink(){
  const el = $("#pkLinkState");
  if(!el || !online) return;
  el.className = 'pk-link ' + (online.open ? 'on' : 'off');
  el.textContent = online.open ? '● 实时通道已连接' : '○ 正在连接实时通道…';
}
function pkPaintPeer(text){
  const el = $("#pkRoomTip");
  if(el) el.textContent = text;
}

function renderPkOnlineSetup(){
  $("#battlePage").innerHTML = `
    <h2 class="page-title">🌐 在线对战</h2>
    <p class="page-sub">两人各用一台设备，输入同一房间码即可同场竞速</p>
    <div class="pk-online-box">
      <div class="pk-online-col">
        <div class="pk-online-title">我是房主</div>
        <p class="pk-online-desc">生成 6 位房间码，发给同学</p>
        <button class="btn btn-primary" onclick="pkCreateRoom()">创建房间</button>
      </div>
      <div class="pk-online-col">
        <div class="pk-online-title">加入房间</div>
        <input id="pkJoinCode" maxlength="6" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="6 位房间码" style="text-transform:uppercase">
        <button class="btn btn-ghost" onclick="pkJoinRoom()">加入</button>
      </div>
    </div>
    <div class="pk-rules">对战为 ${PK_CONF.QN} 题、每题 ${PK_CONF.TIME} 秒；双方题目相同，各自独立计时，答完自动进入下一题。<br>房间码实时匹配，免注册、免登录。</div>
    <div style="text-align:center;margin-top:18px"><button class="btn btn-ghost" onclick="renderBattleHome()">← 返回</button></div>`;
}

function pkCreateRoom(){
  online = { code: pkCode(), role: 'host', mid: '', open: false, peerHere: false, seen: new Set(), state: { phase: 'lobby' } };
  pkOpenChannel();
  pkOnlineLobby();
}

function pkJoinRoom(){
  const el = $("#pkJoinCode");
  const code = String((el && el.value) || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if(code.length !== 6) return toast('请输入 6 位房间码');
  online = { code, role: 'guest', mid: '', open: false, peerHere: false, seen: new Set(), state: { phase: 'lobby' } };
  pkOpenChannel();
  pkOnlineLobby('正在进入房间…');
  // 敲门：房主在线会回 hi；3 次没回应说明房间码输错了
  let tries = 0;
  online.knockTimer = setInterval(() => {
    if(!online || online.role !== 'guest') return;
    if(online.peerHere){ clearInterval(online.knockTimer); return; }
    if(tries++ < 2) pkSend({ t: 'hello' });
    else { clearInterval(online.knockTimer); pkPaintPeer('没有收到房主回应，请确认房间码是否输对'); }
  }, 3200);
  pkSend({ t: 'hello' });
}
function pkOnlineLobby(tip){
  const isHost = online.role === 'host';
  $("#battlePage").innerHTML = `
    <h2 class="page-title">🌐 在线对战</h2>
    <div class="pk-room">
      <div class="pk-room-label">房间码</div>
      <div class="pk-room-code">${online.code}</div>
      <div class="pk-room-tip" id="pkRoomTip">${tip || (isHost ? '把房间码发给同学，等他加入…' : '等待房主开始…')}</div>
      <div id="pkLinkState" class="pk-link off">○ 正在连接实时通道…</div>
      <div id="pkRoomActions" class="pk-actions">
        ${isHost ? `<button class="btn btn-primary" id="pkStartBtn" disabled onclick="pkStartOnline()">等对手加入…</button>` : ''}
        <button class="btn btn-ghost" onclick="pkLeaveOnline()">离开</button>
      </div>
    </div>`;
  pkPaintLink();

// 结束当前在线房间（不重绘页面，供路由切换等场景调用）

// 收到对手消息（实时通道会把双方消息广播给所有人，自己发的回声在这里过滤掉）
function pkOnPeerMsg(m){
  if(!online || !m || m.v !== 1) return;
  if(m.from === online.role) return;                          // 自己的回声
  if(m.mid && online.mid && m.mid !== online.mid) return;     // 上一局残留消息
  if(m.n){ if(online.seen.has(m.n)) return; online.seen.add(m.n); }   // 断线重连会重放，按 n 去重
  const st = online.state;

  if(m.t === 'hello'){                     // 访客敲门
    if(online.role !== 'host') return;
    online.peerHere = true;
    pkSend({ t: 'hi' });
    pkPaintPeer('对手已加入，可以开始了！');
    const btn = $("#pkStartBtn");
    if(btn){ btn.disabled = false; btn.textContent = '开始对战'; }
    return;
  }
  if(m.t === 'hi'){                        // 房主应答
    if(online.role !== 'guest') return;
    online.peerHere = true;
    clearInterval(online.knockTimer);
    pkPaintPeer('已进入房间，等待房主开始…');
    return;
  }
  if(m.t === 'bye'){
    online.peerHere = false;
    if(st.phase === 'playing') pkPeerGone('对手已离开对局');
    else pkPaintPeer('对手已离开房间');
    return;
  }
  if(m.t === 'start'){
    if(online.role !== 'guest') return;
    let data = m.data;
    if(typeof m.parts === 'number'){       // 分片组装
      const buf = online.parts || (online.parts = {});
      buf[m.part] = m.s;
      if(Object.keys(buf).length < m.parts) return;
      try{ data = JSON.parse(Array.from({ length: m.parts }, (_, i) => buf[i]).join('')); }catch(e){ return; }
      online.parts = null;
    }
    if(!data || !data.qs || !data.qs.length) return;
    online.mid = m.mid || online.mid;
    pkOnlineBegin(data);
    return;
  }
  if(m.t === 'ans'){
    if(st.phase !== 'playing' || !m.data) return;
    if(!st.oppSeen) st.oppSeen = {};
    if(st.oppSeen[m.data.i]) return;       // 同一题重复到达，忽略
    st.oppSeen[m.data.i] = 1;
    st.oppAns = m.data;
    st.opp.score = (st.opp.score || 0) + (m.data.score || 0);
    st.opp.total = (st.opp.total || 0) + 1;
    if(m.data.ok) st.opp.right = (st.opp.right || 0) + 1;
    st.opp.ms = (st.opp.ms || 0) + (m.data.ms || 0);
    const el = $("#pkOS1"); if(el) el.textContent = st.opp.score;
    pkOnlineAfterAnswer();
    return;
  }
  if(m.t === 'end'){
    if(st.phase !== 'done') return;
    if(m.data){
      st.opp.score = m.data.score || 0;
      st.opp.right = m.data.right || 0;
      st.opp.total = m.data.total || PK_CONF.QN;
      st.opp.ms = m.data.ms || 0;
    }
    st.oppFinal = true;
    pkOnlineRenderResult();
  }
}

function pkOnlineBegin(data){
  if(!online || online.state.phase === 'playing') return;
  const st = online.state = {
    phase: 'playing',
    qs: data.qs, idx: 0,
    my: { score:0, right:0, total:0, ms:0 },
    opp: { score:0, right:0, total:0, ms:0 },
    myAns: null, oppAns: null, oppSeen: {},
    names: data.names || {}
  };
  online.oppName = data.names ? (online.role === 'host' ? (data.names.guest || '对手') : (data.names.host || '房主')) : '对手';
  clearTimeout(online.watch);
  online.watch = null;
  pkOnlineRender();
}

async function pkStartOnline(){
  if(!online || online.role !== 'host') return;
  if(!online.peerHere) return toast('还没有对手加入');
  // 只发渲染需要的字段，减小消息体
  const qs = pkQuestions(PK_CONF.QN).map(q => ({ en2cn: q.en2cn, prompt: q.prompt, promptSub: q.promptSub, options: q.options, answer: q.answer }));
  const names = { host: '房主', guest: '对手' };
  const btn = $("#pkStartBtn");
  if(btn){ btn.disabled = true; btn.textContent = '正在开局…'; }
  online.mid = pkNonce();
  const ok = await pkSendBig('start', { qs, names });
  if(!ok){
    if(btn){ btn.disabled = false; btn.textContent = '开始对战'; }
    return toast('开局消息发送失败，请检查网络后重试');
  }
  pkOnlineBegin({ qs, names });
}

function pkOnlineRender(){

  $("#battlePage").classList.remove("hidden");

function pkOnlineTimer(){
  if(online.tick) clearInterval(online.tick);
  const st = online.state;
  st.deadline = Date.now() + PK_CONF.TIME * 1000;
  online.tick = setInterval(()=>{
    if(!online || online.state.phase !== 'playing' || online.state.myAns) return;
    const left = Math.max(0, online.state.deadline - Date.now());
    const c = $("#pkOClock"), b = $("#pkOBar");
    if(c) c.textContent = Math.ceil(left / 1000);
    if(b) b.style.width = (left / (PK_CONF.TIME * 10)) + "%";
    if(left <= 0) pkOnlineAnswer(-1, null);
  }, 100);
}

async function pkOnlineAnswer(idx, el){
  const st = online.state;
  if(st.phase !== 'playing' || st.myAns) return;
  const q = st.qs[st.idx];
  const chosen = idx >= 0 ? q.options[idx] : null;
  const ok = chosen === q.answer;
  const msLeft = Math.max(0, st.deadline - Date.now());
  const usedMs = PK_CONF.TIME * 1000 - msLeft;
  const sc = pkScore(msLeft, ok);

  st.myAns = { i: st.idx, ok, ms: usedMs, score: sc };
  st.my.total++; st.my.ms += usedMs; st.my.score += sc; if(ok) st.my.right++;
  $("#pkOS0").textContent = st.my.score;

  document.querySelectorAll(".pk-option").forEach(b=>{
    b.classList.add("locked");
    if(b.textContent.trim() === String(q.answer).slice(0,26)) b.classList.add("right");
  });
  if(el && !ok) el.classList.add("wrong");
  const fb = $("#pkOFeedback");
  if(fb) fb.innerHTML = ok
    ? `<span class="ok">✅ 正确 +${sc}　等待对手…</span>`
    : `<span class="no">❌ ${idx<0?'超时':'答错'}，答案：${escapeHtml(String(q.answer).slice(0,26))}　等待对手…</span>`;

  pkSend({ t:'ans', data: st.myAns });   // 不阻塞本地翻页，发送失败会由对手侧超时兜底
  pkOnlineAfterAnswer();
}

function pkOnlineAfterAnswer(){
  const st = online.state;
  if(st.phase !== 'playing') return;
  if(st.myAns && st.oppAns && st.oppAns.i === st.idx && !st.moving){
    clearTimeout(online.watch); online.watch = null;
    st.moving = true;
    setTimeout(()=>{
      st.moving = false;
      st.myAns = null; st.oppAns = null;
      st.idx++;
      if(st.idx >= st.qs.length){ pkOnlineFinish(); }
      else pkOnlineRender();
    }, 700);
  } else if(st.myAns && !st.oppAns && !online.watch){
    // 我已作答、对手迟迟没回音：多半掉线，避免一直干等
    online.watch = setTimeout(()=>{
      online.watch = null;
      if(online && online.state.phase === 'playing' && online.state.myAns && !online.state.oppAns)
        pkPeerGone('对手没有响应，按当前比分结算');
    }, 16000);
  }
}

function pkPeerGone(msg){
  if(!online) return;
  const st = online.state;
  pkPaintPeer(msg || '对手已离开对局');
  if(st.phase === 'playing'){
    st.forfeit = true;
    toast(msg || '对手已离开对局');
    pkOnlineFinish();
  }
}

function pkOnlineFinish(){
  const st = online.state;
  if(st.phase === 'done') return;
  st.phase = 'done';
  stopOnlineTick();
  clearTimeout(online.watch); online.watch = null;
  pkSend({ t:'end', data: { score: st.my.score, right: st.my.right, total: st.my.total, ms: st.my.ms } });
  setTimeout(pkOnlineRenderResult, 1500);
}
function pkOnlineRenderResult(){
  const st = online.state;
  if(!st || st.shown) return;
  st.shown = true;
  stopOnlineTick();
  const a = st.my, b = st.opp;
  const win = a.score > b.score ? 0 : (a.score < b.score ? 1 : -1);
  const acc = p => p.total ? Math.round((p.right || 0) / p.total * 100) : 0;
  $("#battlePage").innerHTML = `
    <div class="pk-result">
      <div class="pk-result-emoji">${win===0?'🏆':(win===1?'💪':'🤝')}</div>
      <div class="pk-result-title">${win===0?'你赢了！':(win===1?'惜败':'平局')}</div>
      <div class="pk-result-score"><b>${a.score}</b> : <b>${b.score}</b></div>
      <div class="pk-result-names">我　vs　${escapeHtml(online.oppName)}</div>
      <div class="pk-stats">
        <div class="pk-stat"><span>正确率</span><b>${acc(a)}%</b><em>${acc(b)}%</em></div>
        <div class="pk-stat"><span>总得分</span><b>${a.score}</b><em>${b.score}</em></div>
      </div>
      ${st.forfeit ? '<div class="pk-room-tip" style="text-align:center">对手已离线，本局按当前比分结算</div>' : ''}
      <div class="pk-actions">
        <button class="btn btn-primary" onclick="pkLeaveOnline()">返回对战大厅</button>
      </div>
    </div>`;
}

/* ================= 路由：浏览器前进/后退 + 深链接 ================= */
let routeReady = false;
function routeSnapshot(){ return { mode: appMode, step: currentStep, idx: learnIndex, group: currentGroup }; }
function routeHash(st){
  const s = st || routeSnapshot();
  return s.mode === 'learn'
    ? `#/learn/${s.group || 0}/${s.step || 0}/${s.idx || 0}`
    : `#/${s.mode}`;
}
function pushRoute(){
  if(!routeReady) return;
  try{ history.pushState(routeSnapshot(), '', routeHash()); }catch(e){}
}
function replaceRoute(){
  if(!routeReady) return;
  try{ history.replaceState(routeSnapshot(), '', routeHash()); }catch(e){}
}
function parseRoute(){
  const h = location.hash || '';
  let m = h.match(/^#\/learn\/(\d+)\/(\d+)\/(\d+)$/);
  if(m) return { mode:'learn', group:+m[1], step:+m[2], idx:+m[3] };
  m = h.match(/^#\/(review|wrongbook|decks|achievement|battle)$/);
  if(m) return { mode:m[1] };
  return null;
}
// 应用一条路由状态（来自浏览器前进/后退或首屏深链接），不再反向写历史
function applyRoute(st){
  if(!st) return;
  stopAudio();
  exitBattleIfNeeded(st.mode);
  if(typeof st.group === 'number' && GROUPS[st.group] && st.group !== currentGroup){
    currentGroup = st.group;
    currentBatch = [];
    newBatch();
  }
  appMode = (st.mode === 'review' || st.mode === 'wrongbook' || st.mode === 'decks' || st.mode === 'achievement' || st.mode === 'battle') ? st.mode : 'learn';
  if(appMode === 'learn'){
    currentStep = Math.max(0, Math.min(STEPS.length, Number(st.step) || 0));
    lastStudyStep = currentStep;
    learnIndex = Math.max(0, Math.min(Math.max(0, words().length - 1), Number(st.idx) || 0));
  }
  closeDrawer();
  renderAll();
}
window.addEventListener('popstate', e => applyRoute(e.state || parseRoute()));

  renderAccountUI();

function randHex(n){
  const a = new Uint8Array(n);
  try{ crypto.getRandomValues(a); }catch(e){ for(let i=0;i<n;i++) a[i] = Math.floor(Math.random()*256); }
  return Array.from(a).map(b => b.toString(16).padStart(2,'0')).join('');
}
async function hashPassword(pwd, salt){
  const raw = salt + '|' + pwd;
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(raw));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }catch(e){                                  // 非安全上下文（file://）兜底
    let h = 5381;
    for(let i=0;i<raw.length;i++) h = ((h*33) ^ raw.charCodeAt(i)) >>> 0;
    return 'w' + h.toString(16) + raw.length;
  }
}

async function sendAuthCode(){
  const email = String((document.getElementById('auEmail') || {}).value || '').trim().toLowerCase();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ authMsg('请先填写正确的邮箱地址', 'err'); return; }
  const btn = document.getElementById('auCodeBtn');
  if(btn){ btn.disabled = true; btn.textContent = '发送中…'; }
  authMsg('');
  try{
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'send', email })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || ('发送失败（' + r.status + '）'));
    authToken = d.token || null;
    authEmail = email;
    authMsg('验证码已发到 ' + email + '，10 分钟内有效', 'ok');
    startCodeCountdown(60);
    const codeEl = document.getElementById('auCode');
    if(codeEl) codeEl.focus();
  }catch(e){
    authMsg(e && e.message ? e.message : '发送失败，请稍后重试', 'err');
    if(btn){ btn.disabled = false; btn.textContent = '发送验证码'; }
  }
}
function startCodeCountdown(sec){
  const btn = document.getElementById('auCodeBtn');
  if(!btn) return;
  let left = sec;
  btn.disabled = true;
  btn.textContent = left + 's 后重发';
  if(authTimer) clearInterval(authTimer);
  authTimer = setInterval(()=>{
    left--;
    const el = document.getElementById('auCodeBtn');
    if(left <= 0){
      clearInterval(authTimer); authTimer = null;
      if(el){ el.disabled = false; el.textContent = '重新发送'; }
      return;
    }
    if(el) el.textContent = left + 's 后重发';
  }, 1000);
}
async function doLogin(){
  const email = String((document.getElementById('auEmail') || {}).value || '').trim().toLowerCase();
  const pwd = String((document.getElementById('auPwd') || {}).value || '');
  if(!email || !pwd){ authMsg('请填写邮箱和密码', 'err'); return; }
  const acc = loadAccounts()[email];
  if(!acc){ authMsg('这个邮箱还没注册过，请先切到「注册」', 'err'); return; }
  const h = await hashPassword(pwd, acc.salt);
  if(h !== acc.hash){ authMsg('密码不正确', 'err'); return; }
  setCurrentAccount({ email, name: acc.name || '', at: acc.at || Date.now() });
  closeAuth();
  toast('已登录：' + (acc.name || email));
}
async function doRegister(){
  const email = String((document.getElementById('auEmail') || {}).value || '').trim().toLowerCase();
  const code = String((document.getElementById('auCode') || {}).value || '').replace(/\D/g, '');
  const name = String((document.getElementById('auName') || {}).value || '').trim();
  const pwd = String((document.getElementById('auPwd') || {}).value || '');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){ authMsg('邮箱格式不正确', 'err'); return; }
  if(code.length !== 6){ authMsg('请输入 6 位数字验证码', 'err'); return; }
  if(pwd.length < 6){ authMsg('密码至少 6 位', 'err'); return; }
  if(!authToken || authEmail !== email){ authMsg('请先点「发送验证码」获取验证码', 'err'); return; }
  const btn = document.querySelector('.modal-box .btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = '验证中…'; }
  try{
    const r = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'verify', email, code, token: authToken })
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(d.error || ('验证失败（' + r.status + '）'));
    const salt = randHex(8);
    const hash = await hashPassword(pwd, salt);
    const accs = loadAccounts();
    accs[email] = { name: name || email.split('@')[0], salt, hash, at: Date.now() };
    saveAccounts(accs);
    setCurrentAccount({ email, name: accs[email].name, at: accs[email].at });
    authToken = null; authEmail = '';
    closeAuth();
    toast('注册成功，已登录');
  }catch(e){
    authMsg(e && e.message ? e.message : '注册失败，请稍后重试', 'err');
    if(btn){ btn.disabled = false; btn.textContent = '注册并登录'; }
  }
}
function logoutAccount(){
  if(!confirm('退出后本机账号仍会保留，学习进度不受影响。确定退出吗？')) return;
  setCurrentAccount(null);
  authTab = 'login';
  renderAuthModal();
  toast('已退出登录');
}

const boot = parseRoute();
if(boot && typeof boot.group === 'number' && GROUPS[boot.group]) currentGroup = boot.group;
newBatch();
if(boot){
  appMode = boot.mode || 'learn';
  if(appMode === 'learn'){
    currentStep = Math.max(0, Math.min(STEPS.length, Number(boot.step) || 0));
    learnIndex = Math.max(0, Math.min(words().length - 1, Number(boot.idx) || 0));
    lastStudyStep = currentStep;
  }
}
renderAll();
renderAccountUI();
try{ history.replaceState(routeSnapshot(), '', routeHash()); }catch(e){}
routeReady = true;

// 键盘左右方向键翻词（输入框内不拦截，避免打字时误触）
document.addEventListener('keydown', e=>{
  if(e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  const t = e.target;
  if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if(appMode !== 'learn' || currentStep !== 0) return;
  e.preventDefault();
  if(e.key === 'ArrowLeft') prevWord(); else nextWord();
});
