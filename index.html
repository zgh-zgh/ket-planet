<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻松背单词 - 中高考词汇训练</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --primary:#4f6ef7; --primary2:#7c5cf0;
    --text:#1f2430; --muted:#8a90a3; --border:#e7e9f2;
    --green:#22c58b; --red:#ff6b6b; --amber:#ffb020; --yellow:#ffe9a8;
    --shadow:0 6px 24px rgba(70,80,130,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}
  .app{max-width:980px;margin:0 auto;padding:20px 16px 60px}

  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px}
  .logo{font-size:22px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .logo small{font-size:12px;font-weight:500;-webkit-text-fill-color:var(--muted);margin-left:8px}
  .group-tabs{display:flex;gap:8px;flex-wrap:wrap}
  .group-tab{padding:8px 16px;border-radius:20px;background:#fff;border:1px solid var(--border);cursor:pointer;font-size:14px;color:var(--muted);transition:.2s}
  .group-tab:hover{border-color:var(--primary);color:var(--primary)}
  .group-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}

  .progress-bar{height:8px;background:#eef0f7;border-radius:4px;overflow:hidden;margin-bottom:16px}
  .progress-bar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .3s}

  .steps{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:0;margin:14px 0 22px}
  .step{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:24px;background:#fff;border:1px solid var(--border);font-size:14px;color:var(--muted);cursor:pointer;transition:.2s}
  .step .n{width:22px;height:22px;border-radius:50%;background:#eef0f7;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
  .step.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .step.active .n{background:rgba(255,255,255,.25)}
  .step.done{color:var(--green);border-color:var(--green)}
  .step.done .n{background:var(--green);color:#fff}
  .step-arrow{color:#c4c9d8;margin:0 6px;font-size:16px}

  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px;margin-bottom:20px}
  h2.page-title{text-align:center;margin-bottom:6px;font-size:22px}
  .page-sub{text-align:center;color:var(--muted);margin-bottom:22px;font-size:14px}

  /* ===== 学习页 ===== */
  .learn-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .word-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .word-img{width:100%;max-width:320px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;margin-bottom:16px;background:linear-gradient(135deg,#eef1ff,#f7f0ff);display:flex;align-items:center;justify-content:center}
  .word-img .emoji{font-size:110px;line-height:1}
  .word-text{font-size:44px;font-weight:800;letter-spacing:.5px}
  .word-text .syl{cursor:pointer;border-radius:4px;padding:0 2px;transition:.15s}
  .word-text .syl.active{background:var(--red);color:#fff}
  .word-phonetic{color:var(--muted);font-size:15px;margin:6px 0 2px}
  .word-cn{font-size:20px;font-weight:600;color:var(--primary);margin-top:8px}
  .speak-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .btn-speak{padding:9px 20px;border-radius:22px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:14px;transition:.15s}
  .btn-speak:hover{background:var(--primary);color:#fff}
  .btn-speak.playing{background:var(--primary);color:#fff}

  .word-info h3{font-size:15px;color:var(--primary);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{padding:6px 12px;border-radius:14px;background:#f0f3ff;color:#4a5ad0;font-size:13px;border:1px solid #dfe5ff}
  .chip .cn{color:#8a90a3;font-size:12px}
  .root-box{background:#f8f9fd;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;border-left:3px solid var(--primary2)}
  .root-box b{color:var(--primary2)}
  .example{margin-bottom:10px;padding:10px 14px;border-radius:12px;background:#fbfbfe;border:1px solid var(--border)}
  .example .en{font-weight:600;font-size:15px}
  .example .en b{color:var(--primary)}
  .example .cn{color:var(--muted);font-size:13px}
  .ex-speak{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:13px;margin-right:8px;vertical-align:middle;transition:.15s;padding:0;line-height:1}
  .ex-speak:hover{background:var(--primary);color:#fff}

  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .btn{padding:12px 26px;border-radius:26px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:.2s}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,110,247,.35)}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-skip{background:#fff;border:1px dashed #c4c9d8;color:var(--muted);font-size:13px;padding:10px 18px}
  .progress-info{color:var(--muted);font-size:14px}

  /* ===== 题型通用 ===== */
  .question{background:#fbfbfe;border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
  .q-index{font-size:13px;color:var(--muted);margin-bottom:6px}
  .q-sentence{font-size:17px;font-weight:500;line-height:1.8}
  .q-sentence b{color:var(--primary);font-weight:700}
  .q-sentence .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .option{padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--border);cursor:pointer;font-size:15px;text-align:center;transition:.15s;user-select:none}
  .option:hover{border-color:var(--primary)}
  .option.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .option.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连线 */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .match-col{display:flex;flex-direction:column;gap:12px}
  .match-col h3{text-align:center;font-size:15px;color:var(--muted);margin-bottom:4px}
  .match-item{padding:14px 16px;border-radius:14px;background:#fbfbfe;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:16px;font-weight:600;transition:.15s;user-select:none}
  .match-item:hover{border-color:var(--primary)}
  .match-item.selected{border-color:var(--primary);background:#eef2ff}
  .match-item.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .match-item.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}
  .match-item.done{opacity:.4;pointer-events:none}

  /* 拼写 */
  .spell-word{font-size:20px;font-weight:700;margin-bottom:6px}
  .spell-cn{color:var(--muted);margin-bottom:14px}
  .letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;min-height:44px}
  .letter-tile{padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,#f0f3ff,#eef0ff);border:1px solid #dfe5ff;cursor:pointer;font-size:18px;font-weight:700;min-width:44px;text-align:center;transition:.15s;user-select:none}
  .letter-tile:hover{transform:translateY(-2px)}
  .letter-tile.used{opacity:.25;pointer-events:none}
  .answer-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;min-height:48px}
  .slot{width:48px;height:48px;border-radius:12px;border:2px dashed #c4c9d8;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;background:#fff}
  .slot.filled{border-style:solid;border-color:var(--primary);background:#f7f9ff}
  .slot.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .slot.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连词成句 */
  .sentence-frag{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;min-height:44px}
  .frag{padding:10px 16px;border-radius:12px;background:#f0f3ff;border:1px solid #dfe5ff;cursor:pointer;font-size:15px;font-weight:600;transition:.15s;user-select:none}
  .frag.used{opacity:.25;pointer-events:none}
  .sentence-build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;border:2px dashed #dfe5ff;border-radius:12px;padding:12px;margin-bottom:16px}
  .sentence-build .frag{background:#fff;border:1px solid var(--primary)}
  .sentence-build .frag.right{background:#e9fbf4;border-color:var(--green);color:var(--green)}

  /* 翻译 */
  .trans-area textarea{width:100%;min-height:100px;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}

  /* 语篇 */
  .passage{font-size:16px;line-height:2.1;background:#fbfbfe;border-radius:14px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
  .passage .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .passage-trans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);color:var(--muted);font-size:14px}
  .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);text-align:center;padding:0 6px;margin:0 3px;color:var(--primary);font-weight:700;cursor:pointer}
  .blank.filled{color:var(--green)}
  .option-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  .opt-chip{padding:10px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600;transition:.15s}
  .opt-chip:hover{border-color:var(--primary);color:var(--primary)}
  .opt-chip.used{opacity:.3;pointer-events:none}
  .opt-chip.selected{border-color:var(--primary);color:var(--primary)}

  /* 结果 */
  .result-box{text-align:center;padding:40px 20px}
  .result-emoji{font-size:72px}
  .result-score{font-size:48px;font-weight:800;margin:10px 0}
  .result-msg{color:var(--muted);margin-bottom:24px}

  .hidden{display:none!important}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:12px 22px;border-radius:26px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}

  @media(max-width:720px){
    .learn-grid,.match-grid,.options{grid-template-columns:1fr}
    .word-text{font-size:32px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">轻松背单词<small>中高考词汇训练</small></div>
    <div class="group-tabs" id="groupTabs"></div>
  </header>
  <div class="progress-bar"><div id="progressBar" style="width:0%"></div></div>
  <div class="steps" id="steps"></div>
  <section id="learnPage" class="card"></section>
  <section id="matchPage" class="card hidden"></section>
  <section id="choicePage" class="card hidden"></section>
  <section id="fillPage" class="card hidden"></section>
  <section id="spellPage" class="card hidden"></section>
  <section id="sentencePage" class="card hidden"></section>
  <section id="transPage" class="card hidden"></section>
  <section id="passagePage" class="card hidden"></section>
  <section id="resultPage" class="card hidden"></section>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 单词数据 ================= */
/* 字段说明：word 单词, cn 中文, emoji 图片, usPhonetic 美式音标, ukPhonetic 英式音标,
   syllables 音节数组(每项 {text, 对应单词中的片段}), related 同源/相关词, root 词根词缀,
   examples 例句(en含<B>标记目标词, cn译文), passage 语篇 */
const GROUPS = [
  {
    name:"餐厅篇", emoji:"🍽️",
    passage:{
      en:"Last weekend, I walked into a famous <B>restaurant</B> in the city center. A polite <B>waiter</B> smiled and handed me the <B>menu</B>. I ordered a dish recommended by the chef. When I tasted it, the flavor was really <B>delicious</B>. I had made a <B>reservation</B> by phone earlier, so I didn't need to wait in line.",
      cn:"上周末，我走进市中心一家有名的餐馆。一位有礼貌的服务员微笑着递给我菜单。我点了一道厨师推荐的菜。尝了一口，味道真是美味极了。因为我早就打电话做了预订，所以不用排队等位。"
    },
    words:[
      {
        word:"restaurant", cn:"餐馆，饭店", emoji:"🍽️",
        ukPhonetic:"/ˈrestrɒnt/", usPhonetic:"/ˈrestərɑːnt/",
        syllables:[{text:"res"},{text:"tau"},{text:"rant"}],
        related:["chef 厨师","menu 菜单","waiter 服务员","reservation 预订","cuisine 菜肴","cafe 咖啡馆","diner 小餐馆"],
        root:{text:"restaur", meaning:"恢复，修复（源自拉丁语 restaurare）", detail:"restaur（恢复）+ -ant（表“场所/人”的后缀）→ 让人恢复精力的地方 → 餐馆"},
        examples:[
          {en:"We had dinner at a famous <B>restaurant</B> near the park.",cn:"我们在公园附近一家有名的餐馆吃了晚饭。"},
          {en:"The <B>restaurant</B> is famous for its fresh seafood and friendly <B>waiter</B>.",cn:"这家餐馆以新鲜的海鲜和友好的服务员而闻名。"},
          {en:"I'd like to make a <B>reservation</B> at this <B>restaurant</B> for eight o'clock.",cn:"我想在这家餐馆预订八点的位子。"}
        ]
      },
      {
        word:"menu", cn:"菜单", emoji:"📋",
        ukPhonetic:"/ˈmenjuː/", usPhonetic:"/ˈmenjuː/",
        syllables:[{text:"men"},{text:"u"}],
        related:["order 点餐","dish 菜肴","price 价格","special 特色菜","beverage 饮料","dessert 甜点"],
        root:{text:"menu", meaning:"源自法语 menu，本义“小的、详细的”", detail:"minute（详细）+ menu（小）→ 详细列出的小单子 → 菜单"},
        examples:[
          {en:"Could I have the <B>menu</B>, please? I'd like to <B>order</B> something.",cn:"请给我看一下菜单好吗？我想点些东西。"},
          {en:"The <B>menu</B> at this <B>restaurant</B> changes every season.",cn:"这家餐馆的菜单每个季节都会更换。"},
          {en:"There are many delicious <B>dishes</B> on the <B>menu</B>.",cn:"菜单上有很多美味的菜肴。"}
        ]
      },
      {
        word:"waiter", cn:"服务员", emoji:"🤵",
        ukPhonetic:"/ˈweɪtə/", usPhonetic:"/ˈweɪtər/",
        syllables:[{text:"wait"},{text:"er"}],
        related:["waitress 女服务员","serve 服务","tip 小费","customer 顾客","order 订单","bill 账单"],
        root:{text:"wait", meaning:"等待，服务", detail:"wait（等待/侍候）+ -er（表“做某事的人”）→ 侍候客人的人 → 服务员"},
        examples:[
          {en:"The <B>waiter</B> brought us the <B>bill</B> after dinner.",cn:"晚饭后服务员给我们拿来了账单。"},
          {en:"I asked the <B>waiter</B> to <B>serve</B> us another glass of water.",cn:"我请服务员再给我们倒一杯水。"},
          {en:"The polite <B>waiter</B> smiled at every <B>customer</B>.",cn:"那位有礼貌的服务员对每位顾客都微笑。"}
        ]
      },
      {
        word:"delicious", cn:"美味的", emoji:"😋",
        ukPhonetic:"/dɪˈlɪʃəs/", usPhonetic:"/dɪˈlɪʃəs/",
        syllables:[{text:"de"},{text:"li"},{text:"cious"}],
        related:["tasty 好吃的","yummy 美味的","flavor 味道","appetite 食欲","recipe 食谱","sour 酸的"],
        root:{text:"delic", meaning:"愉悦，精细（源自拉丁语 delicere）", detail:"delic（愉悦）+ -ious（形容词后缀）→ 令人愉悦的 → 美味的"},
        examples:[
          {en:"The soup tastes really <B>delicious</B>.",cn:"这汤尝起来真的很美味。"},
          {en:"She cooked a <B>delicious</B> meal for us, and everyone had a good <B>appetite</B>.",cn:"她为我们做了一顿美味的饭菜，大家胃口都很好。"},
          {en:"This <B>restaurant</B> serves the most <B>delicious</B> food in town.",cn:"这家餐馆供应镇上最美味的食物。"}
        ]
      },
      {
        word:"reservation", cn:"预订", emoji:"📅",
        ukPhonetic:"/ˌrezəˈveɪʃn/", usPhonetic:"/ˌrezərˈveɪʃn/",
        syllables:[{text:"re"},{text:"ser"},{text:"va"},{text:"tion"}],
        related:["book 预订","reserve 保留","table 餐桌","appointment 预约","confirm 确认","cancel 取消"],
        root:{text:"reserv", meaning:"保留，留存（re + servare）", detail:"re-（再）+ serv（保存）+ -ation（名词后缀）→ 保留下来的 → 预订"},
        examples:[
          {en:"I'd like to make a <B>reservation</B> for two at seven.",cn:"我想预订七点两个人的位子。"},
          {en:"Do you have a <B>reservation</B>? The <B>restaurant</B> is full tonight.",cn:"请问您有预订吗？今晚餐馆客满了。"},
          {en:"Please <B>confirm</B> your <B>reservation</B> before you come.",cn:"来之前请确认您的预订。"}
        ]
      }
    ]
  },
  {
    name:"旅行篇", emoji:"✈️",
    passage:{
      en:"During the holiday, I packed my <B>luggage</B>, took my <B>passport</B> and went to the <B>airport</B>. After the plane took off, I looked out of the window, dreaming of the beautiful <B>destination</B>. On the last day of the trip, I bought a lovely <B>souvenir</B> to remember the journey.",
      cn:"假期里，我收拾好行李，带上护照，去了机场。飞机起飞后，我望着窗外，憧憬着美丽的旅行目的地。旅行的最后一天，我买了一个可爱的纪念品来记住这段旅程。"
    },
    words:[
      {
        word:"airport", cn:"机场", emoji:"✈️",
        ukPhonetic:"/ˈeəpɔːt/", usPhonetic:"/ˈerpɔːrt/",
        syllables:[{text:"air"},{text:"port"}],
        related:["flight 航班","passport 护照","luggage 行李","ticket 机票","terminal 航站楼","board 登机"],
        root:{text:"air + port", meaning:"air（空气/航空）+ port（港口）", detail:"air（航空）+ port（港口）→ 航空港口 → 机场"},
        examples:[
          {en:"We arrived at the <B>airport</B> two hours before the <B>flight</B>.",cn:"我们在航班起飞前两小时到达机场。"},
          {en:"The <B>airport</B> is far from the city center, so we took a taxi.",cn:"机场离市中心很远，所以我们打了车。"},
          {en:"Please show your <B>passport</B> and <B>ticket</B> at the <B>airport</B>.",cn:"请在机场出示您的护照和机票。"}
        ]
      },
      {
        word:"passport", cn:"护照", emoji:"🛂",
        ukPhonetic:"/ˈpɑːspɔːt/", usPhonetic:"/ˈpæspɔːrt/",
        syllables:[{text:"pass"},{text:"port"}],
        related:["visa 签证","border 边境","customs 海关","identity 身份","travel 旅行","abroad 国外"],
        root:{text:"pass + port", meaning:"pass（通过）+ port（港口/关口）", detail:"pass（通过）+ port（港口）→ 通过关口的凭证 → 护照"},
        examples:[
          {en:"Please show me your <B>passport</B> at the <B>border</B>.",cn:"请在边境出示您的护照。"},
          {en:"I lost my <B>passport</B> during the <B>travel</B>.",cn:"旅行途中我丢了护照。"},
          {en:"You need a <B>visa</B> and a valid <B>passport</B> to go <B>abroad</B>.",cn:"出国需要签证和有效的护照。"}
        ]
      },

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),1800); }
function shuffle(a){ const r=[...a]; for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];} return r; }

/* ================= 音频 ================= */
let currentAudio = null;
let playing = false;
function stopAudio(){
  if(currentAudio){ try{currentAudio.pause();}catch(e){} currentAudio=null; }
  if(window.speechSynthesis){ try{speechSynthesis.cancel();}catch(e){} }
  playing = false;
}
function playWordAudio(word, onEnd){
  stopAudio();
  const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
  currentAudio = a;
  a.play().then(()=>{}).catch(()=>{
    speakTTS(word, onEnd);
  });
  if(onEnd) a.onended = onEnd;
}
function speakTTS(text, onEnd){
  try{
    if(!window.speechSynthesis){ toast("当前浏览器不支持发音"); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = .85;
    const voices = speechSynthesis.getVoices();
    const en = voices.find(v=>/^en(-|_)/i.test(v.lang)) || voices.find(v=>/en/i.test(v.lang));
    if(en) u.voice = en;
    if(onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  }catch(e){ toast("发音失败"); }
}
// 例句整句朗读
function speakSentence(sentence){
  stopAudio();
  const plain = sentence.replace(/<[^>]+>/g,"");
  if(window.speechSynthesis){
    const voices = speechSynthesis.getVoices();
    if(voices.some(v=>/en/i.test(v.lang))){ speakTTS(plain); return; }
  }
  speakWords(plain);
}
function speakWords(sentence){
  const wordsArr = sentence.replace(/[^\w\s']/g," ").split(/\s+/).filter(w=>w.length>0);
  let i=0;
  (function playNext(){
    if(i>=wordsArr.length) return;
    const w = wordsArr[i];
    const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(w)+"&type=2");
    currentAudio = a;
    a.onended = ()=>{ i++; playNext(); };
    a.onerror = ()=>{ i++; playNext(); };
    a.play().catch(()=>{ i++; playNext(); });
  })();
}
if(window.speechSynthesis){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }

/* ================= 音节拆分朗读 ================= */
// 播放音节分段：逐段读，高亮对应部分，最后完整读2遍
function playSyllables(wordData){
  stopAudio();
  const syls = wordData.syllables;
  const word = wordData.word;
  // 高亮所有音节段
  const sylEls = document.querySelectorAll(".word-text .syl");
  let idx = 0;
  function playSeg(){
    if(idx >= syls.length){
      // 全部读完，完整单词读2遍
      readWhole(0);
      return;
    }
    // 高亮当前段
    sylEls.forEach((el,i)=>{ el.classList.toggle("active", i===idx); });
    const seg = syls[idx].text;
    // 用 TTS 读片段（有道只能读完整单词，片段用 TTS）
    speakTTS(seg, ()=>{
      idx++;
      setTimeout(playSeg, 350);
    });
  }
  function readWhole(count){
    if(count >= 2){
      sylEls.forEach(el=>el.classList.remove("active"));
      playing = false;
      return;
    }
    // 完整单词真人发音
    const a = new Audio("https://dict.youdao.com/dictvoice?audio="+encodeURIComponent(word)+"&type=2");
    currentAudio = a;
    a.onended = ()=>readWhole(count+1);
    a.onerror = ()=>{ speakTTS(word, ()=>readWhole(count+1)); };
    a.play().catch(()=>{ speakTTS(word, ()=>readWhole(count+1)); });
  }
  playSeg();
}

/* ================= 渲染 ================= */
function renderTabs(){
  $("#groupTabs").innerHTML = GROUPS.map((g,i)=>`<div class="group-tab ${i===currentGroup?'active':''}" onclick="switchGroup(${i})">${g.emoji} ${g.name}</div>`).join("");
}
function renderSteps(){
  $("#steps").innerHTML = STEP_LABELS.map((l,i)=>{
    const cls = i===currentStep?"active":(i<currentStep?"done":"");
    return `<div class="step ${cls}" onclick="goStep(${i})">${i<currentStep?'<span class="n">✓</span>':`<span class="n">${i+1}</span>`}${l}</div>` + (i<STEP_LABELS.length-1?'<span class="step-arrow">›</span>':'');
  }).join("");
}
function updateProgress(){
  const w = words();
  if(currentStep===0){ $("#progressBar").style.width = (learnIndex/w.length*100)+"%"; }
  else if(currentStep>=1 && currentStep<STEP_LABELS.length){ $("#progressBar").style.width = (currentStep/STEP_LABELS.length*100)+"%"; }
  else { $("#progressBar").style.width = "100%"; }
}
function goStep(i){
  if(i===0) learnIndex = 0;
  currentStep = i;
  renderAll();
}
function switchGroup(i){
  currentGroup = i; currentStep=0; learnIndex=0; stopAudio();
  renderAll();
}
function renderAll(){
  renderTabs(); renderSteps(); updateProgress();
  ["learnPage","matchPage","choicePage","fillPage","spellPage","sentencePage","transPage","passagePage","resultPage"].forEach(id=>$("#"+id).classList.add("hidden"));
  stopAudio();
  if(currentStep===0) renderLearn();
  else if(currentStep===1) renderMatch();
  else if(currentStep===2) renderChoice();
  else if(currentStep===3) renderFill();
  else if(currentStep===4) renderSpell();
  else if(currentStep===5) renderSentence();
  else if(currentStep===6) renderTrans();
  else if(currentStep===7) renderPassage();
  else renderResult();
  window.scrollTo({top:0,behavior:"smooth"});
}

      <button class="btn btn-ghost" onclick="prevWord()">← 上一个</button>
      <span class="progress-info">第 ${learnIndex+1} / ${words().length} 个</span>
      <button class="btn ${learnIndex===words().length-1?'btn-primary':'btn-ghost'}" onclick="nextWord()">${learnIndex===words().length-1?'去测试 →':'下一个 →'}</button>
    </div>
  `;
  // 自动播放读音
  setTimeout(()=>playWordAudio(w.word), 300);
}
function nextWord(){ if(learnIndex<words().length-1){ learnIndex++; renderLearn(); updateProgress(); } else { goStep(1); } }
function prevWord(){ if(learnIndex>0){ learnIndex--; renderLearn(); updateProgress(); } }

/* ================= 题型1：中英连线 ================= */
let matchState = { selected:null, right:new Set() };
function renderMatch(){
  const w = words();
  matchState = { selected:null, right:new Set() };
  matchState.en = shuffle(w.map(x=>x.word));
  matchState.cn = shuffle(w.map(x=>x.cn));
  $("#matchPage").classList.remove("hidden");
  $("#matchPage").innerHTML = `
    <h2 class="page-title">🔗 题型1 · 中英连线</h2>
    <p class="page-sub">点击英文单词，再点击对应的中文释义</p>
    <div class="match-grid">
      <div class="match-col"><h3>英文</h3>${matchState.en.map((x,i)=>`<div class="match-item" id="en-${i}" onclick="matchClick('en',${i})">${x}</div>`).join("")}</div>
      <div class="match-col"><h3>中文</h3>${matchState.cn.map((x,i)=>`<div class="match-item" id="cn-${i}" onclick="matchClick('cn',${i})">${x}</div>`).join("")}</div>
    </div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(2)">跳过本题型 →</button></div>
  `;
}
function matchClick(side,i){
  if(side==="en"){
    matchState.selected = {side:"en",i};
    document.querySelectorAll(".match-item").forEach(e=>e.classList.remove("selected"));
    $("#en-"+i).classList.add("selected");
  } else {
    if(!matchState.selected || matchState.selected.side!=="en") return;
    const enIdx = matchState.selected.i;
    const enWord = matchState.en[enIdx];
    const cnWord = matchState.cn[i];
    const correct = words().find(x=>x.word===enWord)?.cn === cnWord;
    const enEl = $("#en-"+enIdx), cnEl = $("#cn-"+i);
    if(correct){ enEl.classList.remove("selected","wrong"); enEl.classList.add("right","done"); cnEl.classList.add("right","done"); matchState.right.add(enWord); toast("✅ 配对正确！"); }
    else { enEl.classList.add("wrong"); cnEl.classList.add("wrong"); setTimeout(()=>{enEl.classList.remove("wrong");cnEl.classList.remove("wrong");},400); toast("❌ 再想想～"); }
    matchState.selected = null;
    if(matchState.right.size === words().length){ setTimeout(()=>{ toast("🎉 全部配对完成！"); setTimeout(()=>goStep(2),1200); },800); }
  }
}

/* ================= 题型2：词义匹配选择 ================= */
let choiceState = { idx:0 };
function renderChoice(){
  choiceState = { idx:0 };
  renderChoiceQ();
}
function renderChoiceQ(){
  const w = words()[choiceState.idx];
  // 生成选项：正确 + 3个干扰（从其他词的中文释义取）
  const others = words().filter(x=>x.word!==w.word).map(x=>x.cn);
  const opts = shuffle([w.cn, ...shuffle(others).slice(0,3)]);
  choiceState.answer = w.cn;
  // 例句：用第一个例句，目标词加粗
  const example = w.examples[0];
  const enHtml = example.en.replace(/<B>(.*?)<\/B>/g, (m,p1)=>`<b>${p1}</b>`);
  $("#choicePage").classList.remove("hidden");
  $("#choicePage").innerHTML = `
    <h2 class="page-title">📝 题型2 · 词义匹配</h2>
    <p class="page-sub">选择句中加粗单词的正确释义</p>
    <div class="question">
      <div class="q-index">第 ${choiceState.idx+1} / ${words().length} 题</div>
      <div class="q-sentence">${enHtml}</div>
    </div>
    <div class="options">${opts.map((o,i)=>`<div class="option" onclick="answerChoice(${i},this)">${o}</div>`).join("")}</div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(3)">跳过本题型 →</button></div>
  `;
}
function answerChoice(i, el){
  const opts = el.parentElement.querySelectorAll(".option");
  const correct = el.textContent.trim() === choiceState.answer;
  if(correct){ el.classList.add("right"); toast("✅ 正确！"); }
  else { el.classList.add("wrong"); opts.forEach(o=>{ if(o.textContent.trim()===choiceState.answer) o.classList.add("right"); }); toast("❌ 正确答案已标绿"); }
  opts.forEach(o=>o.style.pointerEvents="none");
  setTimeout(()=>{
    if(choiceState.idx < words().length-1){ choiceState.idx++; renderChoiceQ(); }
    else { goStep(3); }
  }, 1200);
}

/* ================= 题型3：选词填空 ================= */
let fillState = { idx:0 };
function renderFill(){
  fillState = { idx:0 };
  renderFillQ();
}
function renderFillQ(){
  const w = words()[fillState.idx];
  // 挖空：用例句，把目标词挖掉
  const example = w.examples[0];
  const plain = example.en;
  const target = w.word;
  const sentence = plain.replace(new RegExp(target,"i"), "______");
  const sentenceHtml = plain.replace(new RegExp(target,"i"), "<b>______</b>");
  // 选项：目标词 + 干扰词（本组其他词 + 易混词）
  const distractorPool = [];
  words().forEach(x=>{ if(x.word!==w.word) distractorPool.push(x.word); });
  // 易混词补充（形近）
  const confusable = { restaurant:["rest","reservation"], menu:["memo","manual"], waiter:["water","writer"], delicious:["delicate","delight"], reservation:["preservation","observation"],
    airport:["seaport","air"], passport:["pass","port"], luggage:["baggage","language"], destination:["station","designation"], souvenir:["memory","remember"],
    teacher:["teach","reacher"], library:["liberty","literary"], subject:["object","project"], homework:["housework","work"], knowledge:["know","acknowledge"],
    family:["familiar","famous"], father:["farther","feature"], mother:["other","month"], sister:["resister","sisterly"], friend:["fiend","fried"] };
  const conf = (confusable[w.word]||[]);
  const opts = shuffle([w.word, ...shuffle(distractorPool).slice(0,2), ...conf.slice(0,1)].slice(0,4));
  fillState.answer = w.word;
  $("#fillPage").classList.remove("hidden");
  $("#fillPage").innerHTML = `
    <h2 class="page-title">✍️ 题型3 · 选词填空</h2>
    <p class="page-sub">选择正确的单词填入空格</p>
    <div class="question">
      <div class="q-index">第 ${fillState.idx+1} / ${words().length} 题 · 中文：${w.cn}</div>
      <div class="q-sentence">${sentenceHtml}</div>
    </div>
    <div class="options">${opts.map((o,i)=>`<div class="option" onclick="answerFill(${i},this)">${o}</div>`).join("")}</div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(4)">跳过本题型 →</button></div>
  `;
}
function answerFill(i, el){
  const opts = el.parentElement.querySelectorAll(".option");
  const correct = el.textContent.trim() === fillState.answer;
  if(correct){ el.classList.add("right"); toast("✅ 正确！"); }
  else { el.classList.add("wrong"); opts.forEach(o=>{ if(o.textContent.trim()===fillState.answer) o.classList.add("right"); }); toast("❌ 正确答案已标绿"); }
  opts.forEach(o=>o.style.pointerEvents="none");
  setTimeout(()=>{ if(fillState.idx<words().length-1){ fillState.idx++; renderFillQ(); } else { goStep(4); } }, 1200);
}

/* ================= 题型4：单词拼写（修复bug） ================= */
let spellState = { idx:0, slots:[], letters:[], used:new Set(), letterIndex:[] };
function renderSpell(){
  spellState = { idx:0 };
  renderSpellWord();
}
function renderSpellWord(){
  const w = words()[spellState.idx];
  spellState.slots = [];       // 已填字母序列
  spellState.letterIndex = []; // 每个已填字母对应的原始letter索引
  spellState.letters = shuffle(w.word.split(""));
  $("#spellPage").classList.remove("hidden");
  $("#spellPage").innerHTML = `
    <h2 class="page-title">🔤 题型4 · 单词拼写</h2>
    <p class="page-sub">点击字母拼出正确单词（点击已填字母可删除修改）</p>
    <div style="text-align:center">
      <div class="spell-cn">释义：${w.cn} &nbsp; <span style="color:var(--muted)">(${w.word.length} 个字母)</span></div>
      <button class="btn btn-ghost" style="padding:8px 20px;font-size:14px;margin-bottom:14px" onclick="playWordAudio('${w.word}')">🔊 听发音</button>
      <div class="answer-slots">${w.word.split("").map((_,i)=>`<div class="slot" id="slot-${i}" onclick="removeLetter(${i})"></div>`).join("")}</div>
      <div class="letters">${spellState.letters.map((ch,i)=>`<div class="letter-tile" id="lt-${i}" onclick="addLetter(${i})">${ch}</div>`).join("")}</div>
      <button class="btn btn-primary" onclick="checkSpell()">提交答案</button>
    </div>
    <div style="text-align:center;margin-top:20px"><button class="btn btn-skip" onclick="goStep(5)">跳过本题型 →</button></div>
  `;
}
function addLetter(i){
  const w = words()[spellState.idx];
  if(spellState.slots.length >= w.word.length) return;
  const ch = spellState.letters[i];
  spellState.slots.push(ch);
  spellState.letterIndex.push(i);
  $("#lt-"+i).classList.add("used");
  renderSlots();
}
function removeLetter(slotIdx){
  if(slotIdx >= spellState.slots.length) return;
  // 找到该槽位对应的字母索引并恢复
  const li = spellState.letterIndex[slotIdx];
  spellState.slots.splice(slotIdx,1);
  spellState.letterIndex.splice(slotIdx,1);
  const tile = $("#lt-"+li);
  if(tile) tile.classList.remove("used");
  renderSlots();
}
function renderSlots(){
  const w = words()[spellState.idx];
  for(let i=0;i<w.word.length;i++){
    const s = $("#slot-"+i);
    if(!s) continue;
    const ch = spellState.slots[i] || "";
    s.textContent = ch;
    s.classList.toggle("filled", !!ch);
    s.classList.remove("right","wrong");
  }
}
function checkSpell(){
  const w = words()[spellState.idx];
  const ans = spellState.slots.join("");
  if(ans.length < w.word.length){ toast("还没拼完哦"); return; }
  const slots = document.querySelectorAll("#spellPage .slot");
  if(ans === w.word){
    slots.forEach(s=>s.classList.add("right"));
    toast("✅ 拼写正确！");
    setTimeout(()=>{ if(spellState.idx<words().length-1){ spellState.idx++; renderSpellWord(); } else { goStep(5); } },900);
  } else {
    slots.forEach((s,i)=>s.classList.add(w.word[i]===ans[i]?"right":"wrong"));
    toast("❌ 拼错了，点击已填字母修改后重试");
    setTimeout(()=>{ slots.forEach(s=>s.classList.remove("right","wrong")); },1000);
  }
}

/* ================= 题型5：连词成句 ================= */
let sentenceState = { idx:0, frags:[], built:[] };
function renderSentence(){
  sentenceState = { idx:0 };
  renderSentenceQ();
}
function renderSentenceQ(){
  const w = words()[sentenceState.idx];
  const example = w.examples[0];
  const plain = example.en.replace(/<[^>]+>/g,"");
  // 拆分为碎片（按单词+标点）
  const tokens = plain.match(/[A-Za-z']+|[.,?!]/g) || [];
  sentenceState.frags = shuffle(tokens);
  sentenceState.built = [];
  sentenceState.target = tokens;
  $("#sentencePage").classList.remove("hidden");
  $("#sentencePage").innerHTML = `
    <h2 class="page-title">🧩 题型5 · 连词成句</h2>
    <p class="page-sub">点击下方碎片，按正确顺序拼出完整句子（点击已选碎片可撤回）</p>
    <div class="question">
      <div class="q-index">第 ${sentenceState.idx+1} / ${words().length} 题</div>
      <div class="q-sentence" style="color:var(--muted)">参考中文：${example.cn}</div>
    </div>
    <div class="sentence-build" id="buildArea"></div>
    <div class="sentence-frag" id="fragArea">${sentenceState.frags.map((f,i)=>`<span class="frag" id="fr-${i}" onclick="pickFrag(${i})">${f}</span>`).join("")}</div>
    <div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="checkSentence()">提交答案</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-skip" onclick="goStep(6)">跳过本题型 →</button></div>
  `;
}
function pickFrag(i){
  const f = sentenceState.frags[i];
  const fr = $("#fr-"+i);
  if(fr.classList.contains("used")) return;
  sentenceState.built.push({text:f, idx:i});
  fr.classList.add("used");
  renderBuild();
}
function renderBuild(){
  const area = $("#buildArea");
  area.innerHTML = sentenceState.built.map((b,k)=>`<span class="frag" onclick="unpickFrag(${k})">${b.text}</span>`).join("");
}
function unpickFrag(k){
  const b = sentenceState.built[k];
  sentenceState.built.splice(k,1);
  const fr = $("#fr-"+b.idx);
  if(fr) fr.classList.remove("used");
  renderBuild();
}
function checkSentence(){
  const builtStr = sentenceState.built.map(b=>b.text).join(" ");
  const targetStr = sentenceState.target.join(" ");
  const area = $("#buildArea");
  if(builtStr === targetStr){
    area.querySelectorAll(".frag").forEach(f=>f.classList.add("right"));
    toast("✅ 拼句正确！");
    setTimeout(()=>{ if(sentenceState.idx<words().length-1){ sentenceState.idx++; renderSentenceQ(); } else { goStep(6); } },1100);
  } else {
    toast("❌ 顺序不对，点击已选碎片撤回重排");
  }
}

/* ================= 题型6：句子翻译 ================= */
let transState = { idx:0 };
function renderTrans(){
  transState = { idx:0 };
  renderTransQ();
}
function renderTransQ(){
  const w = words()[transState.idx];
  const example = w.examples[0];
  transState.answer = example.en.replace(/<[^>]+>/g,"");
  $("#transPage").classList.remove("hidden");
  $("#transPage").innerHTML = `
    <h2 class="page-title">🌐 题型6 · 句子翻译</h2>
    <p class="page-sub">把下面的中文翻译成英文（运用本节课单词）</p>
    <div class="question">
      <div class="q-index">第 ${transState.idx+1} / ${words().length} 题 · 提示单词：${w.word}</div>
      <div class="q-sentence">${example.cn}</div>
    </div>
    <div class="trans-area"><textarea id="transInput" placeholder="在此输入英文翻译..."></textarea></div>
    <div style="text-align:center;margin-top:16px"><button class="btn btn-primary" onclick="checkTrans()">提交并查看答案</button></div>
    <div style="text-align:center;margin-top:14px"><button class="btn btn-skip" onclick="goStep(7)">跳过本题型 →</button></div>
  `;
}
function checkTrans(){
  const input = $("#transInput").value.trim();
  if(!input){ toast("请先输入你的翻译"); return; }
  // 简单判分：比较是否包含目标词
  const target = words()[transState.idx].word.toLowerCase();
  const hasTarget = input.toLowerCase().includes(target);
  let msg = "";
  if(hasTarget){ msg = "✅ 很好！你正确使用了目标单词 "+words()[transState.idx].word; }
  else { msg = "⚠️ 建议在句中用上目标单词 "+words()[transState.idx].word; }
  // 显示参考答案
  toast(msg);
  const area = document.querySelector("#transPage .trans-area");
  area.innerHTML = `<div style="color:var(--green);font-weight:600;margin-bottom:6px">参考答案：</div><div>${transState.answer}</div><div style="margin-top:14px"><button class="btn btn-ghost" onclick="nextTrans()">下一题 →</button></div>`;
}
function nextTrans(){
  if(transState.idx<words().length-1){ transState.idx++; renderTransQ(); } else { goStep(7); }
}
