<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻松背单词 - 中高考词汇训练</title>
<style>
  :root{
    --bg:#f6f7fb; --card:#ffffff; --primary:#4f6ef7; --primary2:#7c5cf0;
    --text:#1f2430; --muted:#8a90a3; --border:#e7e9f2;
    --green:#22c58b; --red:#ff6b6b; --amber:#ffb020; --yellow:#ffe9a8;
    --shadow:0 6px 24px rgba(70,80,130,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;-webkit-font-smoothing:antialiased}

  /* ===== 顶栏 + 左上功能按钮抽屉菜单（DeepSeek 手机版风格） ===== */
  .layout{display:flex;flex-direction:column;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:60;height:56px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;padding:0 14px}
  .menu-btn{width:42px;height:42px;border-radius:11px;border:none;background:transparent;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:.15s;flex-shrink:0}
  .menu-btn:hover{background:#f3f5fc}
  .topbar-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px}
  .topbar-brand .brand-logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;flex-shrink:0}
  .topbar-brand .brand-name{font-size:15px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
  .topbar-rank{margin-left:auto;display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:700;color:var(--text);background:#f5f6fb;border-radius:999px;padding:6px 12px;transition:.15s}
  .topbar-rank:hover{background:#eef0fb}
  .topbar-rank .rank-icon{font-size:20px;line-height:1}
  .topbar-rank .rank-pts{color:var(--amber);font-size:13px}
  .drawer-overlay{position:fixed;inset:0;background:rgba(23,26,40,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
  .drawer-overlay.show{opacity:1;pointer-events:auto}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:280px;max-width:86vw;background:#fff;z-index:80;transform:translateX(-102%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow-y:auto;padding:16px 14px;box-shadow:0 0 40px rgba(0,0,0,.18)}
  .sidebar.open{transform:translateX(0)}
  .sidebar>*{flex-shrink:0}   /* 抽屉是 flex 列且可滚动：禁止子项被压缩，避免段位卡被挤成一条 */
  .drawer-head{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 14px}
  .drawer-close{width:36px;height:36px;border-radius:10px;border:none;background:transparent;font-size:20px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .drawer-close:hover{background:#f3f5fc;color:var(--text)}
  .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
  .brand-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;font-weight:800;flex-shrink:0}
  .brand-name{font-size:17px;font-weight:800;background:linear-gradient(135deg,var(--primary),var(--primary2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:.5px}
  .brand-sub{font-size:11px;color:var(--muted);margin-top:-2px}

  .menu-label{font-size:11px;color:#b6bac7;letter-spacing:1px;padding:14px 12px 6px;text-transform:uppercase}
  .menu-group{display:flex;flex-direction:column;gap:2px}
  .menu-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;color:#5a6072;font-size:14px;transition:.15s;position:relative}
  .menu-item:hover{background:#f3f5fc;color:var(--primary)}
  .menu-item.active{background:linear-gradient(135deg,#eef1ff,#f4efff);color:var(--primary);font-weight:600}
  .menu-item.active::before{content:"";position:absolute;left:-14px;top:20%;height:60%;width:3px;border-radius:2px;background:linear-gradient(180deg,var(--primary),var(--primary2))}
  .menu-item .mi-icon{font-size:17px;width:22px;text-align:center}
  .menu-item .mi-num{width:18px;height:18px;border-radius:50%;background:#eef0f7;color:#9aa0b0;font-size:11px;display:flex;align-items:center;justify-content:center;margin-left:auto;flex-shrink:0}
  .menu-item.active .mi-num{background:var(--primary);color:#fff}
  .menu-item.done .mi-num{background:var(--green);color:#fff}

  .menu-group-tabs{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .menu-group-tab{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:10px;cursor:pointer;color:#5a6072;font-size:13.5px;transition:.15s}
  .menu-group-tab:hover{background:#f3f5fc;color:var(--primary)}
  .menu-group-tab.active{background:linear-gradient(135deg,#eef1ff,#f4efff);color:var(--primary);font-weight:600}

  .search-box{position:relative;margin:6px 0 4px}
  .search-box input{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none;font-family:inherit;transition:.15s}
  .search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.12)}
  .search-result{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);max-height:280px;overflow-y:auto;z-index:50;display:none}
  .search-result.show{display:block}
  .search-result .sr-item{padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid #f2f3f8}
  .search-result .sr-item:hover{background:#f3f5fc}
  .search-result .sr-item .sr-word{font-weight:600}
  .search-result .sr-item .sr-cn{color:var(--muted);font-size:12px;margin-left:6px}

  .sidebar-foot{margin-top:auto;padding:14px 8px 4px;font-size:11px;color:#b6bac7;border-top:1px solid var(--border)}

  .main{flex:1;min-width:0;padding:26px 30px 60px}
  .main-head{max-width:860px;margin:0 auto 18px}
  .main-title{font-size:20px;font-weight:800;margin-bottom:4px}
  .main-sub{color:var(--muted);font-size:13px}

  .progress-bar{height:6px;background:#eef0f7;border-radius:3px;overflow:hidden;margin-bottom:16px}
  .progress-bar>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .3s}

  .card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:28px;margin-bottom:20px;max-width:860px;margin-left:auto;margin-right:auto}
  h2.page-title{text-align:center;margin-bottom:6px;font-size:22px}
  .page-sub{text-align:center;color:var(--muted);margin-bottom:14px;font-size:14px}

  /* ===== 学习页（图片居中主打） ===== */
  .learn-grid{display:grid;grid-template-columns:1fr;gap:22px}
  .word-main{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .word-img{width:100%;max-width:420px;aspect-ratio:4/3;border-radius:18px;overflow:hidden;margin-bottom:18px;background:linear-gradient(135deg,#eef1ff,#f7f0ff);display:flex;align-items:center;justify-content:center}
  .word-img img{width:100%;height:100%;object-fit:cover}
  .word-img .emoji{font-size:120px;line-height:1}
  .word-info{max-width:720px;margin:0 auto;width:100%}
  .word-text{font-size:44px;font-weight:800;letter-spacing:.5px}
  .word-text .syl{cursor:pointer;border-radius:4px;padding:0 2px;transition:.15s}
  .word-text .syl.stress{color:var(--primary2);font-weight:800}
  .word-text .syl.active{background:var(--red);color:#fff}
  .word-phonetic{color:var(--muted);font-size:15px;margin:6px 0 2px}
  .word-cn{font-size:20px;font-weight:600;color:var(--primary);margin-top:8px}
  .src-tag{font-size:10px;color:var(--muted);border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:6px;font-weight:400;vertical-align:middle;background:#f5f6fa;white-space:nowrap}
  .word-def{font-size:14px;color:#3f3f46;line-height:1.75;margin:2px 0 4px}
  .word-syn{font-size:13px;color:#6366f1;margin:6px 0 2px}
  .word-stats{font-size:13px;color:#52525b;margin:2px 0 4px}
  .word-stats .stars{color:#f59e0b;letter-spacing:2px}
  .word-stats .ox-badge{color:#0f6e56;font-weight:500}
  .speak-row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .btn-speak{padding:9px 20px;border-radius:22px;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:14px;transition:.15s}
  .btn-speak:hover{background:var(--primary);color:#fff}
  .btn-speak.playing{background:var(--primary);color:#fff}
  /* 朗读语速档位切换（标准 / 快速） */
  .speed-switch{display:inline-flex;align-items:center;gap:2px;background:#f2f4fb;border:1px solid #e2e6f5;border-radius:22px;padding:3px 4px;height:38px;box-sizing:border-box}
  .speed-switch .ss-label{font-size:12px;color:var(--muted);padding:0 4px 0 8px;user-select:none}
  .speed-switch .ss-btn{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;padding:5px 12px;border-radius:16px;cursor:pointer;transition:.15s;line-height:1.4}
  .speed-switch .ss-btn:hover{color:var(--primary)}
  .speed-switch .ss-btn.on{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.28)}
  .speed-switch{vertical-align:middle}
  /* 例句区：标题与语速开关同一行 */
  .sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .sec-head h3{margin:0}
  .sec-head .speed-switch{height:32px;padding:2px 3px}
  .sec-head .ss-label{font-size:11px;padding:0 2px 0 6px}
  .sec-head .ss-btn{font-size:12px;padding:4px 10px;border-radius:14px}
  /* 短文区：与主按钮同高 */
  .speed-switch.lg{height:46px;border-radius:26px;padding:4px 6px}
  .speed-switch.lg .ss-btn{padding:7px 16px;border-radius:20px;font-size:14px}
  .passage-actions{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}

  .word-info h3{font-size:15px;color:var(--primary);margin:0 0 10px;display:flex;align-items:center;gap:6px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{padding:6px 12px;border-radius:14px;background:#f0f3ff;color:#4a5ad0;font-size:13px;border:1px solid #dfe5ff}
  .chip .cn{color:#8a90a3;font-size:12px}
  .root-box{background:#f8f9fd;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px;border-left:3px solid var(--primary2)}
  .root-box b{color:var(--primary2)}
  /* 思维导图：词根词缀中心 + 同源词发散 */
  /* ===== 单词对战 PK ===== */
  .pk-modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:16px}
  .pk-mode-card{background:linear-gradient(135deg,#f7f8ff,#fdf8ff);border:1px solid #e6e9f8;border-radius:16px;padding:18px;cursor:pointer;transition:.18s;text-align:center}
  .pk-mode-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(90,100,180,.12);border-color:#c9d0f5}
  .pk-mode-card.disabled{opacity:.62;background:#f7f8fb;border-style:dashed}
  .pk-mode-icon{font-size:30px;line-height:1.2}
  .pk-mode-name{font-size:16px;font-weight:800;margin-top:6px;color:var(--text)}
  .pk-mode-desc{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.6}
  .pk-mode-tag{margin-top:10px;display:inline-block;font-size:11.5px;color:var(--primary);background:#eef1ff;border-radius:10px;padding:2px 10px}
  .pk-rules{margin-top:18px;font-size:13px;color:#5a6072;background:#f8f9fd;border-radius:12px;padding:12px 16px;line-height:1.9}
  .pk-note{margin-top:16px;font-size:13px;line-height:1.9;color:#4a5070;background:#fff8e8;border:1px solid #ffe2b0;border-radius:12px;padding:14px 16px}
  .pk-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:16px}
  .pk-level{background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;cursor:pointer;transition:.16s}
  .pk-level:hover{border-color:var(--primary);box-shadow:0 8px 20px rgba(99,102,241,.12)}
  .pk-level-icon{font-size:26px}
  .pk-level-name{font-weight:800;margin-top:4px}
  .pk-level-desc{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6}
  .pk-duel-form{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
  .pk-duel-form input{flex:1;min-width:140px;max-width:220px;padding:11px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit}

  .pk-online-box{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
  .pk-online-col{background:#f8f9fd;border:1px solid var(--border);border-radius:14px;padding:18px;text-align:center}
  .pk-online-title{font-weight:800;margin-bottom:6px}
  .pk-online-desc{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.6}
  .pk-online-col input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:18px;text-align:center;letter-spacing:5px;font-family:inherit}
  .pk-room{text-align:center;padding:6px 0}
  .pk-room-label{font-size:13px;color:var(--muted)}
  .pk-room-code{font-size:52px;font-weight:900;letter-spacing:12px;color:var(--primary);margin:4px 0 8px}
  .pk-room-tip{font-size:13px;color:#5a6072;margin-bottom:16px;line-height:1.7}
  .pk-link{font-size:12px;letter-spacing:.5px;margin:-8px 0 14px}
  .pk-link.on{color:#2e9e6b}
  .pk-link.off{color:#9aa2b6}
  @media (max-width:640px){
    .pk-online-box{grid-template-columns:1fr}
    .pk-room-code{font-size:42px;letter-spacing:9px}
  }

  .pk-wrap{max-width:680px;margin:0 auto}
  .pk-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pk-side{flex:1;text-align:center;padding:10px;border-radius:14px;background:#f8f9fd;border:2px solid transparent;transition:.2s}
  .pk-side.right{text-align:center}
  .pk-side.active{border-color:var(--primary);background:#eef1ff}
  .pk-pname{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pk-pscore{font-size:24px;font-weight:900;color:var(--primary2);line-height:1.2}
  .pk-mid{text-align:center;min-width:92px}
  .pk-progress{font-size:12px;color:var(--muted)}
  .pk-progress b{color:var(--text);font-size:14px}
  .pk-clock{font-size:26px;font-weight:900;color:var(--primary);line-height:1.1}
  .pk-bar{height:6px;background:#eef0f8;border-radius:4px;overflow:hidden;margin:10px 0 18px}
  .pk-bar-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .1s linear}
  .pk-question{text-align:center;margin-bottom:18px}
  .pk-q-tag{font-size:12px;color:var(--muted);margin-bottom:8px}
  .pk-q-text{font-size:32px;font-weight:800;letter-spacing:.5px;color:var(--text);word-break:break-word}
  .pk-turn-tip{font-size:13px;color:var(--primary);margin-top:8px;font-weight:600}
  .pk-q-sub{font-size:12.5px;color:var(--muted);margin-top:6px}
  .pk-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pk-option{padding:16px 14px;border-radius:14px;border:1.5px solid var(--border);background:#fff;font-size:15px;font-family:inherit;cursor:pointer;transition:.15s;text-align:center;line-height:1.5}
  .pk-option:hover{border-color:var(--primary);background:#f7f8ff}
  .pk-option.right{border-color:var(--green);background:#e9f9f1;color:#128a55;font-weight:700}
  .pk-option.wrong{border-color:var(--red);background:#fdecec;color:#c0392b}
  .pk-option.locked{pointer-events:none}
  .pk-feedback{margin-top:16px;text-align:center;font-size:14px;line-height:2;min-height:28px}
  .pk-feedback .ok{color:var(--green);font-weight:700}
  .pk-feedback .no{color:var(--red);font-weight:700}
  .pk-feedback .turn{color:var(--primary);font-weight:700}
  .pk-feedback .ai-thinking{color:var(--muted);margin-left:10px}
  .pk-feedback .ai-ok{color:#128a55;margin-left:10px}
  .pk-feedback .ai-no{color:#c0392b;margin-left:10px}

  .pk-result{text-align:center;padding:10px 0}
  .pk-result-emoji{font-size:48px}
  .pk-result-title{font-size:20px;font-weight:800;margin-top:6px}
  .pk-result-score{font-size:38px;font-weight:900;color:var(--primary);margin:8px 0 2px}
  .pk-result-score b{color:var(--primary2)}
  .pk-result-names{font-size:13px;color:var(--muted)}
  .pk-stats{max-width:420px;margin:18px auto 0;background:#f8f9fd;border-radius:14px;padding:6px 16px}
  .pk-stat{display:flex;justify-content:space-between;font-size:13.5px;padding:9px 0;border-bottom:1px dashed #e8eaf5}
  .pk-stat:last-child{border-bottom:none}
  .pk-stat span{color:var(--muted)}
  .pk-stat b{color:var(--primary2);min-width:70px;text-align:right}
  .pk-stat em{font-style:normal;color:#8a90a3;min-width:70px;text-align:right}
  .pk-actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}

  @media (max-width: 640px){
    .pk-q-text{font-size:26px}
    .pk-options{grid-template-columns:1fr}
    .pk-option{padding:13px 12px;font-size:14px}
    .pk-pscore{font-size:20px}
    .pk-clock{font-size:22px}
  }

  /* ===== 人机对战：左右分屏同步作答 ===== */
  .pkd{max-width:1060px;margin:0 auto}
  .pkd-top{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
  .pkd-side{background:#f8f9fd;border:1.5px solid var(--border);border-radius:14px;padding:9px 14px;text-align:center}
  .pkd-side.ai{background:#fff8f2;border-color:#ffe3c9}
  .pkd-name{font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pkd-score{font-size:26px;font-weight:900;color:var(--primary2);line-height:1.15}
  .pkd-side.ai .pkd-score{color:#e07b39}
  .pkd-meta{font-size:11px;color:#8b91a6;white-space:nowrap}
  .pkd-meta b{color:var(--text);font-weight:700}
  .pkd-mid{text-align:center;min-width:104px}
  .pkd-idx{font-size:12px;color:var(--muted)}
  .pkd-idx b{color:var(--text);font-size:14px}
  .pkd-clock{font-size:28px;font-weight:900;color:var(--primary);line-height:1.05;font-variant-numeric:tabular-nums}
  .pkd-clock.urgent{color:var(--red);animation:qPulse .62s infinite}
  .pkd-lead{font-size:11.5px;font-weight:800;color:#8b91a6}
  .pkd-bar{height:6px;background:#eef0f8;border-radius:4px;overflow:hidden;margin:10px 0 14px}
  .pkd-bar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .1s linear}
  .pkd-split{display:grid;grid-template-columns:1fr 26px 1fr;align-items:stretch}
  .pkd-panel{background:#fbfbff;border:1.5px solid var(--border);border-radius:16px;padding:13px}
  .pkd-panel.ai{background:#fffbf7;border-color:#ffe6cf}
  .pkd-ph{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--primary);margin-bottom:6px}
  .pkd-panel.ai .pkd-ph{color:#c26a24}
  .pkd-prog{font-size:11px;font-weight:600;color:#8b91a6;white-space:nowrap}
  .pkd-q-tag{font-size:11.5px;color:var(--muted);text-align:center}
  .pkd-q-text{font-size:24px;font-weight:800;text-align:center;margin:3px 0 10px;word-break:break-word;line-height:1.25;min-height:32px}
  .pkd-panel.ai .pkd-q-text{font-size:19px;color:#6b5a48}
  .pkd-opts{display:grid;grid-template-columns:1fr;gap:7px}
  .pkd-opt{padding:9px 10px;border-radius:11px;border:1.5px solid var(--border);background:#fff;font-size:13.5px;font-family:inherit;cursor:pointer;text-align:center;line-height:1.4;transition:.13s;color:var(--text)}
  .pkd-opt:hover{border-color:var(--primary);background:#f7f8ff}
  .pkd-opt.right{border-color:var(--green);background:#e9f9f1;color:#128a55;font-weight:700}
  .pkd-opt.wrong{border-color:var(--red);background:#fdecec;color:#c0392b}
  .pkd-opt.locked{pointer-events:none}
  .pkd-panel.ai .pkd-opt{cursor:default;font-size:12.5px;padding:7px 8px;color:#7a6a58;border-color:#f0e3d4;pointer-events:none}
  .pkd-panel.ai .pkd-opt.right{border-color:var(--green);background:#eaf9f1;color:#128a55;font-weight:700}
  .pkd-panel.ai .pkd-opt.wrong{border-color:#e5a3a3;background:#fdeeee;color:#b45252}
  .pkd-fb{min-height:22px;margin-top:9px;text-align:center;font-size:12.5px;font-weight:700}
  .pkd-fb .ok{color:#128a55}
  .pkd-fb .no{color:#c0392b}
  .pkd-fb .wait{color:#a08a72;font-weight:600}
  .pkd-divider{display:flex;align-items:center;justify-content:center;position:relative}
  .pkd-divider::before{content:"";position:absolute;top:6px;bottom:6px;width:1px;background:linear-gradient(#e9ecf7,#dfe4f6,#e9ecf7)}
  .pkd-divider span{position:relative;background:#fff;border:1px solid var(--border);color:#9aa0b6;font-size:10px;font-weight:800;border-radius:99px;padding:2px 6px;z-index:1}
  @media (max-width:860px){
    .pkd-top{grid-template-columns:1fr 1fr;gap:8px}
    .pkd-mid{grid-column:1 / -1;order:-1}
    .pkd-split{grid-template-columns:1fr}
    .pkd-divider{height:20px}
    .pkd-divider::before{display:none}
    .pkd-q-text{font-size:21px}
    .pkd-panel.ai .pkd-q-text{font-size:18px}
  }

  /* ===== 词汇发散：词根拆解 + 词族折叠卡 ===== */
  .vf-card{background:#fbfbff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;margin-bottom:16px}
  .vf-sec + .vf-sec{margin-top:14px;padding-top:13px;border-top:1px dashed #e8eaf5}
  .vf-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--primary);margin-bottom:10px}
  .vf-title .vf-num{font-size:12px;font-weight:500;color:var(--muted)}
  .vf-parts{display:flex;flex-wrap:wrap;gap:8px 18px}
  .vf-part{display:inline-flex;align-items:baseline;gap:6px;font-size:13.5px;color:#4a5070}
  .vf-part code{font-family:inherit;font-weight:800;color:var(--primary2);font-size:14px}
  .vf-tag{font-size:11px;background:#eef0fb;color:#6b72a8;border-radius:6px;padding:1px 6px;line-height:1.6}
  .vf-eq{margin-top:10px;font-size:13.5px;color:#41476b;background:#f2f4ff;border-left:3px solid var(--primary);border-radius:0 8px 8px 0;padding:9px 12px;line-height:1.85}
  .vf-eq b{color:var(--primary2)}
  .fam-list{display:flex;flex-direction:column}
  .fam-item{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px dashed #eef0f6;font-size:13.5px}
  .fam-item:last-child{border-bottom:none}
  .fam-list.collapsed .fam-extra{display:none}
  .fam-w{font-weight:700;color:var(--text);min-width:104px}
  .fam-ph{color:#8a90a3;font-size:12.5px;min-width:110px}
  .fam-cn{color:#555;flex:1;line-height:1.7}
  .fam-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:10px;border:1px solid var(--border);background:#fff;color:var(--primary);font-size:13px;padding:6px 16px;border-radius:16px;cursor:pointer;transition:.15s}
  .fam-toggle:hover{background:#eef1ff}
  .syn-group{display:flex;flex-direction:column;gap:2px}
  .syn-row{display:flex;gap:10px;font-size:13.5px;line-height:1.85;padding:4px 0}
  .syn-w{font-weight:700;color:var(--primary2);min-width:104px}
  .syn-d{flex:1;color:#4a5070}
  /* 手机端：单词/音标一行，释义另起一行，避免逐字折行 */
  @media (max-width: 640px){
    .vf-card{padding:14px 14px}
    .fam-item{flex-wrap:wrap;gap:2px 8px;padding:9px 0}
    .fam-w{min-width:0;flex:1 1 100%}
    .fam-ph{min-width:0;flex:0 0 auto}
    .fam-cn{flex:1 1 100%;margin-top:2px}
    .syn-row{flex-wrap:wrap;gap:2px 8px}
    .syn-w{min-width:0;flex:1 1 100%}
    .vf-parts{gap:6px 14px}
    .vf-eq{font-size:13px;line-height:1.8}
  }
  .example{margin-bottom:10px;padding:10px 14px;border-radius:12px;background:#fbfbfe;border:1px solid var(--border)}
  .example .en{font-weight:600;font-size:15px}
  .example .en b{color:var(--primary)}
  .example .cn{color:var(--muted);font-size:13px}
  .ex-speak{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;border:1px solid var(--primary);background:#fff;color:var(--primary);cursor:pointer;font-size:13px;margin-right:8px;vertical-align:middle;transition:.15s;padding:0;line-height:1}
  .ex-speak:hover{background:var(--primary);color:#fff}

  .nav-btns{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .btn{padding:12px 26px;border-radius:26px;border:none;cursor:pointer;font-size:15px;font-weight:600;transition:.2s}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(79,110,247,.35)}
  .btn-ghost{background:#fff;border:1px solid var(--border);color:var(--text)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
  .btn-skip{background:#fff;border:1px dashed #c4c9d8;color:var(--muted);font-size:13px;padding:10px 18px}
  .progress-info{color:var(--muted);font-size:14px}

  /* ===== 题型通用 ===== */
  .question{background:#fbfbfe;border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
  .q-index{font-size:13px;color:var(--muted);margin-bottom:6px}
  .q-sentence{font-size:17px;font-weight:500;line-height:1.8}
  /* 报刊例句的来源标注 */
  .q-src{font-size:12px;color:var(--muted);margin-top:8px;letter-spacing:.3px}
  .ps-src{display:inline-block;margin-left:8px;font-size:11px;color:#8a90a3;background:#f0f2f8;border-radius:8px;padding:1px 7px;vertical-align:2px}
  .q-sentence b{color:var(--primary);font-weight:700}
  .q-sentence .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .option{padding:12px 16px;border-radius:12px;background:#fff;border:2px solid var(--border);cursor:pointer;font-size:15px;text-align:center;transition:.15s;user-select:none}
  .option:hover{border-color:var(--primary)}
  .option.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .option.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连线 */
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .match-col{display:flex;flex-direction:column;gap:12px}
  .match-col h3{text-align:center;font-size:15px;color:var(--muted);margin-bottom:4px}
  .match-item{padding:14px 16px;border-radius:14px;background:#fbfbfe;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:16px;font-weight:600;transition:.15s;user-select:none}
  .match-item:hover{border-color:var(--primary)}
  .match-item.selected{border-color:var(--primary);background:#eef2ff}
  .match-item.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .match-item.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}
  .match-item.done{opacity:.4;pointer-events:none}

  /* 拼写 */
  .spell-word{font-size:20px;font-weight:700;margin-bottom:6px}
  .spell-cn{color:var(--muted);margin-bottom:14px}
  .letters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;min-height:44px}
  .letter-tile{padding:12px 16px;border-radius:12px;background:linear-gradient(135deg,#f0f3ff,#eef0ff);border:1px solid #dfe5ff;cursor:pointer;font-size:18px;font-weight:700;min-width:44px;text-align:center;transition:.15s;user-select:none}
  .letter-tile:hover{transform:translateY(-2px)}
  .letter-tile.used{opacity:.25;pointer-events:none}
  .answer-slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:20px;min-height:48px}
  .slot{width:48px;height:48px;border-radius:12px;border:2px dashed #c4c9d8;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;cursor:pointer;background:#fff}
  .slot.filled{border-style:solid;border-color:var(--primary);background:#f7f9ff}
  .slot.fixed{border-style:solid;border-color:#e3e6f0;background:#f5f6fa;color:#7c8398;cursor:default;font-size:18px;font-weight:600}
  .slot.right{border-color:var(--green);background:#e9fbf4;color:var(--green)}
  .slot.wrong{border-color:var(--red);background:#ffeef0;color:var(--red)}

  /* 连词成句 */
  .sentence-frag{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px;min-height:44px}
  .frag{padding:10px 16px;border-radius:12px;background:#f0f3ff;border:1px solid #dfe5ff;cursor:pointer;font-size:15px;font-weight:600;transition:.15s;user-select:none}
  .frag.used{opacity:.25;pointer-events:none}
  .sentence-build{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;border:2px dashed #dfe5ff;border-radius:12px;padding:12px;margin-bottom:16px}
  .sentence-build .frag{background:#fff;border:1px solid var(--primary)}
  .sentence-build .frag.right{background:#e9fbf4;border-color:var(--green);color:var(--green)}

  /* 翻译 */
  .trans-area textarea{width:100%;min-height:88px;border:1px solid var(--border);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;resize:vertical}

  /* 语篇 */
  .passage{font-size:16px;line-height:2.1;background:#fbfbfe;border-radius:14px;padding:20px;border:1px solid var(--border);margin-bottom:16px}
  /* 篇章研读：AI 短文 */
  .passage-skeleton{display:flex;flex-direction:column;gap:12px;min-height:180px}
  .sk-line{height:12px;border-radius:6px;background:linear-gradient(90deg,#eef0f8 25%,#f7f8fd 37%,#eef0f8 63%);background-size:400% 100%;animation:skmove 1.4s ease infinite}
  .sk-line.short{width:62%}
  @keyframes skmove{0%{background-position:100% 50%}100%{background-position:0 50%}}
  .ps-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:2px 0 12px}
  .ps-title{font-size:20px;font-weight:800;color:var(--text);letter-spacing:.2px}
  .ps-meta{font-size:13px;color:var(--muted)}
  .ps-meta b{color:var(--primary)}
  .ps-chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
  .ps-chip{font-size:12px;border-radius:10px;padding:3px 9px;background:#eef1ff;color:#4a5ad0;border:1px solid #dfe5ff}
  .ps-chip.miss{background:#f4f5f8;color:#9aa0b4;border-color:#e8eaf2;text-decoration:line-through}
  .ps-tip{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.7}
  .passage-cn{background:#fbfbfe;border:1px dashed var(--border);border-radius:14px;padding:14px 18px;font-size:14px;line-height:2;color:#4a5070;margin-bottom:12px}
  @media (max-width: 640px){
    .ps-title{font-size:17px}
    .passage{font-size:15px;line-height:1.95;padding:16px}
  }
  .passage .hl{background:var(--yellow);border-radius:3px;padding:0 3px;font-weight:700}
  .passage-trans{margin-top:14px;padding-top:14px;border-top:1px dashed var(--border);color:var(--muted);font-size:14px}
  .blank{display:inline-block;min-width:80px;border-bottom:2px solid var(--primary);text-align:center;padding:0 6px;margin:0 3px;color:var(--primary);font-weight:700;cursor:pointer}
  .blank.filled{color:var(--green)}
  .option-chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:18px}
  .opt-chip{padding:10px 18px;border-radius:20px;background:#fff;border:1px solid var(--border);cursor:pointer;font-size:15px;font-weight:600;transition:.15s}
  .opt-chip:hover{border-color:var(--primary);color:var(--primary)}
  .opt-chip.used{opacity:.3;pointer-events:none}
  .opt-chip.selected{border-color:var(--primary);color:var(--primary)}

  /* 结果 */
  .result-box{text-align:center;padding:40px 20px}
  .result-emoji{font-size:72px}
  .result-score{font-size:48px;font-weight:800;margin:10px 0}
  .result-msg{color:var(--muted);margin-bottom:24px}

  .hidden{display:none!important}
  .toast{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:#1f2430;color:#fff;padding:12px 22px;border-radius:26px;font-size:14px;opacity:0;transition:.3s;z-index:99;pointer-events:none}
  .toast.show{opacity:1}

  /* ===== 复习巩固模块样式 ===== */
  .empty-state{text-align:center;padding:48px 20px}
  .empty-emoji{font-size:52px;margin-bottom:14px}
  .empty-title{font-size:18px;font-weight:600;color:#333;margin-bottom:6px}
  .empty-desc{color:#999;font-size:14px}
  .review-card{background:#f8f9fd;border-radius:16px;padding:34px 20px;text-align:center;margin:20px 0}
  .rc-word{font-size:42px;font-weight:700;margin-bottom:8px;letter-spacing:.5px}
  .rc-hint{color:#aaa;font-size:13px;margin-bottom:16px}
  .rc-cn{font-size:22px;color:var(--primary2);font-weight:600;margin:12px 0}
  .review-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .btn-ghost{background:#f0f1f5;color:#444}
  .btn-mini{padding:5px 12px;font-size:13px;border-radius:8px}
  .wrong-list,.deck-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .wrong-item,.deck-item{display:flex;align-items:center;gap:12px;background:#f8f9fd;border-radius:12px;padding:12px 16px}
  .deck-item{cursor:pointer;border:1px solid transparent}
  .deck-item.active{border-color:var(--primary2);background:#f0f1ff}
  .wi-word{font-weight:600;font-size:17px}
  .wi-cn{color:#999;font-size:13px;margin-left:8px}
  .wi-count{color:var(--red);font-size:12px;margin-left:auto;white-space:nowrap}
  .wi-actions{display:flex;gap:6px}
  .di-name{font-weight:600}
  .di-count{color:#999;font-size:13px;margin-left:auto}
  .deck-create{margin-top:18px;text-align:center}
  #deckName,#deckWords{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:10px;font-family:inherit}
  #deckWords{resize:vertical}
  .btn-danger{background:var(--red);color:#fff}
  /* ===== 词库导入 / 备份 ===== */
  .import-panel{margin-top:20px;background:linear-gradient(135deg,#f6f7ff,#fdf7ff);border:1px solid #e6e8f8;border-radius:16px;padding:16px 18px;text-align:center}
  .import-title{font-size:14px;font-weight:700;color:var(--primary);margin-bottom:12px}
  .import-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .import-btns .btn{padding:10px 22px;font-size:14px}
  .import-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.7}
  .backup-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px dashed var(--border)}
  .backup-note{font-size:12px;color:var(--muted);line-height:1.6;flex:1;min-width:200px}
  .mi-count{background:var(--primary);color:#fff;font-size:11px;border-radius:9px;padding:0 6px;margin-left:auto;line-height:18px}
  /* 导入预览弹窗 */
  .modal-mask{position:fixed;inset:0;background:rgba(20,24,40,.45);display:flex;align-items:center;justify-content:center;z-index:300;padding:18px}
  .modal-box{background:#fff;border-radius:18px;width:100%;max-width:540px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(30,40,80,.25)}
  .modal-head{padding:16px 20px;border-bottom:1px solid var(--border);font-weight:700;font-size:15px;color:var(--text)}
  .modal-body{padding:16px 20px;overflow:auto;font-size:14px}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .preview-sum{margin-bottom:12px;color:var(--text)}
  .preview-sum b{color:var(--primary)}
  .preview-list{background:#f8f9fd;border-radius:12px;padding:8px 12px;max-height:220px;overflow:auto}
  .preview-row{display:flex;gap:12px;padding:6px 0;border-bottom:1px dashed #eceef6;font-size:13px}
  .preview-row:last-child{border-bottom:none}
  .preview-row b{min-width:110px;color:var(--primary)}
  .preview-row span{color:#666;flex:1}
  .preview-more{font-size:12px;color:var(--muted);padding:8px 0 2px}
  .preview-label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  #importDeckName{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px;font-family:inherit}

  /* ===== 游戏化激励：段位卡 / 积分 / 消消乐 / 成就 ===== */
  .rank-card{background:linear-gradient(135deg,#2b2f4a,#3d3566);border-radius:16px;padding:16px 14px;margin:6px 4px 2px;color:#fff;position:relative;overflow:hidden}
  .rank-card::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%)}
  .rank-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .rank-icon{font-size:34px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
  .rank-name{font-size:16px;font-weight:800;letter-spacing:.5px}
  .rank-pts{font-size:12px;color:#c9c4e8;margin-top:1px}
  .rank-pts b{color:#ffd76a;font-size:14px}
  .rank-bar{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
  .rank-bar>div{height:100%;background:linear-gradient(90deg,#ffd76a,#ff9a5a);border-radius:3px;transition:width .5s}
  .rank-next{font-size:11px;color:#b7b2d8;margin-top:5px}
  .rank-next b{color:#fff}
  .rank-up{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;background:rgba(20,22,40,.75);font-weight:800;font-size:15px;opacity:0;pointer-events:none;transition:.3s;z-index:2}
  .rank-up.show{opacity:1}

  .bomb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
  .bomb-cell{padding:14px 10px;border-radius:14px;background:#fbfbfe;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:15px;font-weight:600;transition:.18s;user-select:none;min-height:52px;display:flex;align-items:center;justify-content:center;overflow-wrap:break-word;word-break:normal;line-height:1.35}
  .bomb-cell.en{background:linear-gradient(135deg,#eef2ff,#e7ecff);border-color:#dbe2ff;color:#3a4bb8}
  .bomb-cell.cn{background:linear-gradient(135deg,#fff6ec,#fff0e6);border-color:#ffe0c4;color:#c0691f}
  .bomb-cell:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.10)}
  .bomb-cell.selected{transform:translateY(-2px) scale(1.04);border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.22)}
  .bomb-cell.right{animation:bombPop .4s forwards}
  .bomb-cell.wrong{animation:bombShake .4s;border-color:var(--red);background:#ffeef0;color:var(--red)}
  .bomb-cell.cleared{opacity:.16;pointer-events:none;transform:scale(.82);border-color:var(--green)}
  @keyframes bombPop{0%{transform:scale(1)}40%{transform:scale(1.12);border-color:var(--green);background:#e9fbf4;color:var(--green)}100%{transform:scale(.82);opacity:.16}}
  @keyframes bombShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
  .bomb-hud{display:flex;justify-content:center;gap:18px;align-items:center;margin-bottom:4px;color:var(--muted);font-size:14px}
  .bomb-hud b{color:var(--primary);font-size:16px}

  .ach-rank{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#2b2f4a,#3d3566);border-radius:18px;padding:24px;color:#fff;margin-bottom:20px}
  .ach-rank .rank-icon{font-size:52px}
  .ach-rank .rank-name{font-size:22px}
  .ach-pts{font-size:13px;color:#c9c4e8;margin-top:2px}
  .badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:8px}
  .badge{background:#f8f9fd;border:2px solid var(--border);border-radius:16px;padding:18px 10px;text-align:center;transition:.2s}
  .badge.unlocked{border-color:#ffe3a8;background:linear-gradient(160deg,#fffbf0,#fff6e2);box-shadow:0 4px 14px rgba(255,176,32,.18)}
  .badge.locked{opacity:.5;filter:grayscale(.7)}
  .badge .bd-icon{font-size:36px;line-height:1;margin-bottom:8px}
  .badge .bd-name{font-size:14px;font-weight:700}
  .badge .bd-min{font-size:11px;color:#999;margin-top:3px}
  .rule-box{background:#f8f9fd;border-radius:14px;padding:16px 18px;margin-top:8px;font-size:13px;color:#555;line-height:2}
  .rule-box b{color:var(--primary)}
  .pts-float{position:fixed;z-index:120;font-weight:800;font-size:15px;color:var(--amber);pointer-events:none;animation:ptsFloat 1s forwards}
  @keyframes ptsFloat{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(-34px)}}

  /* ===== 返回栏 / 页面跳转 ===== */
  .back-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:32px}
  .back-btn{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;cursor:pointer;transition:.16s}
  .back-btn:hover{border-color:var(--primary);color:var(--primary);background:#f7f8ff}
  .back-hint{font-size:12px;color:var(--muted)}
  .btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
  .btn:disabled:hover{transform:none;box-shadow:none}

  /* ===== 段位体系（多层级） ===== */
  .rank-streak{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#ffd76a;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:middle}
  .ach-bar{height:8px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-top:10px}
  .ach-bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffd76a,#ff9a5a);border-radius:4px;transition:width .6s}
  .ach-next{font-size:11.5px;color:#b7b2d8;margin-top:6px}
  .ach-next b{color:#fff}
  .ach-dims{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
  .ach-dim{background:#f8f9fd;border:1px solid var(--border);border-radius:14px;padding:14px 12px;text-align:center}
  .ach-dim .ad-icon{font-size:22px;line-height:1.2}
  .ach-dim .ad-label{font-size:12px;color:var(--muted);margin-top:4px}
  .ach-dim .ad-val{font-size:17px;font-weight:800;color:var(--text);margin-top:2px}
  .ach-dim .ad-sub{font-size:11.5px;color:var(--primary);margin-top:4px}
  .ach-dim .ad-bar{height:4px;background:#e9ecf6;border-radius:3px;overflow:hidden;margin-top:8px}
  .ach-dim .ad-bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));border-radius:3px}
  .rank-ladder{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .rl-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;background:#fbfbfe;border:1px solid #eef0f6;font-size:13px}
  .rl-row .rl-icon{font-size:17px;width:24px;text-align:center}
  .rl-row .rl-name{font-weight:700;color:var(--text);min-width:104px}
  .rl-row .rl-range{margin-left:auto;color:var(--muted);font-size:12px}
  .rl-row.done{background:#f5fbf7;border-color:#dff2e6}
  .rl-row.done .rl-name{color:#2f8f5b}
  .rl-row.now{background:linear-gradient(135deg,#eef2ff,#f6f0ff);border-color:#c9d2f7;box-shadow:0 4px 12px rgba(99,102,241,.12)}
  .rl-row.now .rl-name{color:var(--primary2)}
  .rl-row.now .rl-range{color:var(--primary);font-weight:700}
  .rl-row.lock{opacity:.62}
  .rl-tag{font-size:10.5px;border-radius:7px;padding:0 6px;line-height:1.7;background:#eef0fb;color:#6b72a8}
  .rl-row.now .rl-tag{background:var(--primary);color:#fff}
  .rl-row.done .rl-tag{background:#e2f5ea;color:#2f8f5b}
  .rank-note{font-size:12px;color:var(--muted);line-height:1.9;margin-top:10px}

  @media(max-width:720px){
    .learn-grid,.match-grid,.options{grid-template-columns:1fr}
    .word-text{font-size:32px}
    .topbar{height:50px;padding:0 10px}
    .main{padding:18px 14px 50px}
    .bomb-grid{grid-template-columns:repeat(2,1fr)}
    .badge-grid{grid-template-columns:repeat(2,1fr)}
    .ach-dims{grid-template-columns:1fr;gap:8px}
    .ach-dim{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;text-align:left;padding:11px 14px}
    .ach-dim .ad-label{margin-top:0;min-width:52px}
    .ach-dim .ad-val{margin-top:0;margin-left:auto;font-size:16px}
    .ach-dim .ad-sub{flex:1 1 100%;margin-top:0;padding-left:32px}
    .ach-dim .ad-bar{display:none}
    .rl-row{padding:8px 10px;gap:8px}
    .rl-row .rl-name{min-width:0;flex:1;font-size:12.5px}
    .rl-row .rl-range{font-size:11px}
    .nav-btns{flex-wrap:wrap;gap:8px}
    .nav-btns .progress-info{order:-1;flex:1 1 100%;text-align:center;margin-bottom:4px}
  }

  /* ===== 词汇认知页：左侧固定配图 + 词族导图，右侧主视觉（音标 / 发音 / 音节朗读） ===== */
  /* 学习页要一屏放下，去掉卡片下边距并收紧主区底部留白 */
  #learnPage{margin-bottom:0}
  .main:has(#learnPage:not(.hidden)){padding-bottom:24px}
  .learn-grid{display:grid;grid-template-columns:296px minmax(0,1fr);gap:26px;align-items:start}
  .learn-side{min-width:0;display:flex;flex-direction:column;align-items:center}
  /* 配图缩小后固定在侧边，不再抢占主视觉 */
  .word-img{position:relative;width:100%;max-width:248px;aspect-ratio:4/3;border-radius:16px;overflow:hidden;margin:0 0 14px;background:linear-gradient(135deg,#eef1ff,#f7f0ff);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(70,80,130,.10)}
  .word-img img{width:100%;height:100%;object-fit:cover}
  .word-img .emoji{font-size:56px;line-height:1}

  /* 词族思维导图：根节点在上，同源词按两列铺开，连线由 SVG 画 */
  .mm2{position:relative;width:100%;height:196px;min-width:0}
  .mm2-cap{position:absolute;right:2px;top:-3px;font-size:10px;letter-spacing:.5px;color:#b3b9cc}
  .mm2-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .mm2-lines path{fill:none;stroke:#ccd3f4;stroke-width:1.4;stroke-dasharray:3 4}
  .mm2-root{position:absolute;left:50%;top:9px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:4px 13px;border-radius:999px;font-weight:800;font-size:12.5px;box-shadow:0 5px 12px rgba(79,110,247,.28);white-space:nowrap;z-index:2}
  .mm2-root em{font-style:normal;font-size:10.5px;font-weight:600;opacity:.9;background:rgba(255,255,255,.22);border-radius:6px;padding:0 5px}
  .mm2-node{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:11px;padding:5px 9px;text-align:center;border:1.5px solid #e3e8ff;box-shadow:0 2px 8px rgba(70,80,130,.07);transition:.15s;max-width:126px;cursor:pointer;z-index:2}
  .mm2-node:hover{border-color:var(--primary);box-shadow:0 6px 14px rgba(79,110,247,.16);z-index:3}
  .mm2-node .n-en{font-size:11.5px;font-weight:800;line-height:1.2;color:var(--text);overflow-wrap:break-word}
  .mm2-node .n-cn{font-size:10px;color:var(--muted);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .mm2-empty{position:absolute;left:0;right:0;top:70px;text-align:center;font-size:12px;color:var(--muted)}

  /* 右栏主视觉 */
  .learn-main{min-width:0;text-align:left}
  .word-hero{border:1px solid #e8ebf9;background:linear-gradient(135deg,#fafbff,#fdf9ff);border-radius:18px;padding:12px 16px 14px}
  .hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:#9aa0b6;letter-spacing:.4px}
  .hero-top b{color:var(--primary);font-size:11.5px;letter-spacing:0}
  .word-line{display:flex;align-items:center;gap:10px;margin:2px 0 0}
  .word-text{font-size:40px;font-weight:800;letter-spacing:.5px;line-height:1.18;word-break:break-word;flex:1;min-width:0}
  .word-text .syl{cursor:pointer;border-radius:6px;padding:0 2px;transition:.14s}
  /* 音节之间加一个词典式的间隔点（ge·og·ra·phy）。用 CSS 生成，不进文本内容，
     复制/拼写题/朗读切分都不受影响 */
  .word-text .syl + .syl::before{content:"·";color:#c3c9dd;font-weight:400;margin:0 1px}
  /* 短语/连字符词（look after、ice-cream）自带分隔符，不再额外加间隔点 */
  .word-text .syl.noseq::before{content:none;margin:0}
  .word-text .syl:hover{background:#eef1ff;color:var(--primary)}
  .word-text .syl.stress{color:var(--primary2);font-weight:800}
  .word-text .syl.active{background:var(--red);color:#fff}
  .word-text .syl.active::before{color:#f3b4b4}
  /* 长词（15 字母以上）降一档字号，避免加音节点后被迫换行、把一屏顶出去 */
  .word-text.long{font-size:31px;line-height:1.26}
  .word-play{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:18px;box-shadow:0 6px 16px rgba(79,110,247,.32);transition:.16s}
  .word-play:hover{transform:scale(1.06)}
  .word-play.on{animation:qPulse 1s infinite}
  .word-phonetic{color:#7b83a0;font-size:14px;margin:3px 0 0}
  .learn-main .word-cn{font-size:18px;margin-top:8px;line-height:1.5;font-weight:600;color:var(--primary)}

  /* 音节朗读条 */
  .syl-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
  .syl-bar .syl-hint{font-size:11.5px;color:#a3a9bd}
  .learn-main .btn-speak{padding:6px 14px;font-size:12.5px;border-radius:18px}
  .learn-main .btn-speak.solid{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;border-color:transparent}
  .learn-main .btn-speak.solid:hover{filter:brightness(1.06)}

  .badge-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:9px;font-size:12px;color:var(--muted)}
  .badge-row .bd{background:#f5f6fa;border:1px solid var(--border);border-radius:6px;padding:2px 7px;white-space:nowrap}
  .badge-row .stars{color:#f59e0b;letter-spacing:1px}
  .badge-row .ox-badge{color:#0f6e56;font-weight:600}

  .learn-main details.word-def{margin-top:7px;font-size:13px}
  .learn-main details.word-def>summary{cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none;outline:none}
  .learn-main details.word-def>summary::-webkit-details-marker{display:none}
  .learn-main details.word-def>summary:before{content:"▸ ";color:var(--primary)}
  .learn-main details.word-def[open]>summary:before{content:"▾ "}
  .learn-main details.word-def .word-def{font-size:13px;line-height:1.65;margin-top:4px}

  /* 例句卡片 */
  .ex-list{display:flex;flex-direction:column;gap:6px;margin-top:5px}
  .example{padding:7px 10px;border-radius:11px;background:#fafbff;border:1px solid #eef0f9}
  /* 列表本身有 gap，卡片再留下边距会白白多占一屏高度（长句正好卡在 900px） */
  .learn-main .example{margin-bottom:0}
  .example .en{font-size:13px;line-height:1.52;display:flex;gap:7px;align-items:flex-start}
  .example .en b{color:var(--primary);font-weight:800}
  .example .cn{font-size:11.5px;color:var(--muted);margin-top:1px;line-height:1.45}
  .example .ex-src{display:inline-block;font-size:10px;color:#8a8fa3;background:#eef1fa;border-radius:5px;padding:0 5px;margin-top:3px;white-space:nowrap}
  .example .ex-src .ex-badge{display:inline-block;font-style:normal;font-size:9.5px;font-weight:800;color:#c0392b;background:#ffe9e7;border-radius:3px;padding:0 3px;margin-right:4px;letter-spacing:.3px}
  .example .ex-src .ex-badge-manual{color:#3b5bdb;background:#e7ecff}

  /* 例句译文：默认收起，点「显示翻译」才在英文下面出现（先猜后译，不提前剧透） */
  .example .cn{display:none}
  .ex-list.show-cn .example .cn{display:block}
  .ex-trans-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--border);background:#fff;color:var(--primary);font-size:11.5px;font-weight:700;border-radius:14px;padding:3px 10px;cursor:pointer;transition:.15s;font-family:inherit;white-space:nowrap}
  .ex-trans-btn:hover{background:#f3f6ff;border-color:var(--primary)}
  .ex-trans-btn.on{background:#eef2ff;border-color:var(--primary);color:var(--primary2)}

  /* 例句里每个单词都可点：点一下弹释义卡 */
  .example .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .12s}
  .example .w:hover{background:#e9eeff;color:var(--primary)}
  .example .w.on{background:#dfe6ff;color:var(--primary2)}

  /* 音节拆分：默认不拆，点「逐段朗读」后才展开，位置在完整单词正下方 */
  .syl-split{display:flex;align-items:center;flex-wrap:wrap;gap:3px;margin:5px 0 0;padding:4px 10px;border-radius:10px;background:#f6f8ff;border:1px dashed #d8e0ff;font-size:21px;font-weight:800;line-height:1.3;animation:sylIn .2s ease-out}
  .syl-split .syl{cursor:pointer;padding:0 2px;border-radius:6px;transition:.14s;color:var(--text)}
  .syl-split .syl + .syl::before{content:"·";color:#b9c0d6;font-weight:400;margin:0 2px}
  .syl-split .syl.noseq::before{content:none;margin:0}
  .syl-split .syl:hover{background:#e9eeff;color:var(--primary)}
  .syl-split .syl.stress{color:var(--primary2)}
  .syl-split .syl.active{background:var(--red);color:#fff}
  .syl-split .syl.active::before{color:#f3b4b4}
  .syl-split .split-tip{font-size:11px;font-weight:400;color:#a6acbf;margin-left:auto;white-space:nowrap}
  @keyframes sylIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

  /* 例句单词点读卡 */
  .word-pop{position:fixed;z-index:320;width:min(300px,86vw);background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(30,40,80,.22);border:1px solid #e8ebf9;padding:12px 14px 12px;font-size:13px;animation:popIn .14s ease-out}
  .word-pop .wp-head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-right:14px}
  .word-pop .wp-word{font-size:20px;font-weight:800;color:var(--text)}
  .word-pop .wp-ph{font-size:12px;color:#7b83a0}
  .word-pop .wp-cn{margin-top:6px;line-height:1.6;color:#41485f;max-height:86px;overflow:auto}
  .word-pop .wp-wait{color:#a8aec2}
  .word-pop .wp-more{font-size:11.5px;color:var(--primary);margin-top:4px;cursor:pointer;text-decoration:none}
  .word-pop .wp-acts{display:flex;gap:8px;margin-top:10px}
  .word-pop .wp-btn{flex:1;border:none;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .word-pop .wp-say{background:#eef2ff;color:var(--primary)}
  .word-pop .wp-say:hover{background:#e2e9ff}
  .word-pop .wp-go{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff}
  .word-pop .wp-go:disabled{background:#e8eaf3;color:#a8aec2;cursor:not-allowed}
  .word-pop .wp-close{position:absolute;right:6px;top:3px;border:none;background:none;font-size:14px;color:#b6bccd;cursor:pointer;line-height:1}
  @keyframes popIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ===== 账号（邮箱验证码注册 / 登录） ===== */
  .acct-avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
  .auth-tabs{display:flex;gap:6px;margin-bottom:14px;background:#f2f4fa;border-radius:12px;padding:4px}
  .auth-tab{flex:1;border:none;background:none;padding:8px 0;border-radius:9px;font-size:13.5px;font-weight:700;color:#7a819a;cursor:pointer;font-family:inherit;transition:.15s}
  .auth-tab.on{background:#fff;color:var(--primary);box-shadow:0 2px 8px rgba(70,80,130,.10)}
  .auth-field{margin-bottom:11px}
  .auth-field label{display:block;font-size:12px;color:#7a819a;margin-bottom:5px}
  .auth-field input{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;font-size:14px;font-family:inherit;outline:none;transition:.15s;background:#fff;color:var(--text)}
  .auth-field input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(79,110,247,.10)}
  .auth-row{display:flex;gap:8px;align-items:stretch}
  .auth-row input{flex:1;min-width:0}
  .auth-code-btn{flex:0 0 auto;border:1.5px solid var(--primary);background:#fff;color:var(--primary);font-size:12.5px;font-weight:700;border-radius:10px;padding:0 14px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .auth-code-btn:disabled{border-color:#dfe3ef;color:#a8aec2;cursor:not-allowed;background:#f7f8fc}
  .auth-msg{font-size:12.5px;line-height:1.5;margin:2px 0 10px;min-height:18px}
  .auth-msg.err{color:#d64545}
  .auth-msg.ok{color:#1f8a5f}
  .auth-tip{font-size:11.5px;color:#9aa0b6;line-height:1.65;margin-top:12px;padding-top:10px;border-top:1px dashed var(--border)}
  .auth-user{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .auth-user .au-avatar{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:19px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .auth-user .au-name{font-size:16px;font-weight:800;color:var(--text)}
  .auth-user .au-mail{font-size:12.5px;color:#8a90a6;margin-top:2px}
  .modal-x{border:none;background:none;font-size:15px;color:#b6bccd;cursor:pointer;line-height:1;padding:2px 4px}
  .modal-x:hover{color:#7a819a}

  /* 猜词预热 */
  .preheat{margin-bottom:12px}
  .preheat-q{font-size:13px;color:var(--muted);margin-bottom:8px}
  .preheat-q b{color:var(--primary);font-size:15px}
  .preheat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .ph-card{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:#eef1ff;border:2px solid transparent;cursor:pointer;transition:.15s}
  .ph-card img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-card:hover{border-color:var(--primary2)}
  .ph-card.right{border-color:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.15)}
  .ph-card.wrong{border-color:#e5484d;animation:ph-shake .3s}
  /* 预热未完成前，除了三张候选图，其它内容（单词/释义/例句/配图）一律模糊，
     否则配图和例句里的中文会直接把答案说出来 */
  .learn-main.masked > *:not(.preheat){filter:blur(7px);pointer-events:none;user-select:none}
  .learn-side.masked{filter:blur(7px);pointer-events:none;user-select:none}
  @keyframes ph-shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* 矮屏（1366×768 这类）压缩字号与间距，保证仍是一屏 */
  @media (min-width:721px) and (max-height:820px){
    .word-text{font-size:32px;line-height:1.1}

  @media(max-width:720px){

    .mm2-node:hover{transform:none}
    .mm2-empty{position:static;margin-top:8px}
    .learn-main{text-align:center}
    .learn-main .example{text-align:left}
    .word-text{font-size:30px}
    .word-line{justify-content:center}
    .learn-main .word-cn{font-size:16px}
    .syl-bar{justify-content:center}
    .badge-row{justify-content:center}
    .preheat-grid{gap:6px}
  }

  /* ===== 难度切换（基础 / 中等 / 优秀） ===== */
  .diff-bar{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
  .diff-pill{padding:6px 14px;border-radius:99px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:700;color:#6b7280;cursor:pointer;transition:.15s;font-family:inherit;line-height:1.4}
  .diff-pill:hover{border-color:var(--primary);color:var(--primary)}
  .diff-pill.on{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 6px 14px rgba(79,110,247,.26)}

  /* ===== 分题型倒计时 ===== */
  .q-timer{display:flex;align-items:center;gap:10px;margin:2px 0 12px}
  .q-timer-track{flex:1;height:6px;border-radius:99px;background:#eef0f8;overflow:hidden}
  .q-timer-track i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--primary2));transition:width .12s linear}
  .q-timer-num{font-size:13px;font-weight:800;color:var(--primary);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
  .q-timer.urgent .q-timer-track i{background:linear-gradient(90deg,#ff8a8a,var(--red))}

  /* ===== 答题解析卡 ===== */

  /* ===== 消消乐：倒计时与结算 ===== */
  .bomb-top{display:flex;align-items:center;gap:12px;justify-content:center;margin:0 0 4px;flex-wrap:wrap}

  @media(max-width:720px){

<!-- 考试词库精简包：中/高考真题例句 + 英美音标 + 学段标注（由 scripts/build_learn_pack.js 生成） -->

<script>
/* ================= 单词数据 ================= */
/* 词库从 words-data.js 的 WORD_DB 加载（7549 词，按级别分组）
   字段：w 单词, cn 释义, lv 级别
   权威数据来源（均已标注出处）：
   - 音标：ECDICT 英式音标 + Wiktionary IPA（本地，免运行时查询）；有道兜底
   - 英文释义/同义词：WordNet（普林斯顿大学，开源）
   - 词频/星级/考试标签：ECDICT（MIT 开源）
   - 图片：有道配图 + AI 写实照片 + Word Atlas 插画
   - 例句：有道词典双语例句 */
const LEVELS = ["初中", "高中", "四级", "六级"];
const LEVEL_EMOJI = { "初中":"🌱", "高中":"📚", "四级":"🎓", "六级":"🏛️" };

// 例句模板库（按词义通用模板，目标词动态替换）
const EXAMPLE_TEMPLATES = [
  { en:"I learned the word \"__W__\" today.", cn:"今天我学会了单词 __W__。" },
  { en:"Can you use \"__W__\" in a sentence?", cn:"你能用 __W__ 造个句吗？" },
  { en:"The word \"__W__\" is very common in English.", cn:"__W__ 这个词在英语中很常见。" }
];

// ===== 词根词缀词典（前缀/后缀/词根，用于同源词联想） =====
const AFFIXES = [
  // 前缀
  { type:"prefix", key:"re",     text:"re-",     meaning:"再次、重新、回" },
  { type:"prefix", key:"pre",    text:"pre-",    meaning:"在前、预先" },
  { type:"prefix", key:"un",     text:"un-",     meaning:"不、无" },
  { type:"prefix", key:"dis",    text:"dis-",    meaning:"否定、分离" },
  { type:"prefix", key:"inter",  text:"inter-",  meaning:"之间、相互" },
  { type:"prefix", key:"mis",    text:"mis-",    meaning:"错误、坏" },
  { type:"prefix", key:"sub",    text:"sub-",    meaning:"在下、次" },
  { type:"prefix", key:"super",  text:"super-",  meaning:"超、上" },
  { type:"prefix", key:"trans",  text:"trans-",  meaning:"跨越、转移" },
  { type:"prefix", key:"ex",     text:"ex-",     meaning:"向外、前任" },
  { type:"prefix", key:"pro",    text:"pro-",    meaning:"向前、支持" },
  { type:"prefix", key:"over",   text:"over-",   meaning:"过度" },
  { type:"prefix", key:"under",  text:"under-",  meaning:"不足、在下" },
  { type:"prefix", key:"multi",  text:"multi-",  meaning:"多" },
  { type:"prefix", key:"anti",   text:"anti-",   meaning:"反对" },
  { type:"prefix", key:"micro",  text:"micro-",  meaning:"微" },
  // 后缀
  { type:"suffix", key:"tion",   text:"-tion",   meaning:"名词（行为、状态）" },
  { type:"suffix", key:"ment",   text:"-ment",   meaning:"名词（结果、状态）" },
  { type:"suffix", key:"ness",   text:"-ness",   meaning:"名词（性质、状态）" },
  { type:"suffix", key:"ful",    text:"-ful",    meaning:"充满…的" },
  { type:"suffix", key:"less",   text:"-less",   meaning:"无…的" },
  { type:"suffix", key:"able",   text:"-able",   meaning:"能…的" },
  { type:"suffix", key:"ly",     text:"-ly",     meaning:"副词（…地）" },
  { type:"suffix", key:"er",     text:"-er",     meaning:"做…的人/物" },
  { type:"suffix", key:"ist",    text:"-ist",    meaning:"从事…的人" },
  { type:"suffix", key:"ism",    text:"-ism",    meaning:"主义、学说" },
  { type:"suffix", key:"ity",    text:"-ity",    meaning:"性质、状态" },
  { type:"suffix", key:"ous",    text:"-ous",    meaning:"形容词（…的）" },
  { type:"suffix", key:"ive",    text:"-ive",    meaning:"形容词（…的）" },
  { type:"suffix", key:"al",     text:"-al",     meaning:"形容词（…的）" },
  { type:"suffix", key:"ic",     text:"-ic",     meaning:"形容词（…的）" },
  { type:"suffix", key:"ship",   text:"-ship",   meaning:"关系、身份" },
  { type:"suffix", key:"ize",    text:"-ize",    meaning:"动词（使…）" },
  // 词根
  { type:"root",   key:"spect",  text:"spect",   meaning:"看" },
  { type:"root",   key:"dict",   text:"dict",    meaning:"说" },
  { type:"root",   key:"port",   text:"port",    meaning:"携带" },
  { type:"root",   key:"duct",   text:"duct",    meaning:"引导" },
  { type:"root",   key:"tract",  text:"tract",   meaning:"拉" },
  { type:"root",   key:"scrib",  text:"scrib",   meaning:"写" },
  { type:"root",   key:"graph",  text:"graph",   meaning:"写、画" },
  { type:"root",   key:"phon",   text:"phon",    meaning:"声音" },
  { type:"root",   key:"photo",  text:"photo",   meaning:"光" },
  { type:"root",   key:"tele",   text:"tele",    meaning:"远" },
  { type:"root",   key:"struct", text:"struct",  meaning:"建造" },
  { type:"root",   key:"cred",   text:"cred",    meaning:"相信" },
  { type:"root",   key:"auto",   text:"auto",    meaning:"自己" },
  { type:"root",   key:"bio",    text:"bio",     meaning:"生命" },
  { type:"root",   key:"geo",    text:"geo",     meaning:"地" },
];

// 匹配单词的词根词缀（优先词根 > 前缀 > 后缀）
function matchAffixes(w){
  const lower = w.toLowerCase();
  // 词根：按长度降序匹配（长词根优先，减少误匹配）
  const roots = AFFIXES.filter(a=>a.type==="root").sort((a,b)=>b.key.length-a.key.length);
  for(const a of roots){
    if(lower.includes(a.key) && lower.length - a.key.length >= 2){
      return a;
    }
  }
  for(const a of AFFIXES){
    if(a.type !== "prefix") continue;
    if(lower.startsWith(a.key) && lower.length - a.key.length >= 3){
      return a;
    }
  }
  for(const a of AFFIXES){
    if(a.type !== "suffix") continue;
    if(lower.endsWith(a.key) && lower.length - a.key.length >= 3){
      return a;
    }
  }
  return null;
}

// 从 WORD_DB 构建 GROUPS（兼容原有渲染逻辑）
const GROUPS = LEVELS.map(lv => ({
  name: lv + "词汇",
  emoji: LEVEL_EMOJI[lv],
  level: lv,
  words: (WORD_DB[lv] || []).map(([w, cn]) => buildWord(w, cn, lv))
}));

// 构建同源词索引：词根词缀 key -> 包含该词缀的单词列表
const AFFIX_INDEX = {};
GROUPS.forEach(g => g.words.forEach(w => {
  if(w._affixKey){
    (AFFIX_INDEX[w._affixKey] = AFFIX_INDEX[w._affixKey] || []).push(w);
  }
}));
// 为每个单词填充同源词
GROUPS.forEach(g => g.words.forEach(w => {
  if(w._affixKey){
    const same = (AFFIX_INDEX[w._affixKey] || []).filter(x => x.word !== w.word);
    w.related = same.slice(0, 6).map(x => x.word + " " + x.cn);
  }
}));

// 构建例句：优先用 EXAMPLES_DATA（双语例句库），否则用模板兜底
// 词典式"元例句"（如 The word "x" is very common in English.）排序靠后，避免占坑
function buildExamples(w){
  const META_SENT = /^the word\s*["'“]/i;      // 放在函数内，避免 const 声明晚于首次调用（TDZ）
  const data = (typeof EXAMPLES_DATA !== 'undefined' && EXAMPLES_DATA[w.toLowerCase()]) || [];
  if(data.length){
    const arr = data.slice(0, 5).map(e => ({ en: e.en, cn: e.cn }));
    const normal = arr.filter(e => !META_SENT.test(e.en.replace(/<[^>]+>/g, '').trim()));
    const meta = arr.filter(e => META_SENT.test(e.en.replace(/<[^>]+>/g, '').trim()));
    return normal.concat(meta);
  }
  return EXAMPLE_TEMPLATES.map(t=>({
    en: t.en.replace(/__W__/g, `<B>${w}</B>`),
    cn: t.cn.replace(/__W__/g, w)
  }));
}
// 权威例句（报刊/通讯社来源，仅英文）：BBC / CNN / FORBES / NPR 等，供题型做「不同语境」考察
function buildExtras(w){
  const d = (typeof EXTRAS_DATA !== 'undefined' && EXTRAS_DATA[w.toLowerCase()]) || [];
  return d.map(e => ({ en: e.en, src: e.src || '报刊' }));
}

/* ---- 题型专属例句分配：同一单词在不同题型用不同句子，从多个语境反复强化 ---- */
// 规则：每个题型有长度/语种偏好，贪心挑选未被占用的句子，保证 5 个题型尽量各不相同
const TASK_META = {
  order:   { label:'句式组配', min:6,  max:13, needCn:true  },  // 碎片太多拼不动，取中短句
  trans:   { label:'双语转译', min:9,  max:18, needCn:true  },  // 汉译英，取完整中等句
  cloze:   { label:'语境填空', min:10, max:22, needCn:false },  // 线索要够猜词，优先长句/报刊句
  meaning: { label:'词义甄别', min:8,  max:20, needCn:false },  // 要有基本语境，但不与填空抢最长句
  passage: { label:'篇章研读', min:8,  max:22, needCn:false }   // 组篇通读
};
function taskExamplePool(w){
  const pool = [];
  (w.examples || []).forEach((e, i) => {
    const plain = (e.en || '').replace(/<[^>]+>/g, '');
    // 真题句带出处，题型解析里要显示；kind 单独标 exam 便于优先取用
    pool.push({ en: e.en, cn: e.cn || '', src: e.src || '', srcType: e.srcType || '', kind: e.srcType ? 'exam' : 'dict', head: /^<B>/i.test((e.en || '').trim()), tail: /<\/B>\s*[.!?"']?\s*$/.test((e.en || '').trim()), len: plain.split(/\s+/).filter(Boolean).length, idx: i });
  });
  (w.extras || []).forEach((e, i) => {
    const plain = (e.en || '').replace(/<[^>]+>/g, '');
    pool.push({ en: e.en, cn: '', src: e.src || '', kind: 'news', head: /^<B>/i.test((e.en || '').trim()), tail: /<\/B>\s*[.!?"']?\s*$/.test((e.en || '').trim()), len: plain.split(/\s+/).filter(Boolean).length, idx: i });
  });
  return pool;
}
function assignTaskExamples(w){
  if (w._taskEx) return w._taskEx;
  const pool = taskExamplePool(w);
  const assigned = {};
  const used = new Set();
  const pickFor = (task) => {
    const m = TASK_META[task];
    const cands = pool.filter(p => !used.has(p) && (!m.needCn || p.cn));
    if (!cands.length) {
      // 池子不够：退而求其次，允许复用（取长度最接近的）
      const alt = pool.slice().sort((a, b) => Math.abs(a.len - m.min) - Math.abs(b.len - m.min));
      return alt[0] || null;
    }
    let best = null, bestScore = 1e9;
    for (const p of cands) {
      let s = 0;
      if (p.len < m.min) s += (m.min - p.len) * 2.5;      // 太短，语境不足
      if (p.len > m.max) s += (p.len - m.max) * 1.8;      // 太长，认知负担大
      if (m.needCn && !p.cn) s += 99;                     // 硬性要求中文
      if (p.head && task === 'cloze') s += 2.5;            // 目标词在句首/句尾 => 两侧没有语境可猜，扣分
      if (p.tail && task === 'cloze') s += 2.5;
      if (p.kind === 'news') {                             // 报刊句语境完整：填空（要能猜词）和通读最需要
        if (task === 'cloze' || task === 'passage') s -= 3;
      } else if (p.kind === 'exam') {                       // 真题句优先用于语境类题型
        if (task === 'cloze' || task === 'passage') s -= 3.5;
      } else if (task === 'order' || task === 'trans') {
        s -= 1.2;                                          // 双语句用于组配/翻译更稳
      }
      s += p.idx * 0.01;                                   // 同分时保持稳定顺序
      if (s < bestScore) { bestScore = s; best = p; }
    }
    used.add(best);
    return best;
  };
  // 分配顺序很关键：先满足「必须有中文」的组配/翻译（只能吃双语句），
  // 再让「猜义/通读」优先拿报刊句，最后才轮到填空，避免报刊句被提前消耗
  // 篇章研读先预占一条报刊句（有两条以上时），避免它的长句被填空抢走
  const news = pool.filter(p => p.kind === 'news');
  let reserved = null;
  if (news.length >= 2) {
    reserved = news.slice().sort((a, b) => Math.abs(a.len - 16) - Math.abs(b.len - 16))[0];
    used.add(reserved);
  }
  ['order', 'trans', 'cloze', 'meaning'].forEach(t => { assigned[t] = pickFor(t); });
  assigned.passage = reserved || pickFor('passage');
  w._taskEx = assigned;
  return assigned;
}
// 取某题型该用的例句；缺失时回落到第一条
function taskExample(w, task){
  const a = assignTaskExamples(w) || {};
  return a[task] || (w.examples && w.examples[0]) || { en: w.word, cn: '' };
}

// 构建一个单词对象（动态补齐字段）
// 自定义词没写释义时，按词形从内置词库补齐（7549 词），避免整页释义空白
function cnFallback(word){
  if(!buildWord._cnIndex){
    const m = Object.create(null);
    for(const lv of Object.keys(WORD_DB)) for(const [w,c] of WORD_DB[lv]) if(!m[w.toLowerCase()]) m[w.toLowerCase()] = c;
    buildWord._cnIndex = m;
  }
  return buildWord._cnIndex[String(word||'').toLowerCase()] || '';
}
// 音标字符归一：ECDICT 用西里尔字母 ә(U+04D9)、ASCII 撇号与冒号，统一成标准 IPA 字符
function normIpa(s){
  return String(s || '')
    .replace(/\u04D9/g, 'ə')
    .replace(/\u04D8/g, 'Ə')
    .replace(/'/g, 'ˈ')
    .replace(/:/g, 'ː')
    // ECDICT 用 "." 标次重音（.dɒkju'mentəri），直接显示会变成奇怪的句点
    .replace(/\.(?=[^\s.])/g, 'ˌ');
}
function buildWord(w, cn, lv, deckId){
  if(!cn || !String(cn).trim()) cn = cnFallback(w);
  cn = String(cn == null ? '' : cn).trim() || '（暂无释义）';
  cn = cleanCnText(cn);
  let cachedImg = "";
  try{ cachedImg = localStorage.getItem('wordimg_' + w) || ""; }catch(e){}
  const affix = matchAffixes(w);
  const lw = w.toLowerCase();
  // 权威数据：ECDICT（音标/词频/星级）、WordNet（英文释义/同义词）、Wiktionary（IPA 国际音标）
  const ec = (typeof ECDICT_DATA !== 'undefined' && ECDICT_DATA[lw]) || null;
  const wn = (typeof WORDNET_DATA !== 'undefined' && WORDNET_DATA[lw]) || null;
  const ipa = (typeof WIKTIONARY_DATA !== 'undefined' && WIKTIONARY_DATA[lw]) || '';
  return {
    word: w,
    cn: cn,
    level: lv,
    ukPhonetic: ec && ec.ph ? '/' + normIpa(ec.ph) + '/' : "",   // 英式音标（ECDICT，本地，免运行时查询）
    usPhonetic: ipa ? normIpa(ipa) : "",                          // IPA 国际音标（Wiktionary，本地）
    syllables: autoSyllables(w),       // 音节自动拆分
    related: [],                        // 同源词（AFFIX_INDEX 构建后填充）
    root: affix ? { text: affix.text, meaning: affix.meaning, type: affix.type, key: affix.key } : null,
    examples: buildExamples(w),         // 双语例句（学习页展示 + 题型池）
    extras: buildExtras(w),             // 报刊/通讯社例句（题型池，制造不同语境）
    imageUrl: cachedImg,                // 优先从本地缓存读取（已生成的单词直接复用，节省额度）
    // 权威数据字段（来源已标注）
    def: wn ? wn.d : '',                        // 英文释义（WordNet）
    synonyms: wn && wn.s ? wn.s : [],           // 同义词（WordNet）
    collins: ec && ec.collins ? parseInt(ec.collins, 10) : 0,  // 柯林斯星级（ECDICT）
    oxford: !!(ec && ec.oxford),                // 牛津3000核心词（ECDICT）
    frq: ec && ec.frq ? parseInt(ec.frq, 10) : 0, // 词频（ECDICT）
    tag: ec && ec.tag ? ec.tag : '',            // 考试标签（ECDICT）
    deckId: deckId || null,                     // 所属自定义词库（内置词为空）
    _cn: cn,
    _affixKey: affix ? affix.key : null // 用于同源词索引
  };
}

// ================= 音节拆分 =================
// 数据源优先级（从高到低）：
//   ① SYL_FIX        人工校正表（syllables_extra.js）：复合词按构词边界切（class·mate）、
//                    高频词按词典写法切（sev·er·al），修正 cmudict「按发音合并音节」的问题
//   ② SYLLABLES_DATA  cmudict 音素 → 字母边界离线预生成（7463 词，权威发音词典）
//   ③ SYL_EXTRA      cmudict 未收录的 86 词，按同一规则人工补全（内置词库覆盖率 100%）
//   ④ ruleSyllables  词典外兜底（自定义词库 / 生僻词）
// 拆分标准：韦氏（Merriam-Webster）「最大音节首」+ 短元音闭音节收尾 —— ge·og·ra·phy。
function sylInfoOf(word){
  const k = String(word || '').toLowerCase().trim();
  if(!k) return null;
  if(typeof SYL_FIX !== 'undefined' && SYL_FIX[k]) return SYL_FIX[k];
  if(typeof SYLLABLES_DATA !== 'undefined' && SYLLABLES_DATA[k]) return SYLLABLES_DATA[k];
  if(typeof SYL_EXTRA !== 'undefined' && SYL_EXTRA[k]) return SYL_EXTRA[k];
  return null;
}
// 分段大小写还原：数据按小写存键，直接显示会把 China 写成 Chi·na
function matchSegCase(word, segs){
  const w = String(word), joined = segs.join('');
  if(joined === w) return segs;
  if(joined.toLowerCase() !== w.toLowerCase()) return segs;
  let pos = 0;
  return segs.map(s => { const t = w.slice(pos, pos + s.length); pos += s.length; return t; });
}
function autoSyllables(w){
  if(!w) return [{text:''}];
  // 短语 / 连字符词（look after、ice-cream）：按分隔符分段，段内不再强拆，
  // 否则会出现 " af"、"ce-" 这种怪音节，朗读和点击都不自然
  if(/[\s\-]/.test(w)){
    const segs = [];
    let buf = '', lead = '';
    for(const ch of w){
      if(ch === ' ' || ch === '-'){
        if(buf){ segs.push({ text:buf, lead }); buf = ''; }
        lead = ch;                        // 分隔符只用于显示，不参与朗读
      } else {
        buf += ch;
      }
    }
    if(buf) segs.push({ text:buf, lead });
    if(segs.length > 1) return segs.map(s => ({ text:s.text, lead:s.lead, stress:false }));
  }
  // 1) 权威数据（含人工校正）
  const info = sylInfoOf(w);
  if(info && info.l && info.l.length){
    const segs = matchSegCase(w, info.l);
    const n = info.n || segs.length;
    return segs.map((text, idx) => ({ text, stress: n > 0 && idx === info.s }));
  }
  // 2) 词典外：规则兜底
  return ruleSyllables(w).map(text => ({ text, stress:false }));
}

// 朗读分段：屏幕显示用词典写法（ge·og·ra·phy），逐段朗读要用发音式（ge-o-gra-phy）。
// 否则 "his·tor·y" 的 "y"、"fam·i·ly" 的 "i" 单独念会被读成 /waɪ/、/aɪ/，听着完全不对。
// 两套切点数量一致，高亮下标仍一一对应。
function readSyllables(w){
  if(!w) return null;
  const info = sylInfoOf(w);
  if(!info || !info.p || !info.p.length) return null;
  const s = String(w), out = [];
  let prev = 0;
  for(const c of info.p){ if(c > prev && c < s.length){ out.push(s.slice(prev, c)); prev = c; } }
  out.push(s.slice(prev));
  return out.filter(Boolean);
}

// 规则兜底拆分：元音组 + 最大音节首 + 双写辅音边界拆分
// 仅用于词典外生词。准确率不及 cmudict，但明显优于旧的「按元音组平均切」。
function ruleSyllables(w){
  const lower = w.toLowerCase();
  const L = lower.length;
  const isV = c => 'aeiouy'.includes(c);
  const groups = [];
  let i = 0;
  while(i < L){
    if(isV(lower[i])){
      let j = i;
      while(j + 1 < L && isV(lower[j + 1])) j++;
      groups.push([i, j]);
      i = j + 1;
    } else i++;
  }
  if(groups.length <= 1) return [w];
  // 相邻元音组之间的辅音，按「最大合法音节首」分配给后一个音节
  const cuts = [0];
  for(let g = 0; g < groups.length - 1; g++){
    const end = groups[g][1];
    const nextStart = groups[g + 1][0];
    const cons = lower.slice(end + 1, nextStart);
    let take = cons.length;                 // 默认全部留给前一音节（闭音节）
    for(let t = cons.length; t >= 1; t--){
      if(isLegalOnsetStr(cons.slice(cons.length - t))){ take = cons.length - t; break; }
    }
    cuts.push(end + 1 + take);
  }
  cuts.push(L);
  let out = [];
  for(let k = 0; k < cuts.length - 1; k++) out.push(w.slice(cuts[k], cuts[k + 1]));
  // 双写辅音在边界处拆分（hap-py / let-ter）
  for(let k = 0; k < out.length - 1; k++){
    const cur = out[k + 1];
    if(cur.length >= 2){
      const c = cur[0].toLowerCase();
      if(cur[1].toLowerCase() === c && !isV(c)){
        out[k] += cur[0];
        out[k + 1] = cur.slice(1);
      }
    }
  }
  // 合并无元音字母的成音节辅音段（-le 结尾除外）
  const clean = [];
  for(let k = 0; k < out.length; k++){
    const t = out[k];
    if(t && !/[aeiouy]/i.test(t) && !/le$/i.test(t) && clean.length){
      clean[clean.length - 1] += t;         // 并入前一段
    } else if(t){
      clean.push(t);
    }
  }
  return clean.length ? clean : [w];
}

// 合法英语音节首（字母串）
function isLegalOnsetStr(s){
  if(s.length <= 1) return true;
  const a = s[0], b = s[1];
  if('bcdfgkpt'.includes(a) && 'lrw'.includes(b)) return true;
  if(a === 's') return 'ptkmnwlfv'.includes(b) || b === 's';
  if(s.length === 3) return a === 's' && 'ptk'.includes(b) && 'lrw'.includes(s[2]);
  return false;
}

/* ================= 全局状态 ================= */
let currentGroup = 0;
let currentStep = 0; // 0学习 1连线 2词义选择 3选词填空 4拼写 5连词成句 6翻译 7语篇 8结果
let learnIndex = 0;
let BATCH_SIZE = 15; // 每批学习的单词数
let currentBatch = []; // 当前批次的学习词（从当前级别随机抽取）
let activeCustomWords = null; // 激活的自定义词库词对象数组（null=内置词库）
let resultRewarded = false; // 本批是否已发放通关奖励
let batchStat = { ans:0, right:0 };  // 本批答题统计（用于通关正确率奖励）
let lastResult = null;               // 本批结算数据（正确率 / 额外奖励）

// 获取当前批次的学习词（不是全部词库）
const words = () => {
  if(currentBatch.length > 0) return currentBatch;
  // 注意：空数组也是真值，必须判长度，否则会返回空批次导致后续崩溃
  if(activeCustomWords && activeCustomWords.length) return activeCustomWords.slice(0, BATCH_SIZE);
  return GROUPS[currentGroup].words.slice(0, BATCH_SIZE);
};
// 重新抽一批词
// 批次级状态：换批次/跳到某个词/错题专项复习时都要一起重置，
// 否则会出现"上一批已领通关奖励，新一批不再发"或正确率串批的问题
function resetBatchState(){
  resultRewarded = false;
  batchStat = { ans:0, right:0 };
  lastResult = null;
}
function newBatch(){
  const pool = (activeCustomWords && activeCustomWords.length) ? activeCustomWords : GROUPS[currentGroup].words;
  const n = Math.min(BATCH_SIZE, pool.length);
  currentBatch = shuffle(pool).slice(0, n);
  learnIndex = 0;
  resetBatchState();
}
// 典雅书院风命名（标题 / 菜单名 / 图标 / 副标题）

  {title:"语义词联", icon:"🍬", sub:"消消乐 · 配对消除 · 积学闯关"},
